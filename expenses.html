<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c10">
<title>Expenses · Travel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root{
  --bg:#070c10;
  --surface:#0d1318;
  --surface-2:#11181e;
  --surface-3:#151d24;
  --line:#263039;
  --line-soft:rgba(255,255,255,.065);
  --text:#f5f3ef;
  --muted:#929ca4;
  --muted-2:#66727b;
  --red:#ff625f;
  --red-soft:rgba(255,98,95,.09);
  --red-line:rgba(255,98,95,.30);
  --green:#79c995;
  --blue:#78a9ef;
  --gold:#e4bd69;
  --expense-hero-image:url("https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/expensesfooterdark.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvZXhwZW5zZXNmb290ZXJkYXJrLnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk3NDA4NzYsImV4cCI6NTc4NjA3NDg4NzZ9.qHW8Fx2gBnZoQ59wmC2hUvIzZVdNPvRFzapsLQamDYxsr3S4haiXIPflnbonoUvxXYev4oRRhXVyx3mK2mcIcQ");
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  padding-top:14px;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}

/* =========================================================
   SCHEDULE-STYLE SHELL
========================================================= */
.expenses-shell{
  position:relative;
  width:calc(100% - 24px);
  max-width:720px;
  margin:0 auto 105px;
  overflow:hidden;
  border:1px solid #273139;
  border-radius:27px;
  background:
    var(--expense-hero-image) center top / 100% 330px no-repeat,
    linear-gradient(180deg,#0a1116,#070d11);
  box-shadow:0 24px 65px rgba(0,0,0,.40);
}

.expenses-shell::before{
  content:"";
  position:absolute;
  z-index:90;
  left:18px;
  right:18px;
  top:0;
  height:3px;
  border-radius:999px;
  background:linear-gradient(90deg,#ff625f 0%,#ff827e 52%,rgba(255,98,95,.68) 100%);
  box-shadow:0 0 14px rgba(255,98,95,.24);
  pointer-events:none;
}

/* =========================================================
   HERO
========================================================= */
header{
  position:relative;
  z-index:40;
  isolation:isolate;
  width:100%;
  margin:0;
  overflow:hidden;
  border:0;
  border-radius:26px 26px 0 0;
  background:
    linear-gradient(180deg,rgba(2,5,8,.22) 0%,rgba(4,8,11,.32) 36%,rgba(5,10,14,.56) 70%,rgba(7,13,17,.77) 100%),
    linear-gradient(90deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.08) 47%,rgba(0,0,0,.20) 100%);
}

header::before{
  content:"¥";
  position:absolute;
  z-index:1;
  right:13px;
  top:4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:132px;
  font-weight:700;
  line-height:1;
  color:#ff625f;
  opacity:.065;
  text-shadow:0 0 28px rgba(255,98,95,.14);
  pointer-events:none;
  user-select:none;
}

header::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 32%,rgba(0,0,0,.16) 62%,rgba(0,0,0,.34) 100%),
    radial-gradient(circle at 86% 14%,rgba(150,28,28,.12),transparent 32%);
}

.header-inner{
  position:relative;
  z-index:2;
  width:100%;
  padding:26px 20px 18px;
}

.title-row{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
}

.title-row>div:first-child{min-width:0}

.eyebrow{
  margin-bottom:14px;
  color:#ef7d79;
  font-size:8px;
  font-weight:900;
  letter-spacing:.18em;
  text-transform:uppercase;
  text-shadow:0 1px 12px rgba(0,0,0,.70);
}

.expenses-page-title{
  display:flex;
  align-items:center;
  gap:15px;
  margin:0;
}

.expenses-page-title-icon{
  width:65px;
  height:65px;
  flex:0 0 65px;
  display:block;
  padding:10px;
  border:1px solid rgba(255,98,95,.34);
  border-radius:50%;
  background:rgba(7,13,17,.80);
  object-fit:contain;
  opacity:.92;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.012),0 8px 24px rgba(0,0,0,.25);
}

.expenses-page-title span{
  color:#f8f4ee;
  font-family:Georgia,"Times New Roman",serif;
  font-size:41px;
  font-weight:700;
  line-height:1;
  letter-spacing:-.03em;
  text-shadow:0 2px 18px rgba(0,0,0,.68);
}

.trip-name{
  margin:8px 0 0 80px;
  max-width:350px;
  overflow:hidden;
  color:#9ba4aa;
  font-size:9px;
  font-weight:500;
  line-height:1.4;
  text-overflow:ellipsis;
  white-space:nowrap;
  text-shadow:0 1px 10px rgba(0,0,0,.66);
}

.add-btn{
  flex:0 0 auto;
  min-height:29px;
  padding:0 10px;
  border:1px solid rgba(255,98,95,.38);
  border-radius:9px;
  background:rgba(255,98,95,.09);
  color:#ffb3ae;
  font-size:7px;
  font-weight:900;
  box-shadow:inset 0 0 16px rgba(255,98,95,.025),0 3px 14px rgba(0,0,0,.18);
  text-shadow:0 1px 8px rgba(0,0,0,.45);
}

.add-btn:active{transform:scale(.95)}

/* =========================================================
   MAIN — SEAMLESS FADE
========================================================= */
main{
  position:relative;
  width:100%;
  margin:0;
  padding:10px 17px 22px;
  border:0;
  border-radius:0 0 26px 26px;
  background:
    linear-gradient(180deg,rgba(7,13,17,.78) 0,rgba(8,15,20,.92) 34px,#091015 76px,#070d11 210px);
}

main::before{
  content:"";
  position:absolute;
  z-index:0;
  left:0;
  right:0;
  top:-26px;
  height:56px;
  pointer-events:none;
  background:
    linear-gradient(180deg,rgba(7,13,17,0) 0%,rgba(7,13,17,.48) 42%,rgba(7,13,17,.90) 78%,#091015 100%);
}

main>*{position:relative;z-index:1}

/* =========================================================
   SUMMARY
========================================================= */
.summary{
  padding:10px;
  border:1px solid #252f37;
  border-radius:12px;
  background:linear-gradient(145deg,rgba(20,28,34,.94),rgba(12,18,23,.96));
  box-shadow:0 5px 16px rgba(0,0,0,.11);
}

.summary-label{
  color:#89959d;
  font-size:6.2px;
  font-weight:900;
  letter-spacing:.1em;
}

.summary-total{
  margin-top:4px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:800;
  line-height:1.1;
}

.summary-sub{
  margin-top:3px;
  color:var(--muted);
  font-size:6.7px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:9px;
}

.stat{
  min-width:0;
  padding:7px;
  border:1px solid var(--line-soft);
  border-radius:8px;
  background:#10171c;
}

.stat-k{
  color:#78858d;
  font-size:5.5px;
  font-weight:900;
}

.stat-v{
  margin-top:3px;
  color:#e9e8e4;
  font-size:8px;
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================================================
   FILTERS
========================================================= */
.filters{
  display:flex;
  gap:4px;
  overflow-x:auto;
  margin:8px 0 10px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.filters::-webkit-scrollbar{display:none}

.chip{
  flex:0 0 auto;
  min-height:25px;
  padding:3px 7px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#0f161c;
  color:#8c989f;
  font-size:6.2px;
  font-weight:900;
  white-space:nowrap;
}

.chip.active{
  border-color:var(--red-line);
  background:var(--red-soft);
  color:#efb4b0;
}

/* =========================================================
   EXPENSE LIST
========================================================= */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:10px 1px 5px;
  padding-bottom:4px;
  border-bottom:1px solid var(--line-soft);
}

.section-title{
  color:#bfc5c9;
  font-size:7px;
  font-weight:900;
  letter-spacing:.1em;
}

.section-count{
  color:#69757d;
  font-size:6px;
}

.date-group{margin-bottom:8px}

.date-label{
  margin:8px 2px 4px;
  color:#7f8b93;
  font-size:6px;
  font-weight:900;
  letter-spacing:.07em;
}

.expense{
  display:flex;
  align-items:center;
  gap:7px;
  min-height:53px;
  margin-bottom:5px;
  padding:7px 8px;
  border:1px solid #252f37;
  border-radius:11px;
  background:linear-gradient(145deg,rgba(18,26,32,.96),rgba(11,17,22,.98));
  cursor:pointer;
  box-shadow:0 5px 16px rgba(0,0,0,.10);
  transition:border-color .18s ease,transform .18s ease;
}

.exp-icon{
  flex:0 0 30px;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.07);
  border-radius:8px;
  background:#141c22;
  font-size:14px;
}

.exp-main{flex:1;min-width:0}

.exp-title{
  overflow:hidden;
  color:#f1f1ef;
  font-size:7.8px;
  font-weight:900;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.exp-meta{
  margin-top:3px;
  color:#748089;
  font-size:5.9px;
}

.exp-right{text-align:right}

.exp-amount{
  color:#f3f1ed;
  font-size:8px;
  font-weight:900;
  white-space:nowrap;
}

.receipt-mark{
  margin-top:3px;
  color:#9fc2f1;
  font-size:5.7px;
}

.empty{
  padding:24px 12px;
  border:1px dashed #303b43;
  border-radius:11px;
  color:#77838b;
  font-size:7px;
  line-height:1.6;
  text-align:center;
  background:rgba(255,255,255,.012);
}

.error{
  margin-bottom:10px;
  padding:9px;
  border:1px solid var(--red-line);
  border-radius:9px;
  background:var(--red-soft);
  color:#ffc0bc;
  font-size:7px;
}

/* =========================================================
   ADD / EDIT SHEET
========================================================= */
.backdrop{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.backdrop.open{display:flex}

.sheet{
  width:100%;
  max-width:620px;
  max-height:calc(92vh - env(safe-area-inset-top));
  margin:auto auto 0;
  overflow-y:auto;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  border:1px solid var(--line);
  border-radius:20px 20px 0 0;
  background:#0c1217;
  box-shadow:0 -20px 50px rgba(0,0,0,.35);
}

.handle{
  width:36px;
  height:4px;
  margin:2px auto 13px;
  border-radius:999px;
  background:#35414a;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.sheet-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
}

.close{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#131b21;
  color:#fff;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.field{margin-bottom:9px}

.field label{
  display:block;
  margin-bottom:4px;
  color:#8d989f;
  font-size:6.5px;
  font-weight:900;
}

.field input,
.field select,
.field textarea{
  width:100%;
  min-height:40px;
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:0;
  background:#0f161c;
  color:#fff;
  font-size:9px;
}

.field textarea{
  min-height:64px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--red-line);
}

/* =========================================================
   RECEIPT
========================================================= */
.receipt-box{
  padding:9px;
  border:1px dashed #35414a;
  border-radius:11px;
  background:#0e151a;
}

.receipt-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.receipt-btn{
  min-height:37px;
  border:1px solid rgba(120,169,239,.20);
  border-radius:9px;
  background:rgba(120,169,239,.045);
  color:#a5c7f4;
  font-size:7px;
  font-weight:900;
}

.receipt-preview{
  display:none;
  position:relative;
  margin-top:8px;
}

.receipt-preview.show{display:block}

.receipt-preview img{
  display:block;
  width:100%;
  max-height:260px;
  object-fit:contain;
  border:1px solid var(--line);
  border-radius:9px;
  background:#080d11;
}

.remove-photo{
  position:absolute;
  top:7px;
  right:7px;
  min-height:28px;
  padding:0 8px;
  border:1px solid var(--red-line);
  border-radius:7px;
  background:rgba(7,12,16,.88);
  color:#f0aaa5;
  font-size:6px;
  font-weight:900;
}

.receipt-existing{
  margin-top:7px;
  color:#87949c;
  font-size:6.5px;
}

.receipt-existing a{
  color:#9fc2f1;
  text-decoration:none;
}

.save{
  width:100%;
  min-height:42px;
  margin-top:4px;
  border:1px solid rgba(121,201,149,.25);
  border-radius:10px;
  background:rgba(121,201,149,.075);
  color:#a7dbb8;
  font-size:7.5px;
  font-weight:900;
}

.delete{
  width:100%;
  min-height:38px;
  margin-top:7px;
  border:1px solid rgba(255,98,95,.18);
  border-radius:10px;
  background:rgba(255,98,95,.035);
  color:#d98a83;
  font-size:7px;
  font-weight:900;
}

.message{
  display:none;
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  font-size:7px;
}

.message.show{display:block}

.message.bad{
  border:1px solid var(--red-line);
  background:var(--red-soft);
  color:#ffc0bc;
}

.message.good{
  border:1px solid rgba(121,201,149,.22);
  background:rgba(121,201,149,.06);
  color:#a7dbb8;
}

@media(max-width:480px){
  body{padding-top:9px}

  .expenses-shell{
    width:calc(100% - 18px);
    background-size:auto 300px;
    background-position:center top;
  }

  .expenses-shell::before{
    left:11px;
    right:11px;
  }

  .header-inner{
    padding:22px 17px 15px;
  }

  .expenses-page-title-icon{
    width:60px;
    height:60px;
    flex-basis:60px;
    padding:9px;
  }

  .expenses-page-title span{
    font-size:38px;
  }

  .trip-name{
    margin-left:75px;
  }

  main{
    padding-left:14px;
    padding-right:14px;
  }

  main::before{
    top:-22px;
    height:50px;
  }
}

@media(min-width:700px){
  .expense:hover{
    border-color:#35414a;
    transform:translateY(-1px);
  }
}

/* =========================================================
   HERO IMAGE VISIBILITY FIX
   Force the exact expensesfooter.png directly into the hero,
   while keeping the same image on the shell for a seamless fade.
========================================================= */

.expenses-shell{
  background:
    var(--expense-hero-image)
    center top / 100% 360px
    no-repeat,
    linear-gradient(180deg,#0a1116,#070d11) !important;
}

header{
  min-height:185px;

  background:
    linear-gradient(
      180deg,
      rgba(2,5,8,.16) 0%,
      rgba(4,8,11,.24) 38%,
      rgba(5,10,14,.44) 72%,
      rgba(7,13,17,.64) 100%
    ),
    linear-gradient(
      90deg,
      rgba(0,0,0,.28) 0%,
      rgba(0,0,0,.05) 48%,
      rgba(0,0,0,.16) 100%
    ),
    var(--expense-hero-image)
    center top / 100% 360px
    no-repeat !important;
}

/* Softer vignette so the artwork is clearly visible */
header::after{
  background:
    radial-gradient(
      ellipse at 50% 42%,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.03) 36%,
      rgba(0,0,0,.10) 66%,
      rgba(0,0,0,.25) 100%
    ),
    radial-gradient(
      circle at 86% 14%,
      rgba(150,28,28,.09),
      transparent 34%
    ) !important;
}

/* Let the bottom of the image remain visible under the first content block */
main{
  background:
    linear-gradient(
      180deg,
      rgba(7,13,17,.48) 0px,
      rgba(8,15,20,.74) 44px,
      rgba(9,16,21,.94) 96px,
      #070d11 220px
    ) !important;
}

main::before{
  top:-34px;
  height:72px;
  background:
    linear-gradient(
      180deg,
      rgba(7,13,17,0) 0%,
      rgba(7,13,17,.22) 34%,
      rgba(7,13,17,.62) 72%,
      rgba(9,16,21,.92) 100%
    ) !important;
}

@media(max-width:480px){
  .expenses-shell{
    background:
      var(--expense-hero-image)
      center top / auto 320px
      no-repeat,
      linear-gradient(180deg,#0a1116,#070d11) !important;
  }

  header{
    min-height:175px;

    background:
      linear-gradient(
        180deg,
        rgba(2,5,8,.16) 0%,
        rgba(4,8,11,.25) 40%,
        rgba(5,10,14,.46) 74%,
        rgba(7,13,17,.66) 100%
      ),
      linear-gradient(
        90deg,
        rgba(0,0,0,.27) 0%,
        rgba(0,0,0,.05) 50%,
        rgba(0,0,0,.16) 100%
      ),
      var(--expense-hero-image)
      center top / auto 320px
      no-repeat !important;
  }
}

</style>

<meta name="apple-mobile-web-app-capable" content="yes">

<body>

<div class="expenses-shell">

<header>
  <div class="header-inner">

    <div class="title-row">

      <div>

        <div id="tripEyebrow" class="eyebrow">
          TRIP SPENDING
        </div>

        <h1 class="expenses-page-title">
          <img
            class="expenses-page-title-icon"
            src="https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Travel3Logo.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvVHJhdmVsM0xvZ28ucG5nIiwic2NvcGUiOiJkb3dubG9hZCIsImlhdCI6MTc4OTcwNDUwMiwiZXhwIjozMzMyNTcwNDUwMn0.ciD2sShYC95aeLTucRmbI-AvrtletO259ymPAGCURr4FXltkLRmqiKd_yzkwrLl_q4XGahAWzevvfVkWyGOlZg"
            alt=""
            aria-hidden="true"
          >
          <span>Expenses</span>
        </h1>

        <div id="tripName" class="trip-name">
          Loading trip…
        </div>

      </div>

      <button
        class="add-btn"
        type="button"
        onclick="openAdd()"
      >
        ＋ ADD
      </button>

    </div>

  </div>
</header>

<main>

  <div id="pageError"></div>

  <section class="summary">

    <div class="summary-label">
      TOTAL SPENT
    </div>

    <div id="totalSpent" class="summary-total">
      —
    </div>

    <div id="summarySub" class="summary-sub">
      Loading expenses…
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-k">FOOD</div>
        <div id="foodTotal" class="stat-v">—</div>
      </div>

      <div class="stat">
        <div class="stat-k">TRANSPORT</div>
        <div id="transportTotal" class="stat-v">—</div>
      </div>

      <div class="stat">
        <div class="stat-k">SHOPPING</div>
        <div id="shoppingTotal" class="stat-v">—</div>
      </div>

    </div>

  </section>

  <div id="filters" class="filters"></div>

  <div class="section-head">

    <div class="section-title">
      EXPENSE HISTORY
    </div>

    <div id="expenseCount" class="section-count"></div>

  </div>

  <div id="expenseList">
    <div class="empty">
      Loading expenses…
    </div>
  </div>

</main>

</div>

<!-- =========================================================
     ADD / EDIT SHEET
========================================================= -->

<div id="expenseSheet" class="backdrop">

  <div class="sheet">

    <div class="handle"></div>

    <div class="sheet-head">

      <div id="sheetTitle" class="sheet-title">
        Add Expense
      </div>

      <button
        class="close"
        type="button"
        onclick="closeSheet()"
      >
        ✕
      </button>

    </div>

    <form id="expenseForm">

      <div class="field">
        <label>WHAT DID YOU SPEND ON?</label>
        <input
          id="title"
          maxlength="120"
          required
          placeholder="e.g. Yakitori Tsujiya"
        >
      </div>

      <div class="grid2">

        <div class="field">
          <label>CATEGORY</label>
          <select id="category">
            <option value="food">🍜 Food</option>
            <option value="transport">🚆 Transport</option>
            <option value="accommodation">🏨 Accommodation</option>
            <option value="activity">🎟 Activity</option>
            <option value="shopping">🛍 Shopping</option>
            <option value="other">📦 Other</option>
          </select>
        </div>

        <div class="field">
          <label>DATE</label>
          <input
            id="expenseDate"
            type="date"
            required
          >
        </div>

      </div>

      <div class="grid2">

        <div class="field">
          <label>AMOUNT</label>
          <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            inputmode="decimal"
            required
            placeholder="0"
          >
        </div>

        <div class="field">
          <label>CURRENCY</label>
          <select id="currency">
            <option>JPY</option>
            <option>SGD</option>
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
            <option>KRW</option>
            <option>TWD</option>
            <option>THB</option>
            <option>MYR</option>
            <option>IDR</option>
            <option>CNY</option>
            <option>HKD</option>
          </select>
        </div>

      </div>

      <div class="grid2">

        <div class="field">
          <label>PAYMENT</label>
          <select id="paymentMethod">
            <option value="">Not specified</option>
            <option value="cash">Cash</option>
            <option value="card">Credit / Debit Card</option>
            <option value="mobile">Mobile Payment</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label>PAID BY</label>
          <input
            id="paidBy"
            maxlength="80"
            placeholder="Optional"
          >
        </div>

      </div>

      <div class="field">
        <label>NOTES</label>
        <textarea
          id="notes"
          placeholder="Optional notes…"
        ></textarea>
      </div>

      <div class="field">
        <label>RECEIPT PHOTO</label>

        <div class="receipt-box">

          <div class="receipt-actions">

            <button
              class="receipt-btn"
              type="button"
              onclick="document.getElementById('cameraInput').click()"
            >
              📷 TAKE PHOTO
            </button>

            <button
              class="receipt-btn"
              type="button"
              onclick="document.getElementById('galleryInput').click()"
            >
              🖼 CHOOSE PHOTO
            </button>

          </div>

          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
          >

          <input
            id="galleryInput"
            type="file"
            accept="image/*"
            hidden
          >

          <div id="receiptPreview" class="receipt-preview">

            <img
              id="receiptImage"
              alt="Receipt preview"
            >

            <button
              class="remove-photo"
              type="button"
              onclick="removeSelectedPhoto()"
            >
              REMOVE
            </button>

          </div>

          <div
            id="existingReceipt"
            class="receipt-existing"
          ></div>

        </div>
      </div>

      <button
        id="saveButton"
        class="save"
        type="submit"
      >
        SAVE EXPENSE
      </button>

      <button
        id="deleteButton"
        class="delete"
        type="button"
        onclick="deleteExpense()"
        style="display:none"
      >
        DELETE EXPENSE
      </button>

      <div id="formMessage" class="message"></div>

    </form>

  </div>
</div>

<div id="footer"></div>
<script src="footer.js"></script>

<script>
const RECEIPT_BUCKET="receipts";

let TRIP_ID=
  Number(
    new URLSearchParams(location.search).get("trip")
  )
  ||
  Number(
    localStorage.getItem("current_trip_id")
  )
  ||
  null;

let currentUser=null;
let currentTrip=null;
let expenses=[];
let editingId=null;
let selectedFile=null;
let removeOldReceipt=false;
let currentFilter="all";

const categories={
  food:["🍜","Food"],
  transport:["🚆","Transport"],
  accommodation:["🏨","Accommodation"],
  activity:["🎟","Activity"],
  shopping:["🛍","Shopping"],
  other:["📦","Other"]
};

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function localISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function prettyDate(s){
  return new Date(s+"T12:00:00")
    .toLocaleDateString(
      "en-SG",
      {
        weekday:"short",
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );
}

function money(amount,currency){
  try{
    return new Intl.NumberFormat(
      "en-SG",
      {
        style:"currency",
        currency:currency||"SGD",
        maximumFractionDigits:["JPY","KRW","IDR"].includes(currency)?0:2
      }
    )
    .format(Number(amount)||0);
  }catch{
    return `${currency||""} ${Number(amount||0).toFixed(2)}`;
  }
}

function showError(msg){
  document.getElementById("pageError").innerHTML=
    `<div class="error">${esc(msg)}</div>`;
}

function formMsg(msg,type="bad"){
  const x=document.getElementById("formMessage");
  x.textContent=msg;
  x.className=`message show ${type}`;
}

function clearMsg(){
  document.getElementById("formMessage").className="message";
}

async function start(){
  try{

    const {
      data:{user},
      error
    }=await db.auth.getUser();

    if(error)throw error;

    if(!user){
      location.href="login.html";
      return;
    }

    currentUser=user;

    if(!TRIP_ID){

      const r=
        await db
          .from("trips")
          .select("id")
          .eq("owner_id",user.id)
          .neq("status","deleted")
          .order("start_date",{ascending:true})
          .limit(1);

      if(r.error)throw r.error;

      if(!r.data?.length){
        throw new Error("No trip selected.");
      }

      TRIP_ID=Number(r.data[0].id);

      localStorage.setItem(
        "current_trip_id",
        String(TRIP_ID)
      );
    }

    const t=
      await db
        .from("trips")
        .select("id,name,country,owner_id")
        .eq("id",TRIP_ID)
        .single();

    if(t.error)throw t.error;

    currentTrip=t.data;

    document.getElementById("tripName").textContent=
      currentTrip.name||"My Trip";

    document.getElementById("tripEyebrow").textContent=
      currentTrip.country
      ?
      `${String(currentTrip.country).toUpperCase()} · TRIP EXPENSES`
      :
      "TRIP EXPENSES";

    document.title=
      `Expenses · ${currentTrip.name||"My Trip"}`;

    history.replaceState(
      null,
      "",
      `expenses.html?trip=${TRIP_ID}`
    );

    await loadExpenses();

  }catch(e){
    console.error(e);
    showError(e.message||"Could not load expenses.");
  }
}

async function loadExpenses(){

  const r=
    await db
      .from("trip_expenses")
      .select("*")
      .eq("trip_id",TRIP_ID)
      .order("expense_date",{ascending:false})
      .order("created_at",{ascending:false});

  if(r.error)throw r.error;

  expenses=r.data||[];

  render();
}

function render(){

  const totalByCurrency={};

  expenses.forEach(x=>{
    totalByCurrency[x.currency]=
      (totalByCurrency[x.currency]||0)
      +
      Number(x.amount||0);
  });

  const totals=
    Object.entries(totalByCurrency)
      .map(([c,v])=>money(v,c));

  document.getElementById("totalSpent").textContent=
    totals.length===1
    ?
    totals[0]
    :
    (
      totals.length
      ?
      totals.join(" + ")
      :
      "—"
    );

  document.getElementById("summarySub").textContent=
    expenses.length
    ?
    `${expenses.length} recorded expense${expenses.length===1?"":"s"} · totals kept in original currencies`
    :
    "No expenses recorded yet";

  document.getElementById("expenseCount").textContent=
    `${expenses.length}`;

  const catTotal=cat=>{

    const rows=
      expenses.filter(x=>x.category===cat);

    const by={};

    rows.forEach(x=>{
      by[x.currency]=
        (by[x.currency]||0)
        +
        Number(x.amount||0);
    });

    const a=
      Object.entries(by)
        .map(([c,v])=>money(v,c));

    return a.length
      ?
      a.join(" + ")
      :
      "—";
  };

  document.getElementById("foodTotal").textContent=
    catTotal("food");

  document.getElementById("transportTotal").textContent=
    catTotal("transport");

  document.getElementById("shoppingTotal").textContent=
    catTotal("shopping");

  const opts=[
    "all",
    ...Object.keys(categories)
  ];

  document.getElementById("filters").innerHTML=
    opts.map(
      k=>`
        <button
          class="chip ${currentFilter===k?"active":""}"
          type="button"
          onclick="setFilter('${k}')"
        >
          ${
            k==="all"
            ?
            "ALL"
            :
            categories[k][0]+" "+categories[k][1].toUpperCase()
          }
        </button>
      `
    )
    .join("");

  const rows=
    currentFilter==="all"
    ?
    expenses
    :
    expenses.filter(x=>x.category===currentFilter);

  if(!rows.length){

    document.getElementById("expenseList").innerHTML=
      `<div class="empty">${
        expenses.length
        ?
        "No expenses in this category."
        :
        'No expenses yet.<br>Tap <strong>＋ ADD</strong> after you spend something.'
      }</div>`;

    return;
  }

  const groups={};

  rows.forEach(x=>{
    (groups[x.expense_date]??=[]).push(x);
  });

  document.getElementById("expenseList").innerHTML=
    Object.entries(groups)
      .map(
        ([date,items])=>`
          <div class="date-group">
            <div class="date-label">
              ${esc(prettyDate(date).toUpperCase())}
            </div>
            ${items.map(expenseCard).join("")}
          </div>
        `
      )
      .join("");
}

function expenseCard(x){

  const c=
    categories[x.category]
    ||
    categories.other;

  return `
    <div
      class="expense"
      onclick="openEdit(${Number(x.id)})"
    >
      <div class="exp-icon">
        ${c[0]}
      </div>

      <div class="exp-main">
        <div class="exp-title">
          ${esc(x.title)}
        </div>

        <div class="exp-meta">
          ${esc(c[1])}
          ${x.payment_method?" · "+esc(x.payment_method):""}
          ${x.paid_by?" · "+esc(x.paid_by):""}
        </div>
      </div>

      <div class="exp-right">
        <div class="exp-amount">
          ${esc(money(x.amount,x.currency))}
        </div>

        ${
          x.receipt_path
          ?
          `<div class="receipt-mark">🧾 RECEIPT</div>`
          :
          ""
        }
      </div>
    </div>
  `;
}

function setFilter(k){
  currentFilter=k;
  render();
}

function resetForm(){

  editingId=null;
  selectedFile=null;
  removeOldReceipt=false;

  clearMsg();

  document.getElementById("expenseForm").reset();

  document.getElementById("expenseDate").value=
    localISO();

  document.getElementById("currency").value=
    currentTrip?.country?.toLowerCase().includes("japan")
    ?
    "JPY"
    :
    "SGD";

  document.getElementById("receiptPreview")
    .classList.remove("show");

  document.getElementById("receiptImage")
    .removeAttribute("src");

  document.getElementById("existingReceipt").innerHTML="";

  document.getElementById("deleteButton").style.display="none";
}

function openAdd(){

  resetForm();

  document.getElementById("sheetTitle").textContent=
    "Add Expense";

  document.getElementById("saveButton").textContent=
    "SAVE EXPENSE";

  document.getElementById("expenseSheet")
    .classList.add("open");
}

async function openEdit(id){

  resetForm();

  const x=
    expenses.find(
      e=>Number(e.id)===Number(id)
    );

  if(!x)return;

  editingId=id;

  document.getElementById("sheetTitle").textContent=
    "Edit Expense";

  document.getElementById("saveButton").textContent=
    "SAVE CHANGES";

  document.getElementById("title").value=
    x.title||"";

  document.getElementById("category").value=
    x.category||"other";

  document.getElementById("expenseDate").value=
    x.expense_date||localISO();

  document.getElementById("amount").value=
    x.amount??"";

  document.getElementById("currency").value=
    x.currency||"SGD";

  document.getElementById("paymentMethod").value=
    x.payment_method||"";

  document.getElementById("paidBy").value=
    x.paid_by||"";

  document.getElementById("notes").value=
    x.notes||"";

  document.getElementById("deleteButton").style.display=
    "block";

  if(x.receipt_path){

    try{

      const {data,error}=
        await db.storage
          .from(RECEIPT_BUCKET)
          .createSignedUrl(
            x.receipt_path,
            3600
          );

      if(!error&&data?.signedUrl){

        document.getElementById("existingReceipt").innerHTML=
          `Current receipt:
           <a
             href="${esc(data.signedUrl)}"
             target="_blank"
             rel="noopener"
           >
             VIEW PHOTO ↗
           </a>
           ·
           <button
             type="button"
             onclick="markRemoveReceipt()"
             style="border:0;background:none;color:#d98a83;font-size:6.5px"
           >
             REMOVE
           </button>`;
      }

    }catch{}
  }

  document.getElementById("expenseSheet")
    .classList.add("open");
}

function closeSheet(){
  document.getElementById("expenseSheet")
    .classList.remove("open");
}

document.getElementById("expenseSheet").onclick=
  e=>{
    if(e.target.id==="expenseSheet"){
      closeSheet();
    }
  };

function chooseFile(file){

  if(!file)return;

  if(!file.type.startsWith("image/")){
    formMsg("Please choose an image file.");
    return;
  }

  if(file.size>10*1024*1024){
    formMsg("Receipt image must be under 10 MB.");
    return;
  }

  selectedFile=file;
  removeOldReceipt=false;

  const img=
    document.getElementById("receiptImage");

  img.src=
    URL.createObjectURL(file);

  document.getElementById("receiptPreview")
    .classList.add("show");
}

document.getElementById("cameraInput").onchange=
  e=>chooseFile(e.target.files?.[0]);

document.getElementById("galleryInput").onchange=
  e=>chooseFile(e.target.files?.[0]);

function removeSelectedPhoto(){

  selectedFile=null;

  document.getElementById("cameraInput").value="";
  document.getElementById("galleryInput").value="";

  document.getElementById("receiptPreview")
    .classList.remove("show");
}

function markRemoveReceipt(){

  removeOldReceipt=true;

  document.getElementById("existingReceipt").innerHTML=
    "Receipt will be removed when you save.";
}

async function uploadReceipt(expenseId,file){

  const ext=
    (file.name.split(".").pop()||"jpg")
      .replace(/[^a-zA-Z0-9]/g,"")
      .toLowerCase()
    ||
    "jpg";

  const path=
    `${TRIP_ID}/${currentUser.id}/${expenseId}/${crypto.randomUUID()}.${ext}`;

  const {error}=
    await db.storage
      .from(RECEIPT_BUCKET)
      .upload(
        path,
        file,
        {
          contentType:file.type||"image/jpeg",
          upsert:false
        }
      );

  if(error)throw error;

  return path;
}

document.getElementById("expenseForm").onsubmit=
  async e=>{

    e.preventDefault();

    clearMsg();

    const btn=
      document.getElementById("saveButton");

    btn.disabled=true;
    btn.textContent="SAVING…";

    try{

      const title=
        document.getElementById("title")
          .value
          .trim();

      const amount=
        Number(
          document.getElementById("amount").value
        );

      if(!title){
        throw new Error("Please enter what you spent on.");
      }

      if(!Number.isFinite(amount)||amount<0){
        throw new Error("Please enter a valid amount.");
      }

      const payload={
        trip_id:TRIP_ID,
        user_id:currentUser.id,
        title,
        category:document.getElementById("category").value,
        amount,
        currency:document.getElementById("currency").value,
        expense_date:document.getElementById("expenseDate").value,
        payment_method:document.getElementById("paymentMethod").value||null,
        paid_by:document.getElementById("paidBy").value.trim()||null,
        notes:document.getElementById("notes").value.trim()||null,
        updated_at:new Date().toISOString()
      };

      let row;
      let oldPath=null;

      if(editingId){

        const old=
          expenses.find(
            x=>Number(x.id)===Number(editingId)
          );

        oldPath=
          old?.receipt_path||null;

        const r=
          await db
            .from("trip_expenses")
            .update(payload)
            .eq("id",editingId)
            .eq("trip_id",TRIP_ID)
            .select()
            .single();

        if(r.error)throw r.error;

        row=r.data;

      }else{

        const r=
          await db
            .from("trip_expenses")
            .insert(payload)
            .select()
            .single();

        if(r.error)throw r.error;

        row=r.data;
      }

      let receiptPath=
        row.receipt_path||oldPath;

      if(selectedFile){

        const newPath=
          await uploadReceipt(
            row.id,
            selectedFile
          );

        if(oldPath){
          await db.storage
            .from(RECEIPT_BUCKET)
            .remove([oldPath]);
        }

        receiptPath=newPath;

      }else if(removeOldReceipt&&oldPath){

        await db.storage
          .from(RECEIPT_BUCKET)
          .remove([oldPath]);

        receiptPath=null;
      }

      if(receiptPath!==row.receipt_path){

        const u=
          await db
            .from("trip_expenses")
            .update({
              receipt_path:receiptPath,
              updated_at:new Date().toISOString()
            })
            .eq("id",row.id)
            .eq("trip_id",TRIP_ID);

        if(u.error)throw u.error;
      }

      formMsg(
        editingId
        ?
        "Expense updated."
        :
        "Expense saved.",
        "good"
      );

      await loadExpenses();

      setTimeout(
        closeSheet,
        350
      );

    }catch(err){

      console.error(err);

      formMsg(
        err.message||
        "Could not save expense."
      );

    }finally{

      btn.disabled=false;

      btn.textContent=
        editingId
        ?
        "SAVE CHANGES"
        :
        "SAVE EXPENSE";
    }
  };

async function deleteExpense(){

  if(
    !editingId
    ||
    !confirm("Delete this expense?")
  ){
    return;
  }

  try{

    const x=
      expenses.find(
        e=>Number(e.id)===Number(editingId)
      );

    if(x?.receipt_path){
      await db.storage
        .from(RECEIPT_BUCKET)
        .remove([x.receipt_path]);
    }

    const r=
      await db
        .from("trip_expenses")
        .delete()
        .eq("id",editingId)
        .eq("trip_id",TRIP_ID);

    if(r.error)throw r.error;

    closeSheet();

    await loadExpenses();

  }catch(e){

    formMsg(
      e.message||
      "Could not delete expense."
    );
  }
}

start();
</script>
