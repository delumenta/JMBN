<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#05090c">

<title>Home Guide · Travel</title>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#030608;
  --surface:#0b1217;
  --surface-2:#10181e;
  --line:#29343c;
  --line-soft:rgba(255,255,255,.065);

  --text:#f5f2ed;
  --muted:#939da4;

  --red:#ff625f;
  --red-2:#ff8b87;
  --red-soft:rgba(255,98,95,.09);
  --red-line:rgba(255,98,95,.34);
}


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;
  min-height:100%;
}


body{
  min-height:100svh;
  overflow:hidden;

  color:var(--text);

  background:
    radial-gradient(
      circle at 50% -5%,
      rgba(48,61,70,.18),
      transparent 30%
    ),
    var(--bg);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}


button{
  font:inherit;
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   PAGE
========================================================= */

.tutorial-page{
  min-height:100svh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px;
}


.tutorial-shell{
  position:relative;

  width:min(100%,720px);

  max-height:
    calc(
      100svh - 16px
    );

  aspect-ratio:709 / 1536;

  overflow:hidden;

  border:1px solid #273139;
  border-radius:27px;

  background:#070d11;

  box-shadow:
    0 24px 65px rgba(0,0,0,.48);
}


.tutorial-shell::before{
  content:"";

  position:absolute;
  z-index:80;

  left:17px;
  right:17px;
  top:0;

  height:3px;

  border-radius:999px;

  background:
    linear-gradient(
      90deg,
      #ff625f,
      #ff827e 52%,
      rgba(255,98,95,.68)
    );

  box-shadow:
    0 0 14px rgba(255,98,95,.24);

  pointer-events:none;
}


/* =========================================================
   SCREENSHOT
========================================================= */

.screen-image{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center top;

  user-select:none;
  pointer-events:none;

  opacity:1;

  transition:
    opacity .18s ease;
}


/* =========================================================
   SKIP
========================================================= */

.skip-btn{
  position:absolute;

  z-index:60;

  top:
    calc(
      15px +
      env(safe-area-inset-top)
    );

  right:16px;

  min-height:30px;

  padding:0 10px;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius:9px;

  background:
    rgba(10,17,22,.90);

  color:#aab3b9;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.06em;

  cursor:pointer;

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}


/* =========================================================
   SPOTLIGHT
========================================================= */

.focus-ring{
  position:absolute;

  z-index:25;

  border:
    1.5px solid rgba(255,115,111,.98);

  border-radius:16px;

  box-shadow:
    0 0 0 9999px rgba(1,4,6,.72),
    inset 0 0 0 1px rgba(255,255,255,.025),
    0 0 0 4px rgba(255,98,95,.07),
    0 0 24px rgba(255,98,95,.28);

  transition:
    left .34s cubic-bezier(.2,.82,.2,1),
    top .34s cubic-bezier(.2,.82,.2,1),
    width .34s cubic-bezier(.2,.82,.2,1),
    height .34s cubic-bezier(.2,.82,.2,1),
    border-radius .22s ease;

  pointer-events:none;
}


.focus-ring::before{
  content:"";

  position:absolute;

  inset:-1px;

  border-radius:inherit;

  background:
    linear-gradient(
      145deg,
      rgba(255,98,95,.06),
      transparent 60%
    );

  pointer-events:none;
}


/* =========================================================
   TAP MARKER
========================================================= */

.tap-hint{
  position:absolute;

  z-index:30;

  width:22px;
  height:22px;

  border:
    1px solid rgba(255,98,95,.75);

  border-radius:50%;

  background:
    rgba(20,8,10,.74);

  box-shadow:
    0 0 0 4px rgba(255,98,95,.07),
    0 0 18px rgba(255,98,95,.25);

  transform:
    translate(-50%,-50%);

  pointer-events:none;

  animation:
    tapPulse
    1.35s
    ease-in-out
    infinite;
}


.tap-hint::after{
  content:"";

  position:absolute;

  inset:6px;

  border-radius:50%;

  background:#ff7b77;
}


@keyframes tapPulse{

  0%,
  100%{
    transform:
      translate(-50%,-50%)
      scale(.90);

    opacity:.82;
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(1.12);

    opacity:1;
  }

}


/* =========================================================
   GUIDE CARD
========================================================= */

.guide-card{
  position:absolute;

  z-index:50;

  left:16px;
  right:16px;

  padding:
    11px
    13px
    10px;

  overflow:hidden;

  border:
    1px solid #2b3740;

  border-radius:17px;

  background:
    radial-gradient(
      circle at 92% 0%,
      rgba(255,98,95,.055),
      transparent 28%
    ),
    linear-gradient(
      150deg,
      rgba(17,26,32,.97),
      rgba(9,16,21,.98)
    );

  box-shadow:
    0 18px 48px rgba(0,0,0,.50);

  backdrop-filter:
    blur(16px)
    saturate(115%);

  -webkit-backdrop-filter:
    blur(16px)
    saturate(115%);

  transition:
    top .28s ease,
    bottom .28s ease;
}


.guide-card::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:2px;

  background:
    linear-gradient(
      180deg,
      #ff746f,
      rgba(255,98,95,.40)
    );

  box-shadow:
    0 0 9px rgba(255,98,95,.13);
}


.guide-card::after{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      rgba(255,98,95,.46),
      rgba(255,98,95,.11),
      transparent 75%
    );

  pointer-events:none;
}


/* =========================================================
   GUIDE CONTENT
========================================================= */

.guide-number{
  color:#df7775;

  font-size:6px;
  font-weight:900;

  letter-spacing:.12em;

  text-transform:uppercase;
}


.guide-title{
  margin:
    5px
    0
    0;

  color:#f6f2ec;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:17px;
  font-weight:700;

  line-height:1.08;

  letter-spacing:-.02em;
}


.guide-text{
  margin:
    6px
    0
    0;

  color:#949fa6;

  font-size:7px;

  line-height:1.55;
}


/* =========================================================
   GUIDE ACTIONS
========================================================= */

.guide-actions{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:10px;

  padding-top:8px;

  border-top:
    1px solid var(--line-soft);
}


.progress-dots{
  display:flex;

  align-items:center;

  gap:5px;
}


.progress-dot{
  width:5px;
  height:5px;

  border-radius:999px;

  background:#39454d;

  transition:
    all .22s ease;
}


.progress-dot.active{
  width:17px;

  background:var(--red);

  box-shadow:
    0 0 9px rgba(255,98,95,.20);
}


.guide-buttons{
  display:flex;

  align-items:center;

  gap:5px;
}


.guide-btn{
  min-height:29px;

  padding:0 10px;

  border:
    1px solid #2b363e;

  border-radius:8px;

  background:#10181d;

  color:#9ca7ad;

  font-size:6.3px;
  font-weight:900;

  letter-spacing:.05em;

  cursor:pointer;
}


.guide-btn.primary{
  border-color:var(--red-line);

  background:var(--red-soft);

  color:#ffb0ab;
}


.guide-btn:active{
  transform:scale(.96);
}


.guide-btn[hidden]{
  display:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  .tutorial-page{
    padding:0;
  }


  .tutorial-shell{
    width:100vw;
    height:100svh;

    max-height:none;

    aspect-ratio:auto;

    border:0;
    border-radius:0;
  }


  .tutorial-shell::before{
    left:17px;
    right:17px;
  }


  .guide-card{
    left:14px;
    right:14px;
  }


  .skip-btn{
    right:14px;
  }

}

</style>

</head>



<body>


<div class="tutorial-page">


  <div
    id="tutorialStage"
    class="tutorial-shell"
  >


    <!-- =====================================================
         HOME SCREENSHOT
    ====================================================== -->

    <img
      id="screenImage"
      class="screen-image"
      src=""
      alt="Home page tutorial"
    >



    <!-- =====================================================
         SKIP
    ====================================================== -->

    <button
      id="skipBtn"
      class="skip-btn"
      type="button"
    >
      SKIP
    </button>



    <!-- =====================================================
         SPOTLIGHT
    ====================================================== -->

    <div
      id="focusRing"
      class="focus-ring"
    ></div>


    <div
      id="tapHint"
      class="tap-hint"
    ></div>



    <!-- =====================================================
         GUIDE CARD
    ====================================================== -->

    <section
      id="guideCard"
      class="guide-card"
      aria-live="polite"
    >


      <div
        id="guideNumber"
        class="guide-number"
      ></div>


      <h1
        id="guideTitle"
        class="guide-title"
      ></h1>


      <p
        id="guideText"
        class="guide-text"
      ></p>


      <div class="guide-actions">


        <div
          id="progressDots"
          class="progress-dots"
        ></div>


        <div class="guide-buttons">


          <button
            id="backBtn"
            class="guide-btn"
            type="button"
          >
            BACK
          </button>


          <button
            id="nextBtn"
            class="guide-btn primary"
            type="button"
          >
            NEXT →
          </button>


        </div>


      </div>


    </section>


  </div>


</div>



<script>

/* =========================================================
   SCREENSHOTS
========================================================= */

const SCREEN_MANAGE_TRIP =
  "https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Screenshot_20260920_214756_Chrome.jpg?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvU2NyZWVuc2hvdF8yMDI2MDkyMF8yMTQ3NTZfQ2hyb21lLmpwZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk5MTIyMjYsImV4cCI6MzMzMjU5MTIyMjZ9.USTE0vaXfkyMfZWLTTp53CUlMYyCeOICgCpLmlHIybc_cnrGTtdHNQstlnGgnIk1XA__tJhN67o6ebonYRXF7A";


const SCREEN_ITINERARY =
  "https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Screenshot_20260920_214802_Chrome.jpg?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvU2NyZWVuc2hvdF8yMDI2MDkyMF8yMTQ4MDJfQ2hyb21lLmpwZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk5MTIzNTMsImV4cCI6MzMzMjU5MTIzNTN9.d8s5siDhsz-gomLR1t2-JhVo8TE_FYuXcvQKO_6ii-JKHHzt9f_ruY7npVDac20Qr-mM5JBgDemL5FApj_0wGA";


/* =========================================================
   HOME TUTORIAL — 3 STEPS ONLY
========================================================= */

const tutorialSteps = [

  {
    title:
      "Manage your trips",

    text:
      "Tap MANAGE TRIP to switch between trips, view all your trips, or create a new one.",

    image:
      SCREEN_MANAGE_TRIP,

    box:{
      left:5.0,
      top:21.8,
      width:48.5,
      height:5.1,
      radius:13
    },

    tap:{
      x:36.5,
      y:24.3
    },

    card:
      "bottom"
  },


  {
    title:
      "Switch between days",

    text:
      "Swipe through TRIP DAYS, then tap any date to switch the itinerary preview to that day.",

    image:
      SCREEN_ITINERARY,

    box:{
      left:4.8,
      top:4.4,
      width:90.5,
      height:15.2,
      radius:17
    },

    tap:{
      x:39.5,
      y:12.6
    },

    card:
      "bottom"
  },


  {
    title:
      "View the full schedule",

    text:
      "Tap VIEW FULL PLAN to open your complete itinerary and schedule.",

    image:
      SCREEN_ITINERARY,

    box:{
      left:69.5,
      top:25.8,
      width:24.5,
      height:7.2,
      radius:18
    },

    tap:{
      x:83.0,
      y:29.4
    },

    card:
      "top"
  }

];



/* =========================================================
   STATE
========================================================= */

let currentStep =
  0;



/* =========================================================
   ELEMENTS
========================================================= */

const screenImage =
  document.getElementById(
    "screenImage"
  );


const focusRing =
  document.getElementById(
    "focusRing"
  );


const tapHint =
  document.getElementById(
    "tapHint"
  );


const guideCard =
  document.getElementById(
    "guideCard"
  );


const guideNumber =
  document.getElementById(
    "guideNumber"
  );


const guideTitle =
  document.getElementById(
    "guideTitle"
  );


const guideText =
  document.getElementById(
    "guideText"
  );


const progressDots =
  document.getElementById(
    "progressDots"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


const nextBtn =
  document.getElementById(
    "nextBtn"
  );


const skipBtn =
  document.getElementById(
    "skipBtn"
  );



/* =========================================================
   PROGRESS
========================================================= */

function renderDots(){

  progressDots.innerHTML =
    tutorialSteps
      .map(
        (_,index) => `

          <span
            class="progress-dot ${
              index === currentStep
              ?
              "active"
              :
              ""
            }"
          ></span>

        `
      )
      .join("");

}



/* =========================================================
   KEEP TRIP PARAMETER
========================================================= */

function withTrip(page){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const tripId =
    params.get(
      "trip"
    )
    ||
    localStorage.getItem(
      "current_trip_id"
    );


  if(!tripId){

    return page;

  }


  return (
    page
    +
    "?trip="
    +
    encodeURIComponent(
      tripId
    )
  );

}



/* =========================================================
   NEXT GUIDE
========================================================= */

function finishTutorial(){

  localStorage.setItem(
    "index1_tutorial_seen",
    "1"
  );


  window.location.href =
    withTrip(
      "index2-tutorial.html"
    );

}



/* =========================================================
   CHANGE SCREENSHOT
========================================================= */

function setScreenshot(src){

  if(
    screenImage.src ===
    src
  ){

    return;

  }


  screenImage.style.opacity =
    ".35";


  const preload =
    new Image();


  preload.onload =
    () => {

      screenImage.src =
        src;


      requestAnimationFrame(
        () => {

          screenImage.style.opacity =
            "1";

        }
      );

    };


  preload.src =
    src;

}



/* =========================================================
   RENDER STEP
========================================================= */

function renderStep(){

  const step =
    tutorialSteps[
      currentStep
    ];


  const box =
    step.box;


  setScreenshot(
    step.image
  );


  focusRing.style.left =
    box.left + "%";


  focusRing.style.top =
    box.top + "%";


  focusRing.style.width =
    box.width + "%";


  focusRing.style.height =
    box.height + "%";


  focusRing.style.borderRadius =
    (
      box.radius
      ||
      14
    )
    +
    "px";


  tapHint.style.left =
    step.tap.x + "%";


  tapHint.style.top =
    step.tap.y + "%";


  guideNumber.textContent =
    `STEP ${
      currentStep + 1
    } OF ${
      tutorialSteps.length
    }`;


  guideTitle.textContent =
    step.title;


  guideText.textContent =
    step.text;


  guideCard.style.top =
    "";


  guideCard.style.bottom =
    "";


  if(
    step.card ===
    "top"
  ){

    guideCard.style.top =
      "9.5%";

  }

  else{

    guideCard.style.bottom =
      "4.2%";

  }


  backBtn.hidden =
    currentStep === 0;


  nextBtn.textContent =
    currentStep ===
    tutorialSteps.length - 1

    ?

    "NEXT GUIDE →"

    :

    "NEXT →";


  renderDots();

}



/* =========================================================
   BACK
========================================================= */

backBtn.onclick =
  () => {

    if(
      currentStep > 0
    ){

      currentStep -= 1;

      renderStep();

    }

  };



/* =========================================================
   NEXT
========================================================= */

nextBtn.onclick =
  () => {

    if(
      currentStep <
      tutorialSteps.length - 1
    ){

      currentStep += 1;

      renderStep();

      return;

    }


    finishTutorial();

  };



/* =========================================================
   SKIP
========================================================= */

skipBtn.onclick =
  finishTutorial;



/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "ArrowRight"
    ){

      nextBtn.click();

    }


    if(
      event.key ===
      "ArrowLeft"
      &&
      currentStep > 0
    ){

      backBtn.click();

    }


    if(
      event.key ===
      "Escape"
    ){

      finishTutorial();

    }

  }
);



/* =========================================================
   START
========================================================= */

renderStep();

</script>


</body>

</html>
