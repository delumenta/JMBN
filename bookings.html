<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#070c10">

<title>Bookings · Japan Trip</title>

<style>
/* Shared visual system with food.html + schedule.html */
:root{
  --bg:#070c10;
  --surface:#0d1318;
  --surface-2:#11181e;
  --surface-3:#151d24;
  --line:#263039;
  --line-soft:rgba(255,255,255,.065);
  --text:#f5f3ef;
  --muted:#929ca4;
  --muted-2:#66727b;
  --red:#ff625f;
  --red-soft:rgba(255,98,95,.09);
  --red-line:rgba(255,98,95,.30);
  --green:#79c995;
  --orange:#efa875;
  --blue:#78a9ef;
  --gold:#e4bd69;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -8%,rgba(42,56,68,.30),transparent 28%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,input,textarea,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}

/* =========================================================
   HEADER — MATCHES FOOD / PLAN
========================================================= */
header{
  position:sticky;
  top:0;
  z-index:40;
  border-bottom:1px solid var(--line-soft);
  background:rgba(7,12,16,.965);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px 0;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.title-row>div:first-child{min-width:0}

.eyebrow{
  margin-bottom:2px;
  color:var(--red);
  font-size:7px;
  font-weight:900;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.booking-page-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin:0;
}

.booking-page-title-icon{
  width:44px;
  height:44px;
  flex:0 0 44px;
  display:block;
  object-fit:contain;
}

.booking-page-title span{
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;
  font-weight:700;
  line-height:1;
}

.trip-name{
  margin:3px 0 0 53px;
  overflow:hidden;
  color:var(--muted);
  font-size:8px;
  font-weight:600;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.add-btn{
  flex:0 0 auto;
  min-height:36px;
  padding:7px 11px;
  border:1px solid var(--red-line);
  border-radius:10px;
  background:var(--red-soft);
  color:#f3b7b3;
  font-size:8px;
  font-weight:900;
  letter-spacing:.04em;
  cursor:pointer;
}

.add-btn:active{transform:scale(.95)}

/* =========================================================
   MAIN
========================================================= */
main{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:14px 14px 100px;
}

/* =========================================================
   SUMMARY
========================================================= */
.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-bottom:10px;
}

.summary-card{
  min-width:0;
  padding:10px 7px;
  border:1px solid #252f37;
  border-radius:12px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.10);
}

.summary-number{
  font-family:Georgia,"Times New Roman",serif;
  font-size:21px;
  font-weight:800;
  line-height:1;
}

.summary-label{
  margin-top:4px;
  color:#748089;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.05em;
}

.summary-card.action .summary-number{color:var(--orange)}
.summary-card.booked .summary-number{color:var(--green)}

/* =========================================================
   STATUS FILTERS — SAME CHIP LANGUAGE AS FOOD
========================================================= */
.filters,
.type-filters{
  display:flex;
  align-items:center;
  gap:5px;
  width:100%;
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.filters::-webkit-scrollbar,
.type-filters::-webkit-scrollbar{display:none}

.filters{margin-bottom:6px}
.type-filters{
  margin-bottom:15px;
  padding-bottom:1px;
}

.filter-btn,
.type-filter{
  flex:0 0 auto;
  min-height:27px;
  padding:4px 9px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(17,24,30,.80);
  color:#8d979e;
  font-size:7px;
  font-weight:850;
  white-space:nowrap;
  cursor:pointer;
}

.filter-btn.active{
  border-color:var(--red-line);
  background:var(--red-soft);
  color:#f0c0bc;
}

.type-filter{
  min-height:26px;
  background:#0f161c;
  color:#77838b;
}

.type-filter.active{
  border-color:rgba(120,169,239,.25);
  background:rgba(120,169,239,.055);
  color:#a7c7f3;
}

/* =========================================================
   SECTION
========================================================= */
.section{margin-bottom:20px}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:2px 1px 8px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line-soft);
}

.section-title{
  color:#bfc5c9;
  font-size:8px;
  font-weight:900;
  letter-spacing:.07em;
}

.section-title.action{color:var(--orange)}
.section-title.booked{color:var(--green)}

.section-count{
  color:#626e76;
  font-size:7px;
  font-weight:900;
}

/* =========================================================
   DATE GROUP
========================================================= */
.date-group{margin-bottom:12px}

.date-label{
  margin:0 2px 6px;
  color:#78858d;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.08em;
}

/* =========================================================
   BOOKING CARD
========================================================= */
.booking-card{
  position:relative;
  margin-bottom:8px;
  padding:11px 11px 9px;
  overflow:hidden;
  border:1px solid #252f37;
  border-radius:14px;
  background:linear-gradient(145deg,rgba(20,28,34,.97),rgba(12,18,23,.98));
  box-shadow:0 6px 18px rgba(0,0,0,.13);
  cursor:pointer;
  transition:border-color .18s ease,transform .18s ease;
}

.booking-card::before{
  content:"";
  position:absolute;
  top:0;
  left:13px;
  right:13px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
}

.booking-top{
  display:flex;
  align-items:flex-start;
  gap:9px;
}

.booking-icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,98,95,.16);
  border-radius:10px;
  background:rgba(255,98,95,.055);
  font-size:16px;
}

.booking-main{
  flex:1;
  min-width:0;
}

.booking-title{
  color:#f8f7f4;
  font-size:10px;
  font-weight:900;
  line-height:1.3;
}

.booking-meta{
  margin-top:3px;
  color:#919ba2;
  font-size:7.5px;
  line-height:1.4;
}

.booking-note{
  margin-top:6px;
  color:#8f999f;
  font-size:7.5px;
  line-height:1.5;
}

/* STATUS */
.status-badge{
  flex:0 0 auto;
  padding:2px 5px;
  border:1px solid rgba(255,255,255,.07);
  border-radius:999px;
  background:rgba(255,255,255,.025);
  font-size:6px;
  font-weight:900;
  white-space:nowrap;
}

.status-badge.planned{
  border-color:rgba(238,168,117,.22);
  background:rgba(238,168,117,.055);
  color:#efb07d;
}

.status-badge.booked{
  border-color:rgba(121,201,149,.22);
  background:rgba(121,201,149,.055);
  color:#9edab3;
}

.status-badge.cancelled{
  color:#7f8990;
}

/* DETAILS */
.detail-row{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:8px;
}

.detail-pill{
  display:inline-flex;
  align-items:center;
  min-height:22px;
  padding:3px 6px;
  border:0;
  border-radius:6px;
  background:rgba(255,255,255,.035);
  color:#aab3b9;
  font-size:6.5px;
  font-weight:800;
}

.detail-pill.link{
  border:1px solid rgba(120,169,239,.16);
  background:rgba(120,169,239,.035);
  color:#91b9ef;
  text-decoration:none;
}

/* QUICK BOOK */
.quick-book{
  width:100%;
  min-height:29px;
  margin-top:9px;
  padding:5px 8px;
  border:1px solid rgba(121,201,149,.18);
  border-radius:8px;
  background:rgba(121,201,149,.035);
  color:#8fd0a6;
  font-size:6.5px;
  font-weight:900;
  cursor:pointer;
}

/* =========================================================
   EMPTY / STATE
========================================================= */
.empty,
.state{
  padding:36px 18px;
  border:1px dashed #303b43;
  border-radius:14px;
  background:rgba(255,255,255,.012);
  color:#77838b;
  font-size:8px;
  line-height:1.6;
  text-align:center;
}

.empty strong,
.state strong{
  display:block;
  margin-bottom:5px;
  color:#e8e7e3;
  font-family:Georgia,"Times New Roman",serif;
  font-size:14px;
  font-weight:700;
}

/* =========================================================
   FIRST BOOKING STATE
========================================================= */

.booking-first-use{
  padding:28px 18px 22px;
  border:1px dashed #303b43;
  border-radius:16px;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,98,95,.07),transparent 38%),
    rgba(255,255,255,.012);
  text-align:center;
}

.booking-first-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 11px;
  border:1px solid rgba(255,98,95,.20);
  border-radius:15px;
  background:rgba(255,98,95,.05);
  font-size:23px;
}

.booking-first-use strong{
  display:block;
  color:#f0ede8;
  font-family:Georgia,"Times New Roman",serif;
  font-size:17px;
  font-weight:700;
}

.booking-first-copy{
  max-width:410px;
  margin:7px auto 0;
  color:#7d8992;
  font-size:8px;
  line-height:1.6;
}

.booking-first-primary{
  width:100%;
  max-width:330px;
  min-height:42px;
  margin-top:15px;
  border:1px solid rgba(255,98,95,.48);
  border-radius:11px;
  background:rgba(255,98,95,.09);
  color:#efaaa5;
  font-size:7px;
  font-weight:900;
  letter-spacing:.04em;
}

.booking-quick-label{
  margin-top:15px;
  color:#66737b;
  font-size:6px;
  font-weight:900;
  letter-spacing:.14em;
}

.booking-quick-grid{
  max-width:360px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:7px auto 0;
}

.booking-quick{
  min-height:42px;
  padding:6px 3px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:9px;
  background:rgba(255,255,255,.018);
  color:#9aa5ac;
  font-size:6.2px;
  font-weight:850;
}

@media(max-width:420px){
  .booking-quick-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* =========================================================
   ADD / EDIT SHEET — SAME AS FOOD / PLAN
========================================================= */
.sheet-backdrop{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.sheet-backdrop.open{display:flex}

.sheet{
  width:100%;
  max-width:620px;
  max-height:calc(92vh - env(safe-area-inset-top));
  margin:0 auto;
  padding:8px 14px calc(18px + env(safe-area-inset-bottom));
  overflow-y:auto;
  border:1px solid var(--line);
  border-radius:20px 20px 0 0;
  background:#0c1217;
  box-shadow:0 -20px 50px rgba(0,0,0,.35);
}

.sheet-handle{
  width:36px;
  height:4px;
  margin:2px auto 13px;
  border-radius:999px;
  background:#35414a;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.sheet-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
}

.close-btn{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#131b21;
  color:#fff;
  cursor:pointer;
}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.field.full{grid-column:1/-1}

.field label{
  display:block;
  margin-bottom:4px;
  color:#8d989f;
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.04em;
}

.field input,
.field textarea,
.field select{
  width:100%;
  min-height:40px;
  padding:8px 9px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:0;
  background:#0f161c;
  color:#fff;
  font-size:9px;
}

.field textarea{
  min-height:76px;
  resize:vertical;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:var(--red-line);
}

.sheet-actions{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:6px;
  margin-top:11px;
}

.delete-btn,
.save-btn{
  min-height:43px;
  border-radius:10px;
  font-size:8px;
  font-weight:900;
  cursor:pointer;
}

.delete-btn{
  border:1px solid rgba(255,98,95,.20);
  background:rgba(255,98,95,.04);
  color:#d98a83;
}

.save-btn{
  border:1px solid rgba(121,201,149,.24);
  background:rgba(121,201,149,.07);
  color:#a7dbb8;
}

.save-btn:disabled,
.delete-btn:disabled{opacity:.5}

.form-message{
  display:none;
  margin-top:8px;
  padding:8px;
  border-radius:8px;
  font-size:8px;
}

.form-message.error{
  display:block;
  border:1px solid rgba(255,98,95,.20);
  background:rgba(255,98,95,.055);
  color:#f3aaa6;
}

/* =========================================================
   MOBILE
========================================================= */
@media(max-width:480px){
  .header-inner{padding-left:12px;padding-right:12px}
  main{padding-left:12px;padding-right:12px}

  .booking-page-title-icon{
    width:40px;
    height:40px;
    flex-basis:40px;
  }

  .booking-page-title span{font-size:25px}
  .trip-name{margin-left:49px}

  .booking-card{padding:10px}
}

/* =========================================================
   DESKTOP
========================================================= */
@media(min-width:700px){
  .booking-card:hover{
    border-color:#35414a;
    transform:translateY(-1px);
  }
}

/* =========================================================
   PLAN-MATCHED BOOKINGS — SAFE VISUAL OVERRIDE
========================================================= */

/* One continuous Schedule-style framed surface */
.booking-shell{

function text(value){

  return String(
    value ?? ""

}


function esc(value){

  return text(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function parseDate(value){

  return new Date(
    value +
    "T12:00:00"
  );

}


function prettyDate(value){

  if(!value){
    return "NO DATE";
  }


  return new Intl.DateTimeFormat(
    "en-SG",
    {
      weekday:"short",
      day:"numeric",
      month:"short"
    }
  )
  .format(
    parseDate(value)
  )
  .toUpperCase();

}


function prettyTime(value){

  if(!value){
    return "";
  }


  const parts =
    value.split(":");


  let hour =
    Number(
      parts[0]
    );


  const minute =
    parts[1] || "00";


  const suffix =
    hour >= 12
    ?
    "PM"
    :
    "AM";


  hour =
    hour % 12 || 12;


  return `${hour}:${minute} ${suffix}`;

}

/* =========================================================
   DATE GROUPS
========================================================= */

function tripDayNumber(dateValue, fallback){

  if(
    !dateValue ||
    dateValue === "undated" ||
    !trip?.start_date
  ){
    return fallback;
  }


  const start =
    new Date(
      trip.start_date +
      "T12:00:00"
    );


  const current =
    new Date(
      dateValue +
      "T12:00:00"
    );


  const diff =
    Math.round(
      (
        current -
        start
      )
      /
      86400000
    );


  return (
    Number.isFinite(diff)
    ?
    diff + 1
    :
    fallback
  );

}


function dayRouteSummary(items){

  const locations =
    items
      .map(
        item =>
          text(
            item.location_name
          ).trim()
      )
      .filter(Boolean);


  const explicitRoute =
    locations.find(
      value =>
        value.includes("→")
        ||
        value.includes("->")
    );


  if(explicitRoute){
    return explicitRoute;
  }


  const uniqueLocations =
    [
      ...new Set(
        locations
      )
    ];


  if(uniqueLocations.length >= 2){

    return (
      uniqueLocations[0] +
      " → " +
      uniqueLocations[
        uniqueLocations.length - 1
      ]
    );

  }


  if(uniqueLocations.length === 1){
    return uniqueLocations[0];
  }


  return "Bookings";

}


function bookingStampKanji(items){

  const value =
    norm(
      items
        .map(
          item =>
            [
              item.location_name,
              item.address,
              item.title
            ]
            .filter(Boolean)
            .join(" ")
        )
        .join(" ")
    );


  if(
    value.includes("osaka") ||
    value.includes("namba") ||
    value.includes("dotonbori") ||
    value.includes("kix")
  ){
    return "大阪";
  }


  if(
    value.includes("kyoto") ||
    value.includes("gion") ||
    value.includes("arashiyama")
  ){
    return "京都";
  }


  if(value.includes("nara")){
    return "奈良";
  }


  if(value.includes("nagoya")){
    return "名古屋";
  }


  if(
    value.includes("koya") ||
    value.includes("koyasan")
  ){
    return "高野";
  }


  if(value.includes("wakayama")){
    return "和歌山";
  }


  if(value.includes("nachi")){
    return "那智";
  }


  if(value.includes("kumano")){
    return "熊野";
  }


  if(value.includes("tokyo")){
    return "東京";
  }


  return "予約";

}


function timelineTypeLabel(type){

  switch(type){

    case "accommodation":
      return "Stay";

    case "restaurant":
      return "Food";

    case "ticket":
      return "Ticket";

    case "transport":
      return "Transport";

    case "car":
      return "Car";

    case "activity":
      return "Activity";

    default:
      return "Booking";

  }

}


function renderDateGroups(items){

  const groups = {};


  items.forEach(
    item => {

      const key =
        item.booking_date ||
        "undated";


      if(!groups[key]){
        groups[key] = [];
      }


      groups[key].push(item);

    }
  );


  const dates =
    Object.keys(groups)
      .sort(
        (a,b) => {

          if(a === "undated"){
            return 1;
          }

          if(b === "undated"){
            return -1;
          }

          return a.localeCompare(b);

        }
      );


  return dates
    .map(
      (date,index) => {

        const dayItems =
          groups[date];


        const dayNumber =
          tripDayNumber(
            date,
            index + 1
          );


        const route =
          dayRouteSummary(
            dayItems
          );


        let weekday =
          "UNDATED";

        let stampDate =
          "NO DATE";


        if(date !== "undated"){

          const d =
            parseDate(date);


          weekday =
            new Intl.DateTimeFormat(
              "en-SG",
              {
                weekday:"long"
              }
            )
            .format(d)
            .toUpperCase();


          stampDate =
            new Intl.DateTimeFormat(
              "en-SG",
              {
                day:"numeric",
                month:"short"
              }
            )
            .format(d)
            .toUpperCase();

        }


        const countText =
          `${dayItems.length} ${
            dayItems.length === 1
            ?
            "booking"
            :
            "bookings"
          }`;


        return `

          <div class="date-group">

            <div class="day-booking-head">

              <div class="day-route">

                ${
                  date === "undated"
                  ?
                  "UNDATED"
                  :
                  `DAY ${String(dayNumber).padStart(2,"0")} · ${esc(route)}`
                }

              </div>


              <div class="day-count">

                ${esc(countText)}

              </div>


              <div class="day-stamp">

                <div class="day-stamp-weekday">
                  ${esc(weekday)}
                </div>

                <div class="day-stamp-date">
                  ${esc(stampDate)}
                </div>

                <div class="day-stamp-kanji">
                  ${bookingStampKanji(dayItems)}
                </div>

              </div>

            </div>


            <div class="timeline-list">

              ${
                dayItems
                  .map(
                    bookingHTML
                  )
                  .join("")
              }

            </div>

          </div>

        `;

      }
    )
    .join("");

}

    )
    .forEach(
      button => {

        button.onclick =
          () => {

            statusFilter =
              button.dataset
                .statusFilter;


            render();

          };

      }
    );


  document
    .querySelectorAll(
      "[data-type-filter]"
    )
    .forEach(
      button => {

        button.onclick =
          () => {

            typeFilter =
              button.dataset
                .typeFilter;


            render();

          };

      }
    );

}


/* =========================================================
   BIND CARDS
========================================================= */

function bindCards(){

  document
    .querySelectorAll(
      "[data-booking-id]"
    )
    .forEach(
      card => {

        card.onclick =
          event => {

            if(
              event.target.closest(
                "[data-mark-booked]"
              )
            ){
              return;
            }


            if(
              event.target.closest(
                "a"
              )
            ){
              return;
            }


            openEdit(
              Number(
                card.dataset.bookingId
              )
            );

          };

      }
    );


  document
    .querySelectorAll(
      "[data-mark-booked]"
    )
    .forEach(
      button => {

        button.onclick =
          async event => {

            event.stopPropagation();


            await markBooked(
              Number(
                button.dataset
                  .markBooked
              )
            );

          };

      }
    );

}


/* =========================================================
   QUICK MARK BOOKED
========================================================= */

async function markBooked(id){

  const result =
    await db
      .from("bookings")
      .update({
        status:"booked"
      })
      .eq(
        "id",
        id
      )
      .eq(
        "trip_id",
        TRIP_ID
      );


  if(result.error){

    alert(
      result.error.message
    );

    return;

  }


  await reloadBookings();

}


/* =========================================================
   OPEN ADD
========================================================= */

document.getElementById(
  "addButton"
).onclick =
  openAdd;


function openQuickAdd(
  type,
  title=""
){

  openAdd();


  fieldType.value =
    type;


  if(title){

    fieldTitle.value =
      title;

  }


  fieldTitle.focus();

}


function openAdd(){

  editingId =
    null;


  sheetTitle.textContent =
    "＋ Add Booking";


  deleteButton.style.display =
    "none";


  fieldStatus.value =
    "planned";


  fieldType.value =
    "ticket";


  fieldTitle.value =
    "";


  fieldDate.value =
    "";


  fieldTime.value =
    "";


  fieldProvider.value =
    "";


  fieldLocation.value =
    "";


  fieldAddress.value =
    "";


  fieldConfirmation.value =
    "";


  fieldUrl.value =
    "";


  fieldAmount.value =
    "";


  fieldCurrency.value =
    "JPY";


  fieldNotes.value =
    "";


  formMessage.className =
    "form-message";


  bookingSheet.classList
    .add(
      "open"
    );

}


/* =========================================================
   OPEN EDIT
========================================================= */

function openEdit(id){

  const item =
    bookings.find(
      row =>
        Number(row.id) ===
        Number(id)
    );


  if(!item){
    return;
  }


  editingId =
    item.id;


  sheetTitle.textContent =
    "Edit Booking";


  deleteButton.style.display =
    "block";


  fieldStatus.value =
    item.status ||
    "planned";


  fieldType.value =
    item.booking_type ||
    "other";


  fieldTitle.value =
    item.title ||
    "";


  fieldDate.value =
    item.booking_date ||
    "";


  fieldTime.value =
    item.start_time
    ?
    item.start_time.slice(0,5)
    :
    "";


  fieldProvider.value =
    item.provider ||
    "";


  fieldLocation.value =
    item.location_name ||
    "";


  fieldAddress.value =
    item.address ||
    "";


  fieldConfirmation.value =
    item.confirmation_number ||
    "";


  fieldUrl.value =
    item.booking_url ||
    "";


  fieldAmount.value =
    item.amount ??
    "";


  fieldCurrency.value =
    item.currency ||
    "JPY";


  fieldNotes.value =
    item.notes ||
    "";


  formMessage.className =
    "form-message";


  bookingSheet.classList
    .add(
      "open"
    );

}


/* =========================================================
   CLOSE SHEET
========================================================= */

document.getElementById(
  "closeSheet"
).onclick =
  closeSheet;


bookingSheet.onclick =
  event => {

    if(
      event.target ===
      bookingSheet
    ){

      closeSheet();

    }

  };


function closeSheet(){

  bookingSheet.classList
    .remove(
      "open"
    );

}


/* =========================================================
   SAVE
========================================================= */

document.getElementById(
  "bookingForm"
).addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    saveButton.disabled =
      true;


    saveButton.textContent =
      "SAVING…";


    formMessage.className =
      "form-message";


    try{


      const title =
        fieldTitle.value.trim();


      if(!title){

        throw new Error(
          "Please enter a title."
        );

      }


      const payload = {

        trip_id:
          TRIP_ID,

        booking_type:
          fieldType.value,

        title:
          title,

        provider:
          fieldProvider.value
            .trim() ||
          null,

        booking_date:
          fieldDate.value ||
          null,

        start_time:
          fieldTime.value
          ?
          `${fieldTime.value}:00`
          :
          null,

        status:
          fieldStatus.value,

        confirmation_number:
          fieldConfirmation.value
            .trim() ||
          null,

        location_name:
          fieldLocation.value
            .trim() ||
          null,

        address:
          fieldAddress.value
            .trim() ||
          null,

        booking_url:
          fieldUrl.value
            .trim() ||
          null,

        amount:
          fieldAmount.value !== ""
          ?
          Number(
            fieldAmount.value
          )
          :
          null,

        currency:
          fieldCurrency.value,

        notes:
          fieldNotes.value
            .trim() ||
          null

      };


      /*
        ADD
      */

      if(
        editingId === null
      ){

        const result =
          await db
            .from("bookings")
            .insert(
              payload
            );


        if(result.error){
          throw result.error;
        }

      }


      /*
        EDIT
      */

      else{

        const result =
          await db
            .from("bookings")
            .update(
              payload
            )
            .eq(
              "id",
              editingId
            )
            .eq(
              "trip_id",
              TRIP_ID
            );


        if(result.error){
          throw result.error;
        }

      }


      closeSheet();


      await reloadBookings();

    }

    catch(error){

      console.error(error);


      formMessage.textContent =
        error.message ||
        "Couldn't save booking.";


      formMessage.className =
        "form-message error";

    }

    finally{

      saveButton.disabled =
        false;


      saveButton.textContent =
        "SAVE";

    }

  }
);


/* =========================================================
   DELETE
========================================================= */

deleteButton.onclick =
  async () => {

    if(
      editingId === null
    ){
      return;
    }


    const item =
      bookings.find(
        row =>
          Number(row.id) ===
          Number(editingId)
      );


    if(!item){
      return;
    }


    const okay =
      confirm(
        `Delete "${item.title}"?`
      );


    if(!okay){
      return;
    }


    deleteButton.disabled =
      true;


    try{


      const result =
        await db
          .from("bookings")
          .delete()
          .eq(
            "id",
            editingId
          )
          .eq(
            "trip_id",
            TRIP_ID
          );


      if(result.error){
        throw result.error;
      }


      closeSheet();


      await reloadBookings();

    }

    catch(error){

      console.error(error);


      formMessage.textContent =
        error.message ||
        "Couldn't delete booking.";


      formMessage.className =
        "form-message error";

    }

    finally{

      deleteButton.disabled =
        false;

    }

  };


/* =========================================================
   RELOAD
========================================================= */

async function reloadBookings(){

  const result =
    await db
      .from("bookings")
      .select(`
        id,
        trip_id,
        booking_type,
        title,
        provider,
        booking_date,
        start_time,
        status,
        confirmation_number,
        restaurant_id,
        place_id,
        location_name,
        address,
        booking_url,
        amount,
        currency,
        notes,
        created_at,
        updated_at
      `)
      .eq(
        "trip_id",
        TRIP_ID
      )
      .order(
        "booking_date",
        {
          ascending:true,
          nullsFirst:false
        }
      )
      .order(
        "start_time",
        {
          ascending:true,
          nullsFirst:false
        }
      );


  if(result.error){
    throw result.error;
  }


  bookings =
    result.data || [];


  render();

}
