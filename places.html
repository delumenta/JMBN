<!doctype html>
<html lang="en">

<title>Places · Shared Itineraries</title>


<style>

:root{
  --bg:#070c10;
  --panel:#10161c;
  --panel2:#151c23;
  --line:#29323b;
  --text:#f5f5f3;

*{

}

html{

}

body{

    radial-gradient(

      #17212a 0%,

    var(--bg);

button,

}

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;

  top:0;

  z-index:40;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    11px;

  border-bottom:
    1px solid
    var(--line);

  background:
    rgba(7,12,16,.96);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:

}

.header-inner{

}

.eyebrow{

  font-size:8px;
  font-weight:900;

  letter-spacing:.14em;
}

.header-row{

  align-items:center;

  gap:10px;
}

h1{

    3px
    0
    0;

    Georgia,

    serif;

}

.header-sub{

/* =========================================================
   MAIN
========================================================= */

main{
  max-width:760px;

  margin:auto;

  padding:
    12px
    13px
    30px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-wrap{
  position:relative;

  margin-bottom:14px;
}

.search-icon{
  position:absolute;

  left:11px;
  top:50%;

    translateY(-50%);

  font-size:13px;
}

.search{

  min-height:42px;

    11px
    8px
    34px;

  border:
    1px solid

  border-radius:12px;

  outline:none;

  background:#10171d;

  color:#fff;

  font-size:9px;
}

.search::placeholder{

}

.search:focus{

    rgba(201,111,104,.55);

  box-shadow:
    0 0 0 2px

}


/* =========================================================
   SECTION
========================================================= */

.section-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin:
    0
    2px
    8px;
}

.section-label{

  font-size:7px;
  font-weight:900;

  letter-spacing:.13em;
}

.result-count{

  font-size:7px;
}


/* =========================================================
   FEED
========================================================= */

.feed{
  display:grid;

  gap:9px;
}

.trip-card{

  overflow:hidden;

  padding:0;

  border:
    1px solid
    var(--line);

  background:
    linear-gradient(
      145deg,
      #141c22,

    );

  transition:
    transform .12s ease,

}

.trip-card:hover{

    rgba(201,111,104,.30);
}

.trip-card:active{
  transform:
    scale(.995);
}

.card-strip{
  height:4px;

  background:
    linear-gradient(
      90deg,
      var(--red),
      #754541
    );
}

.card-body{
  padding:11px;
}

.card-top{
  display:flex;

  align-items:flex-start;

  gap:10px;
}

.country-icon{
  flex:0 0 43px;

  width:43px;
  height:43px;

  display:flex;

  align-items:center;
  justify-content:center;

  border:
    1px solid
    var(--line);

  border-radius:12px;

  background:#182129;

  font-size:23px;
}

.card-main{
  flex:1;

  min-width:0;
}

.card-name{
  overflow:hidden;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:17px;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.card-country{
  margin-top:2px;

}

.card-dates{
  margin-top:5px;

}

.card-description{

  margin-top:7px;

  font-size:7px;
  line-height:1.45;

/* =========================================================
   PERSON
========================================================= */

.person-row{

  align-items:center;

    21px

.sheet-top{

<script src="supabase.js"></script>


<script>

/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let publications = [];

let filtered = [];

let selectedPublication = null;

let selectedItems = [];

const pageParams =
  new URLSearchParams(
    window.location.search
  );

let currentTripId =
  Number(
    pageParams.get("trip")
  )
  ||
  Number(
    localStorage.getItem(
      "current_trip_id"
    )
  )
  ||
  null;


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function norm(value){

  return String(
    value ?? ""
  )
  .trim()
  .toLowerCase();

}


function initials(name){

  const words =
    String(
      name || "?"
    )
    .trim()
    .split(/\s+/)
    .filter(Boolean);


  if(!words.length){

    return "?";

  }


  if(words.length === 1){

    return words[0]
      .slice(
        0,
        2
      )
      .toUpperCase();

  }


  return (
    words[0][0]
    +
    words[
      words.length - 1
    ][0]
  )
  .toUpperCase();

}


function avatarHTML(
  item,
  cssClass="avatar"
){

  const name =
    item.owner_name ||
    "Traveller";


  if(item.owner_avatar){

    return `

      <div class="${cssClass}">

        <img
          src="${esc(item.owner_avatar)}"
          alt="${esc(name)}"
        >

      </div>

    `;

  }


  return `

    <div class="${cssClass}">

      ${esc(
        initials(name)
      )}

    </div>

  `;

}


function countryEmoji(country){

  const value =
    norm(country);


  const map = {

    japan:"🇯🇵",

    singapore:"🇸🇬",

    malaysia:"🇲🇾",

    indonesia:"🇮🇩",

    thailand:"🇹🇭",

    vietnam:"🇻🇳",

    taiwan:"🇹🇼",

    china:"🇨🇳",

    korea:"🇰🇷",

    "south korea":"🇰🇷",

    france:"🇫🇷",

    italy:"🇮🇹",

    spain:"🇪🇸",

    uk:"🇬🇧",

    "united kingdom":"🇬🇧",

    usa:"🇺🇸",

    "united states":"🇺🇸"

  };


  return (
    map[value]
    ||
    "✈️"
  );

}


function prettyDate(
  value,
  year=true
){

  if(!value){

    return "";

  }


  const date =
    new Date(
      value +
      "T12:00:00"
    );


  return date.toLocaleDateString(
    "en-SG",

    year
    ?

    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }

    :

    {
      day:"numeric",
      month:"short"
    }

  );

}


function tripDates(item){

  if(
    item.start_date &&
    item.end_date
  ){

    return (
      prettyDate(
        item.start_date,
        false
      )
      +
      " – "
      +
      prettyDate(
        item.end_date,
        true
      )
    );

  }


  return "Dates not set";

}


function tripDays(item){

  if(
    !item.start_date ||
    !item.end_date
  ){

    return "";

  }


  const start =
    new Date(
      item.start_date +
      "T12:00:00"
    );


  const end =
    new Date(
      item.end_date +
      "T12:00:00"
    );


  const diff =
    Math.round(
      (
        end - start
      )
      /
      86400000
    )
    +
    1;


  return (
    diff > 0
    ?
    `${diff} days`
    :
    ""
  );

}


function formatTime(value){

  if(!value){

    return "";

  }


  const match =
    String(value)
      .match(
        /^(\d{2}):(\d{2})/
      );


  if(!match){

    return value;

  }


  return (
    match[1]
    +
    ":"
    +
    match[2]
  );

}


function dayLabel(dateString){

  if(!dateString){

    return "Trip Day";

  }


  const date =
    new Date(
      dateString +
      "T12:00:00"
    );


  return date.toLocaleDateString(
    "en-SG",
    {
      weekday:"long",
      day:"numeric",
      month:"short"
    }
  );

}


/* =========================================================
   START
========================================================= */

async function start(){

  try{

    const auth =
      await db.auth.getUser();


    if(auth.error){

      throw auth.error;

    }


    currentUser =
      auth.data.user;


    if(!currentUser){

      location.href =
        "login.html";

      return;

    }



    await loadFeed();


    /*
      If arriving from:

      trips.html → SHARE

      automatically open
      that itinerary.
    */

    const params =
      new URLSearchParams(
        location.search
      );


    const openId =
      Number(
        params.get(
          "open"
        )
      );


    if(openId){

      const found =
        publications.find(
          item =>
            Number(
              item.publication_id
            )
            ===
            openId
        );


      if(found){

        await openItinerary(
          openId
        );

      }

    }

  }


  catch(error){

    console.error(
      error
    );


    document.getElementById(
      "feed"
    ).innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Places
        </strong>

        ${esc(
          error.message ||
          "Unknown error."
        )}

      </div>

    `;

  }

}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed(){

  const result =
    await db.rpc(
      "get_shared_itineraries"
    );


  if(result.error){

    throw result.error;

  }


  publications =
    result.data || [];


  filtered =
    [
      ...publications
    ];


  renderFeed();

}


/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
  "search"
)
.addEventListener(
  "input",
  event => {

    const query =
      norm(
        event.target.value
      );


    if(!query){

      filtered =
        [
          ...publications
        ];

    }


    else{

      filtered =
        publications.filter(
          item => {

            const text =
              [
                item.trip_name,
                item.country,
                item.description,
                item.owner_name
              ]
              .join(" ")
              .toLowerCase();


            return text.includes(
              query
            );

          }
        );

    }


    renderFeed();

  }
);


/* =========================================================
   RENDER FEED
========================================================= */

function renderFeed(){

  document.getElementById(
    "resultCount"
  ).textContent =
    String(
      filtered.length
    );


  const feed =
    document.getElementById(
      "feed"
    );


  if(!filtered.length){

    feed.innerHTML = `

      <div class="state">

        <strong>
          No itineraries found
        </strong>

        Shared trips will appear here.

      </div>

    `;


    return;

  }


  feed.innerHTML =
    filtered
      .map(
        item =>
          feedCard(
            item
          )
      )
      .join("");


  feed
    .querySelectorAll(
      "[data-publication]"
    )
    .forEach(
      card => {

        card.onclick =
          () =>
            openItinerary(
              Number(
                card.dataset.publication
              )
            );

      }
    );

}

/* =========================================================
   OPEN ITINERARY
========================================================= */

async function openItinerary(
  publicationId
){

  selectedPublication =
    publications.find(
      item =>
        Number(
          item.publication_id
        )
        ===
        Number(
          publicationId
        )
    );


  if(!selectedPublication){

    return;

  }


  selectedItems = [];


  renderItineraryHeader();


  document.getElementById(
    "itineraryBody"
  ).innerHTML = `

    <div class="state">

      <strong>
        Loading itinerary…
      </strong>

      Getting the schedule.

    </div>

  `;


  document.getElementById(
    "itineraryBackdrop"
  )
  .classList
  .add(
    "open"
  );


  try{

    const result =
      await db.rpc(
        "get_shared_itinerary_items",
        {
          p_publication_id:
            Number(
              publicationId
            )
        }
      );


    if(result.error){

      throw result.error;

    }


    selectedItems =
      result.data || [];


    renderItinerary();

  }


  catch(error){

    console.error(
      error
    );


    document.getElementById(
      "itineraryBody"
    ).innerHTML = `

      <div class="state">

        <strong>
          Couldn't load itinerary
        </strong>

        ${esc(
          error.message ||
          "Unknown error."
        )}

      </div>

    `;

  }

}

/* =========================================================
   RENDER ITINERARY
========================================================= */

function renderItinerary(){

  const body =
    document.getElementById(
      "itineraryBody"
    );


  if(!selectedItems.length){

    body.innerHTML = `

      <div class="state">

        <strong>
          No itinerary items
        </strong>

        This traveller hasn't added
        any schedule items yet.

      </div>

    `;


    return;

  }


  const grouped = {};


  selectedItems.forEach(
    item => {

      const date =
        item.schedule_date ||
        "unknown";


      if(!grouped[date]){

        grouped[date] = [];

      }


      grouped[date].push(
        item
      );

    }
  );


  body.innerHTML = `

    <div class="itinerary">

      ${
        Object
          .entries(
            grouped
          )
          .map(
            ([date,items]) => {

              return `

                <section class="day">

                  <div class="day-head">

                    <div class="day-title">

                      ${
                        date === "unknown"

                        ?

                        "Trip Day"

                        :

                        esc(
                          dayLabel(
                            date
                          )
                        )
                      }

                    </div>


                    <div class="day-weekday">

                      ${items.length}

                      ${
                        items.length === 1
                        ?
                        "stop"
                        :
                        "stops"
                      }

                    </div>

                  </div>


                  <div class="timeline">

                    ${
                      items
                        .map(
                          renderItem
                        )
                        .join("")
                    }

                  </div>

                </section>

              `;

            }
          )
          .join("")
      }

    </div>


    <div class="copy-note">

      📋 Copying creates your own independent trip.

      It copies the shared itinerary only.

      Private bookings and trip members
      are not copied.

    </div>

  `;

}

   SCHEDULE ITEM
========================================================= */

            "Untitled"
          )}


          ${
            item.is_optional

            ?

            `

                OPTIONAL
              </span>
            `

            :

            ""
          }

        </div>


        ${
          item.location_name

          ?

          `
            <div class="item-location">

              📍

              ${esc(
                item.location_name
              )}

            </div>
          `

          :

          ""
        }


        ${
          item.description

          ?

          `

              ${esc(

/* =========================================================
   CLOSE ITINERARY
========================================================= */

function closeItinerary(){

  document.getElementById(
    "itineraryBackdrop"
  )
  .classList
  .remove(
    "open"
  );


  selectedPublication =
    null;


  selectedItems = [];


  history.replaceState(
    null,
    "",
    currentTripId
    ?
    `places.html?trip=${currentTripId}`
    :
    "places.html"
  );

}


document.getElementById(
  "itineraryBackdrop"
).onclick =
  event => {

    if(
      event.target ===
      document.getElementById(
        "itineraryBackdrop"
      )
    ){

      closeItinerary();

    }

  };


/* =========================================================
   LIKE
========================================================= */

async function toggleLike(){

  if(!selectedPublication){

    return;

  }


  const publicationId =
    Number(
      selectedPublication.publication_id
    );


  const button =
    document.getElementById(
      "likeButton"
    );


  if(button){

    button.disabled =
      true;

  }


  try{

    const result =
      await db.rpc(
        "toggle_trip_like",
        {
          p_publication_id:
            publicationId
        }
      );


    if(result.error){

      throw result.error;

    }


    const response =
      Array.isArray(
        result.data
      )

      ?

      result.data[0]

      :

      result.data;


    const liked =
      Boolean(
        response?.liked
      );


    const likeCount =
      Number(
        response?.like_count ||
        0
      );


    publications =
      publications.map(
        item =>
          Number(
            item.publication_id
          ) ===
          publicationId

          ?

          {
            ...item,

            liked_by_me:
              liked,

            like_count:
              likeCount
          }

          :

          item
      );


    filtered =
      filtered.map(
        item =>
          Number(
            item.publication_id
          ) ===
          publicationId

          ?

          {
            ...item,

            liked_by_me:
              liked,

            like_count:
              likeCount
          }

          :

          item
      );


    selectedPublication =
      {
        ...selectedPublication,

        liked_by_me:
          liked,

        like_count:
          likeCount
      };


    renderFeed();

    renderItineraryHeader();

  }


  catch(error){

    console.error(
      error
    );


    alert(
      "Couldn't update like.\n\n"
      +
      (
        error.message ||
        "Unknown error."
      )
    );

  }


  finally{

    const refreshed =
      document.getElementById(
        "likeButton"
      );


    if(refreshed){

      refreshed.disabled =
        false;

    }

  }

}


/* =========================================================
   COPY ITINERARY
========================================================= */

async function copyItinerary(){

  if(
    !selectedPublication ||
    !selectedPublication.allow_copy
  ){

    return;

  }


  const yes =
    confirm(
      `Copy "${selectedPublication.trip_name}" into your trips?`
    );


  if(!yes){

    return;

  }


  const button =
    document.getElementById(
      "copyButton"
    );


  button.disabled =
    true;


  button.textContent =
    "COPYING…";


  let newTripId =
    null;


  try{

    /*
      Make sure itinerary items
      have been loaded.
    */

    if(!selectedItems.length){

      const result =
        await db.rpc(
          "get_shared_itinerary_items",
          {
            p_publication_id:
              Number(
                selectedPublication.publication_id
              )
          }
        );


      if(result.error){

        throw result.error;

      }


      selectedItems =
        result.data || [];

    }


    /*
      1. CREATE NEW TRIP
    */

    const tripResult =
      await db
        .from(
          "trips"
        )
        .insert({

          owner_id:
            currentUser.id,

          name:
            (
              selectedPublication.trip_name ||
              "Copied Trip"
            )
            +
            " · Copy",

          country:
            selectedPublication.country ||
            null,

          start_date:
            selectedPublication.start_date ||
            null,

          end_date:
            selectedPublication.end_date ||
            null,

          description:
            selectedPublication.description ||
            null,

          status:
            "active"

        })
        .select()
        .single();


    if(tripResult.error){

      throw tripResult.error;

    }


    newTripId =
      Number(
        tripResult.data.id
      );


    /*
      2. COPY SCHEDULE
    */

    if(selectedItems.length){

      const scheduleRows =
        selectedItems.map(
          (item,index) => ({

            trip_id:
              newTripId,

            schedule_date:
              item.schedule_date ||
              null,

            start_time:
              item.start_time ||
              null,

            end_time:
              item.end_time ||
              null,

            time_label:
              item.time_label ||
              null,

            sort_order:
              Number(
                item.sort_order
              )
              ||
              (
                index + 1
              ),

            title:
              item.title ||
              "Untitled",

            item_type:
              item.item_type ||
              "custom",

            description:
              item.description ||
              null,

            location_name:
              item.location_name ||
              null,

            address:
              item.address ||
              null,

            maps_url:
              item.maps_url ||
              null,

            is_optional:
              Boolean(
                item.is_optional
              ),

            place_id:
              item.place_id ||
              null,

            restaurant_id:
              item.restaurant_id ||
              null

          })
        );


      const scheduleResult =
        await db
          .from(
            "schedule"
          )
          .insert(
            scheduleRows
          );


      if(scheduleResult.error){

        throw scheduleResult.error;

      }

    }


    /*
      3. RECORD COPY
    */

    const copyResult =
      await db
        .from(
          "trip_copies"
        )
        .insert({

          publication_id:
            Number(
              selectedPublication.publication_id
            ),

          copied_by:
            currentUser.id,

          new_trip_id:
            newTripId

        });


    if(copyResult.error){

      throw copyResult.error;

    }


    /*
      4. MAKE COPY CURRENT
    */

    localStorage.setItem(
      "current_trip_id",
      String(
        newTripId
      )
    );


    alert(
      "Trip copied! Your copy is now separate from the original."
    );


    location.href =
      `index.html?trip=${newTripId}`;

  }


  catch(error){

    console.error(
      error
    );


    /*
      Delete incomplete copy
      if something failed.
    */

    if(newTripId){

      try{

        await db
          .from(
            "trips"
          )
          .delete()
          .eq(
            "id",
            newTripId
          )
          .eq(
            "owner_id",
            currentUser.id
          );

      }


      catch(cleanupError){

        console.warn(
          "Copy cleanup failed:",
          cleanupError
        );

      }

    }


    alert(
      "Couldn't copy this itinerary.\n\n"
      +
      (
        error.message ||
        "Unknown error."
      )
    );


    button.disabled =
      false;


    button.textContent =
      "📋 COPY ITINERARY";

  }

}
