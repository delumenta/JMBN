<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#05090c">

<title>My Trips · Travel</title>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#05090c;

  --surface:#0b1217;
  --surface-2:#0f171d;
  --surface-3:#141d24;

  --line:#28323a;
  --line-soft:rgba(255,255,255,.06);

  --text:#f5f2ed;
  --muted:#909aa1;
  --muted-2:#69757d;

  --red:#e96d6b;
  --red-bright:#ff625f;
  --red-soft:rgba(255,98,95,.08);
  --red-line:rgba(255,98,95,.32);

  --green:#79c995;
  --gold:#e4bd69;
  --blue:#78a9ef;

  --trips-hero-image:
    url("https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/file_000000007b6c8211976e7acf0494ed12.png?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvZmlsZV8wMDAwMDAwMDdiNmM4MjExOTc2ZTdhY2YwNDk0ZWQxMi5wbmciLCJzY29wZSI6ImRvd25sb2FkIiwiaWF0IjoxNzg5ODI1Mzg3LCJleHAiOjQ3NDgyOTgyNTM4N30.jREu3eAdzELhfjipJApbChxtSwp3QQvPJvJ102Tt9nFm1uuHTcMFKoVp4iVJQnGJ76mRoUYV-dcEKCyriBMt9w");
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  padding-top:14px;
  color:var(--text);

  background:
    radial-gradient(
      circle at 50% -5%,
      rgba(48,61,70,.20),
      transparent 30%
    ),
    #030608;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}


/* =========================================================
   APP SHELL
========================================================= */

.trips-shell{
  position:relative;

  width:calc(100% - 24px);
  max-width:720px;

  margin:
    0
    auto
    105px;

  overflow:hidden;

  border:1px solid #273139;
  border-radius:27px;

  background:
    linear-gradient(
      180deg,
      #0a1116,
      #070d11
    );

  box-shadow:
    0 24px 65px rgba(0,0,0,.40);
}


/* =========================================================
   HERO HEADER
========================================================= */

header{
  position:relative;
  z-index:50;
  isolation:isolate;

  min-height:154px;

  overflow:visible;

  border-top:3px solid var(--red-bright);
  border-bottom:0;

  border-radius:26px 26px 0 0;

  background-image:
    linear-gradient(
      90deg,
      rgba(4,8,11,.76) 0%,
      rgba(4,8,11,.53) 32%,
      rgba(4,8,11,.20) 64%,
      rgba(4,8,11,.08) 100%
    ),
    linear-gradient(
      0deg,
      rgba(5,9,12,.74) 0%,
      rgba(5,9,12,.24) 38%,
      rgba(5,9,12,.03) 72%
    ),
    var(--trips-hero-image);

  background-size:cover;
  background-position:center 46%;
}

header::after{
  content:"";

  position:absolute;
  inset:0;

  z-index:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 0% 45%,
      rgba(0,0,0,.28) 0%,
      rgba(0,0,0,.12) 34%,
      transparent 62%
    ),
    linear-gradient(
      180deg,
      transparent 69%,
      rgba(5,9,12,.26) 84%,
      rgba(5,9,12,.66) 100%
    );
}

.header-inner{
  position:relative;
  z-index:2;

  padding:
    19px
    20px
    22px;
}


/* =========================================================
   HEADER TITLE
========================================================= */

.title-row{
  position:relative;

  display:block;

  min-height:104px;
}

.title-row > div:first-child{
  min-width:0;
}

.eyebrow{
  margin-bottom:10px;

  color:#ef7d79;

  font-size:7.5px;
  font-weight:900;

  letter-spacing:.18em;

  text-transform:uppercase;

  text-shadow:
    0 1px 12px rgba(0,0,0,.72);
}

.trips-hero{
  display:flex;
  align-items:center;

  gap:12px;
}

.trips-icon-wrap{
  width:54px;
  height:54px;

  flex:0 0 54px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:8px;

  border:1px solid rgba(255,98,95,.34);
  border-radius:50%;

  background:rgba(7,13,17,.78);

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.012),
    0 7px 20px rgba(0,0,0,.23);

  overflow:hidden;
}

.trips-page-logo{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;
}

.trips-page-title{
  margin:0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  color:#f8f4ee;

  font-size:34px;
  font-weight:700;

  line-height:1;

  letter-spacing:-.03em;

  text-shadow:
    0 2px 18px rgba(0,0,0,.70);
}

.header-sub{
  margin-top:6px;

  max-width:250px;

  color:#9aa4aa;

  font-size:8px;
  font-weight:500;

  line-height:1.35;

  text-shadow:
    0 1px 10px rgba(0,0,0,.68);
}


/* =========================================================
   HEADER ACTION
========================================================= */

.header-actions{
  position:absolute;

  top:0;
  right:0;

  z-index:5;

  flex:0 0 auto;
}

.header-btn{
  min-height:32px;

  padding:
    0
    10px;

  border:1px solid rgba(255,98,95,.38);
  border-radius:9px;

  background:rgba(255,98,95,.09);

  color:#ffb3ae;

  font-size:6.7px;
  font-weight:900;

  letter-spacing:.04em;

  box-shadow:
    inset 0 0 16px rgba(255,98,95,.025),
    0 3px 14px rgba(0,0,0,.18);

  text-shadow:
    0 1px 8px rgba(0,0,0,.45);
}

.header-btn:active{
  transform:scale(.96);
}


/* =========================================================
   HERO → CONTENT FADE
========================================================= */

.hero-fade{
  position:absolute;

  z-index:1;

  left:0;
  right:0;
  bottom:-18px;

  height:36px;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(7,13,17,0) 0%,
      rgba(7,13,17,.28) 32%,
      rgba(8,15,20,.76) 72%,
      #091015 100%
    );
}


/* =========================================================
   MAIN
========================================================= */

main{
  position:relative;
  z-index:2;

  width:100%;

  padding:
    12px
    17px
    92px;

  background:
    linear-gradient(
      180deg,
      rgba(9,16,21,.98) 0%,
      #081015 52px,
      #070d11 150px,
      #070d11 100%
    );
}


/* =========================================================
   SECTION HEADERS
========================================================= */

.section{
  margin-bottom:20px;
}

.section:last-child{
  margin-bottom:0;
}

.section-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin:
    0
    2px
    9px;
}

.section-label{
  color:#9ba7ae;

  font-size:7px;
  font-weight:900;

  letter-spacing:.13em;
}

.section-count{
  min-width:24px;

  padding:
    3px
    7px;

  border:1px solid var(--line);
  border-radius:999px;

  background:#0f161c;

  color:#7d8991;

  font-size:6.5px;
  font-weight:900;

  text-align:center;
}


/* =========================================================
   TRIP LIST
========================================================= */

.trip-list{
  display:grid;

  gap:9px;
}

.trip-card{
  position:relative;

  overflow:hidden;

  border:1px solid #2a353d;
  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      rgba(21,29,35,.98) 0%,
      rgba(13,20,25,.99) 100%
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025),
    0 6px 18px rgba(0,0,0,.11);
}

.trip-card::before{
  content:"";

  position:absolute;
  z-index:2;

  top:1px;
  bottom:1px;
  left:0;

  width:2px;

  border-radius:
    12px
    0
    0
    12px;

  background:
    linear-gradient(
      180deg,
      rgba(255,98,95,.95) 0%,
      rgba(255,98,95,.76) 60%,
      rgba(255,98,95,.42) 100%
    );

  box-shadow:
    0 0 9px rgba(255,98,95,.13);

  pointer-events:none;
}

.trip-card::after{
  content:"";

  position:absolute;
  z-index:1;

  top:0;
  left:0;

  width:115px;
  height:1px;

  background:
    linear-gradient(
      90deg,
      rgba(255,98,95,.55),
      rgba(255,98,95,.16),
      transparent
    );

  pointer-events:none;
}

.trip-card.current{
  border-color:
    rgba(255,98,95,.34);
}

.trip-card.shared-trip::before{
  background:
    linear-gradient(
      180deg,
      rgba(120,169,239,.92) 0%,
      rgba(120,169,239,.62) 60%,
      rgba(120,169,239,.30) 100%
    );

  box-shadow:
    0 0 9px rgba(120,169,239,.13);
}

.trip-card.shared-trip{
  border-color:
    rgba(120,169,239,.18);
}

.trip-strip{
  display:none;
}

.trip-body{
  padding:
    12px
    12px
    10px;
}

.trip-top{
  display:flex;

  align-items:flex-start;

  gap:10px;
}

.country-icon{
  width:46px;
  height:46px;

  flex:0 0 46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,98,95,.18);
  border-radius:11px;

  background:
    linear-gradient(
      145deg,
      rgba(255,98,95,.08),
      rgba(255,255,255,.025)
    );

  font-size:22px;
}

.trip-main{
  flex:1;

  min-width:0;
}


/* =========================================================
   BADGES
========================================================= */

.badges{
  display:flex;

  flex-wrap:wrap;

  gap:4px;

  margin-bottom:5px;
}

.badge{
  display:inline-block;

  padding:
    2px
    5px;

  border-radius:999px;

  font-size:5.5px;
  font-weight:900;

  letter-spacing:.06em;
}

.badge.current{
  border:
    1px solid rgba(255,98,95,.22);

  background:
    rgba(255,98,95,.06);

  color:#efa5a0;
}

.badge.owner{
  border:
    1px solid rgba(228,189,105,.18);

  background:
    rgba(228,189,105,.05);

  color:#d8bb78;
}

.badge.editor{
  border:
    1px solid rgba(121,201,149,.18);

  background:
    rgba(121,201,149,.05);

  color:#a7d9b6;
}

.badge.viewer{
  border:
    1px solid rgba(120,169,239,.18);

  background:
    rgba(120,169,239,.05);

  color:#a6bee3;
}

.badge.public{
  border:
    1px solid rgba(121,201,149,.17);

  background:
    rgba(121,201,149,.045);

  color:#a4d6b4;
}


/* =========================================================
   TRIP TEXT
========================================================= */

.trip-name{
  overflow:hidden;

  color:#f6f2eb;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:16px;
  font-weight:700;

  line-height:1.15;

  text-overflow:ellipsis;
  white-space:nowrap;
}

.trip-country{
  margin-top:3px;

  color:#7c878e;

  font-size:7px;
}

.trip-dates{
  margin-top:6px;

  color:#aab5bc;

  font-size:7.5px;
  font-weight:800;
}

.trip-description{
  margin-top:6px;

  color:#849097;

  font-size:7.2px;

  line-height:1.45;
}


/* =========================================================
   CARD ACTIONS
========================================================= */

.actions{
  position:relative;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    auto
    auto;

  gap:5px;

  margin-top:9px;

  padding-top:8px;

  border-top:
    1px solid rgba(255,255,255,.075);
}

.open-btn,
.edit-btn,
.share-btn{
  min-height:31px;

  padding:
    5px
    9px;

  border-radius:8px;

  font-size:6.8px;
  font-weight:900;
}

.open-btn{
  border:
    1px solid rgba(255,98,95,.22);

  background:
    rgba(255,98,95,.05);

  color:#e99b96;
}

.edit-btn{
  border:
    1px solid rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.025);

  color:#8e9aa1;
}

.share-btn{
  border:
    1px solid rgba(255,98,95,.18);

  background:
    rgba(255,98,95,.035);

  color:#d58a85;
}

.share-btn.shared-now{
  border-color:
    rgba(121,201,149,.20);

  background:
    rgba(121,201,149,.045);

  color:#9fd2af;
}


/* =========================================================
   STATE
========================================================= */

.state{
  padding:
    26px
    14px;

  border:
    1px dashed #303b43;

  border-radius:14px;

  background:
    rgba(255,255,255,.012);

  color:#77838b;

  font-size:7px;

  line-height:1.55;

  text-align:center;
}

.state strong{
  display:block;

  margin-bottom:5px;

  color:#e8e7e3;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:14px;

  font-weight:700;
}

.page-error{
  display:none;

  margin-bottom:10px;

  padding:9px;

  border:
    1px solid rgba(255,98,95,.22);

  border-radius:10px;

  background:
    rgba(255,98,95,.055);

  color:#ffc0bc;

  font-size:7px;
}

.page-error.show{
  display:block;
}


/* =========================================================
   SHEET
========================================================= */

.backdrop{
  position:fixed;

  inset:0;

  z-index:150;

  display:none;

  align-items:flex-end;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(5px);

  -webkit-backdrop-filter:blur(5px);
}

.backdrop.open{
  display:flex;
}

.sheet{
  width:100%;

  max-width:620px;

  max-height:
    calc(
      92vh -
      env(safe-area-inset-top)
    );

  margin:
    auto
    auto
    0;

  overflow-y:auto;

  padding:
    8px
    14px
    calc(
      18px +
      env(safe-area-inset-bottom)
    );

  border:1px solid var(--line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0c1217;

  box-shadow:
    0 -20px 50px rgba(0,0,0,.35);
}

.handle{
  width:36px;
  height:4px;

  margin:
    2px
    auto
    13px;

  border-radius:999px;

  background:#35414a;
}

.sheet-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:13px;
}

.sheet-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}

.close{
  width:34px;
  height:34px;

  border:1px solid var(--line);

  border-radius:9px;

  background:#131b21;

  color:#fff;
}


/* =========================================================
   FORM
========================================================= */

.field{
  margin-bottom:9px;
}

.field label{
  display:block;

  margin-bottom:4px;

  color:#8d989f;

  font-size:6.5px;
  font-weight:900;

  letter-spacing:.04em;
}

.field input,
.field textarea{
  width:100%;

  min-height:40px;

  padding:
    8px
    9px;

  border:1px solid var(--line);

  border-radius:9px;

  outline:0;

  background:#0f161c;

  color:#fff;

  font-size:9px;
}

.field textarea{
  min-height:72px;

  resize:vertical;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--red-line);
}

.date-row{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:9px;
}

.sheet-actions{
  display:grid;

  grid-template-columns:
    1fr
    2fr;

  gap:6px;

  margin-top:10px;
}

.cancel,
.save{
  min-height:42px;

  border-radius:10px;

  font-size:7px;
  font-weight:900;
}

.cancel{
  border:1px solid var(--line);

  background:#11191f;

  color:#bbc3c8;
}

.save{
  border:
    1px solid rgba(121,201,149,.24);

  background:
    rgba(121,201,149,.07);

  color:#a7dbb8;
}


/* =========================================================
   PUBLICATION SETTINGS
========================================================= */

.public-box{
  display:none;

  margin-top:13px;

  padding:10px;

  border:
    1px solid rgba(121,201,149,.18);

  border-radius:11px;

  background:
    rgba(121,201,149,.035);
}

.public-box.show{
  display:block;
}

.public-title{
  color:#a9d8b8;

  font-size:7px;
  font-weight:900;
}

.public-text{
  margin-top:4px;

  color:#74847b;

  font-size:6.5px;
  line-height:1.5;
}

.public-actions{
  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:6px;

  margin-top:9px;
}

.view-public,
.unshare{
  min-height:38px;

  border-radius:9px;

  font-size:7px;
  font-weight:900;
}

.view-public{
  border:
    1px solid rgba(121,201,149,.23);

  background:
    rgba(121,201,149,.06);

  color:#a7dbb8;
}

.unshare{
  border:
    1px solid rgba(255,98,95,.20);

  background:
    rgba(255,98,95,.04);

  color:#d98a83;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
  display:none;

  margin-top:8px;

  padding:8px;

  border-radius:8px;

  font-size:7px;
}

.message.error{
  display:block;

  border:
    1px solid rgba(255,98,95,.20);

  background:
    rgba(255,98,95,.055);

  color:#f3aaa6;
}

.message.success{
  display:block;

  border:
    1px solid rgba(121,201,149,.20);

  background:
    rgba(121,201,149,.055);

  color:#9dd8b2;
}



/* =========================================================
   DELETE TRIP
========================================================= */

.delete-trip-box{
  display:none;

  margin-top:16px;

  padding-top:12px;

  border-top:
    1px solid
    rgba(255,255,255,.06);
}

.delete-trip-box.show{
  display:block;
}

.delete-trip-button{
  width:100%;

  min-height:40px;

  border:
    1px solid
    rgba(255,98,95,.24);

  border-radius:9px;

  background:
    rgba(255,98,95,.045);

  color:#dc8883;

  font-size:7px;
  font-weight:900;

  letter-spacing:.05em;
}

.delete-trip-button:active{
  transform:scale(.985);
}

.delete-trip-button:disabled{
  opacity:.45;
  cursor:default;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  body{
    padding-top:9px;
  }

  .trips-shell{
    width:calc(100% - 18px);
  }

  header{
    min-height:148px;
    background-position:center 46%;
  }

  .header-inner{
    padding:
      17px
      17px
      20px;
  }

  .title-row{
    min-height:100px;
  }

  .eyebrow{
    margin-bottom:9px;
    font-size:7px;
  }

  .trips-icon-wrap{
    width:52px;
    height:52px;

    flex-basis:52px;

    padding:8px;
  }

  .trips-page-title{
    font-size:33px;
  }

  .header-sub{
    max-width:210px;
    margin-top:5px;
    font-size:7.6px;
  }

  .header-actions{
    top:0;
    right:0;
  }

  .header-btn{
    min-height:31px;

    padding:
      0
      9px;

    font-size:6.4px;
  }

  .hero-fade{
    bottom:-16px;
    height:32px;
  }

  main{
    padding:
      12px
      14px
      96px;
  }

  .trip-body{
    padding:
      11px
      11px
      10px;
  }

  .country-icon{
    width:44px;
    height:44px;
    flex-basis:44px;
  }

  .trip-name{
    font-size:15px;
  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  .trips-page-title{
    font-size:34px;
  }

  .trips-icon-wrap{
    width:56px;
    height:56px;

    flex-basis:56px;
  }

  .header-btn{
    font-size:6px;
  }

  .actions{

<script>

/* =========================================================
   STATE
========================================================= */

let currentUser =
  null;


let ownedTrips =
  [];


let sharedTrips =
  [];


let publications =
  [];


let editingTripId =
  null;



/* =========================================================
   HELPERS
========================================================= */

function esc(value){


  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );


}



function countryEmoji(country){


  const value =
    String(
      country
      ||
      ""
    )

    .trim()

    .toLowerCase();


  const map = {


    japan:"🇯🇵",

    singapore:"🇸🇬",

    malaysia:"🇲🇾",

    indonesia:"🇮🇩",

    thailand:"🇹🇭",

    vietnam:"🇻🇳",

    taiwan:"🇹🇼",

    china:"🇨🇳",

    korea:"🇰🇷",

    "south korea":"🇰🇷",

    france:"🇫🇷",

    italy:"🇮🇹",

    spain:"🇪🇸",

    uk:"🇬🇧",

    "united kingdom":"🇬🇧",

    usa:"🇺🇸",

    "united states":"🇺🇸"


  };


  return (
    map[value]
    ||
    "✈️"
  );


}



function prettyDate(value){


  if(
    !value
  ){

    return "";

  }


  const date =
    new Date(
      value
      +
      "T12:00:00"
    );


  return date
    .toLocaleDateString(
      "en-SG",
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );


}



function tripDates(trip){


  if(
    trip.start_date
    &&
    trip.end_date
  ){


    return (

      prettyDate(
        trip.start_date
      )

      +

      " – "

      +

      prettyDate(
        trip.end_date
      )

    );


  }


  if(
    trip.start_date
  ){


    return (

      "From "

      +

      prettyDate(
        trip.start_date
      )

    );


  }


  return "Dates not set";


}



function getCurrentTripId(){


  return (

    Number(
      localStorage.getItem(
        "current_trip_id"
      )
    )

    ||

    null

  );


}



function normalizeMemberRole(role){


  return (

    role
    ===
    "editor"

    ?

    "editor"

    :

    "viewer"

  );


}



function publicationForTrip(
  tripId
){


  return (

    publications.find(
      item =>

        Number(
          item.trip_id
        )

        ===

        Number(
          tripId
        )
    )

    ||

    null

  );


}



function showError(message){


  const box =
    document.getElementById(
      "pageError"
    );


  box.textContent =
    message;


  box
    .classList
    .add(
      "show"
    );


}



function clearError(){


  document
    .getElementById(
      "pageError"
    )
    .classList
    .remove(
      "show"
    );


}



/* =========================================================
   START
========================================================= */

async function start(){


  try{


    clearError();


    const auth =
      await db.auth
        .getUser();


    if(
      auth.error
    ){


      throw auth.error;


    }


    currentUser =
      auth.data.user;


    if(
      !currentUser
    ){


      location.href =
        "login.html";


      return;


    }


    await loadTrips();


  }


  catch(error){


    console.error(
      error
    );


    showError(
      error.message
      ||
      "Could not load your trips."
    );


  }


}



/* =========================================================
   LOAD TRIPS
========================================================= */

async function loadTrips(){


  const ownedResult =
    await db

      .from(
        "trips"
      )

      .select(
        "*"
      )

      .eq(
        "owner_id",
        currentUser.id
      )

      .order(
        "start_date",
        {
          ascending:false,
          nullsFirst:false
        }
      );


  if(
    ownedResult.error
  ){


    throw ownedResult.error;


  }


  ownedTrips =
    (
      ownedResult.data
      ||
      []
    )

    .filter(
      trip =>
        trip.status
        !==
        "deleted"
    );


  const membershipResult =
    await db

      .from(
        "trip_members"
      )

      .select(`
        id,
        trip_id,
        user_id,
        role,
        created_at
      `)

      .eq(
        "user_id",
        currentUser.id
      );


  if(
    membershipResult.error
  ){


    throw membershipResult.error;


  }


  const memberships =
    membershipResult.data
    ||
    [];


  const sharedIds = [

    ...new Set(

      memberships

        .map(
          item =>
            Number(
              item.trip_id
            )
        )

        .filter(
          Boolean
        )

    )

  ];


  sharedTrips =
    [];


  if(
    sharedIds.length
  ){


    const sharedResult =
      await db

        .from(
          "trips"
        )

        .select(
          "*"
        )

        .in(
          "id",
          sharedIds
        );


    if(
      sharedResult.error
    ){


      throw sharedResult.error;


    }


    sharedTrips =
      (
        sharedResult.data
        ||
        []
      )

      .filter(
        trip =>
          trip.status
          !==
          "deleted"
      )

      .map(
        trip => {


          const membership =
            memberships.find(
              item =>

                Number(
                  item.trip_id
                )

                ===

                Number(
                  trip.id
                )
            );


          return {


            ...trip,


            membership_role:
              normalizeMemberRole(
                membership?.role
              )


          };


        }
      );


  }


  await loadPublications();


  renderTrips();


}



/* =========================================================
   PUBLICATION STATUS
========================================================= */

async function loadPublications(){


  publications =
    [];


  const ids =
    ownedTrips

      .map(
        trip =>
          Number(
            trip.id
          )
      )

      .filter(
        Boolean
      );


  if(
    !ids.length
  ){


    return;


  }


  const result =
    await db

      .from(
        "trip_publications"
      )

      .select(`
        id,
        trip_id,
        is_public,
        allow_copy,
        created_at,
        updated_at
      `)

      .in(
        "trip_id",
        ids
      );


  if(
    result.error
  ){


    throw result.error;


  }


  publications =
    result.data
    ||
    [];


}



/* =========================================================
   RENDER
========================================================= */

function renderTrips(){


  document
    .getElementById(
      "ownedCount"
    )
    .textContent =
      String(
        ownedTrips.length
      );


  document
    .getElementById(
      "sharedCount"
    )
    .textContent =
      String(
        sharedTrips.length
      );


  const owned =
    document.getElementById(
      "ownedTrips"
    );


  const shared =
    document.getElementById(
      "sharedTrips"
    );


  if(
    !ownedTrips.length
  ){


    owned.innerHTML = `


      <div class="state">


        <strong>
          No trips yet
        </strong>


        Use the ＋ ADD TRIP button above
        to create your first trip.


      </div>


    `;


  }


  else{


    owned.innerHTML =

      ownedTrips

        .map(
          trip =>
            tripCard(
              trip,
              "owner"
            )
        )

        .join(
          ""
        );


  }


  if(
    !sharedTrips.length
  ){


    shared.innerHTML = `


      <div class="state">


        <strong>
          Nothing shared with you
        </strong>


        Trips where you are a Viewer
        or Editor will appear here.


      </div>


    `;


  }


  else{


    shared.innerHTML =

      sharedTrips

        .map(
          trip =>
            tripCard(
              trip,
              trip.membership_role
            )
        )

        .join(
          ""
        );


  }


}



/* =========================================================
   TRIP CARD
========================================================= */

function tripCard(
  trip,
  role
){


  const isCurrent =

    Number(
      getCurrentTripId()
    )

    ===

    Number(
      trip.id
    );


  const isShared =
    role
    !==
    "owner";


  const publication =

    role
    ===
    "owner"

    ?

    publicationForTrip(
      trip.id
    )

    :

    null;


  const isPublic =
    Boolean(
      publication?.is_public
    );


  let roleClass =
    "owner";


  let roleLabel =
    "OWNER";


  if(
    role
    ===
    "editor"
  ){


    roleClass =
      "editor";


    roleLabel =
      "EDITOR";


  }


  else if(
    role
    !==
    "owner"
  ){


    roleClass =
      "viewer";


    roleLabel =
      "VIEWER";


  }


  return `


    <article
      class="
        trip-card
        ${isCurrent ? "current" : ""}
        ${isShared ? "shared-trip" : ""}
      "
    >


      <div class="trip-body">


        <div class="trip-top">


          <div class="country-icon">

            ${countryEmoji(
              trip.country
            )}

          </div>


          <div class="trip-main">


            <div class="badges">


              ${
                isCurrent

                ?

                `

                  <span class="badge current">
                    CURRENT
                  </span>

                `

                :

                ""
              }


              <span
                class="badge ${roleClass}"
              >
                ${roleLabel}
              </span>


              ${
                isPublic

                ?

                `

                  <span class="badge public">
                    🌐 SHARED
                  </span>

                `

                :

                ""
              }


            </div>


            <div class="trip-name">

              ${esc(
                trip.name
                ||
                "Unnamed Trip"
              )}

            </div>


            <div class="trip-country">

              ${esc(
                trip.country
                ||
                "Country not set"
              )}

            </div>


            <div class="trip-dates">

              📅
              ${esc(
                tripDates(
                  trip
                )
              )}

            </div>


            ${
              trip.description

              ?

              `

                <div class="trip-description">

                  ${esc(
                    trip.description
                  )}

                </div>

              `

              :

              ""
            }


          </div>


        </div>



        <div class="actions">


          <button
            class="open-btn"
            type="button"
            onclick="openTrip(${Number(trip.id)})"
          >
            🗺 OPEN →
          </button>


          ${
            role
            ===
            "owner"

            ?

            `

              <button
                class="edit-btn"
                type="button"
                onclick="openEditTrip(${Number(trip.id)})"
              >
                ✎ EDIT
              </button>


              <button
                class="
                  share-btn
                  ${isPublic ? "shared-now" : ""}
                "
                type="button"
                onclick="shareTrip(${Number(trip.id)})"
              >

                ${
                  isPublic
                  ?
                  "✓ SHARED"
                  :
                  "↗ SHARE"
                }

              </button>

            `

            :

            ""
          }


        </div>


      </div>


    </article>


  `;


}



/* =========================================================
   OPEN TRIP
========================================================= */

function openTrip(id){


  id =
    Number(
      id
    );


  if(
    !id
  ){


    return;


  }


  localStorage.setItem(

    "current_trip_id",

    String(
      id
    )

  );


  location.href =
    `index.html?trip=${id}`;


}



/* =========================================================
   SHARE TO PLACES
========================================================= */

async function shareTrip(
  tripId
){


  const publication =
    publicationForTrip(
      tripId
    );


  if(
    publication
    &&
    publication.is_public
  ){


    location.href =
      `places.html?open=${Number(
        publication.id
      )}`;


    return;


  }


  try{


    const result =
      await db.rpc(

        "publish_trip",

        {


          p_trip_id:
            Number(
              tripId
            ),


          p_allow_copy:
            true


        }

      );


    if(
      result.error
    ){


      throw result.error;


    }


    const publicationId =
      Number(
        result.data
      );


    location.href =

      publicationId

      ?

      `places.html?open=${publicationId}`

      :

      "places.html";


  }


  catch(error){


    console.error(
      error
    );


    alert(

      "Couldn't share this trip.\n\n"

      +

      (
        error.message
        ||
        "Unknown error."
      )

    );


  }


}

/* =========================================================

          )
          .value
          .trim();


      if(
        !name
      ){


        message.textContent =
          "Please enter a trip name.";


        message.className =
          "message error";


        return;


      }


      if(
        !country
      ){


        message.textContent =
          "Please enter a country.";


        message.className =
          "message error";


        return;


      }


      if(
        startDate
        &&
        endDate
        &&
        endDate < startDate
      ){


        message.textContent =
          "End date cannot be before start date.";


        message.className =
          "message error";


        return;


      }


      button.disabled =
        true;


      button.textContent =

        editingTripId

        ?

        "SAVING…"

        :

        "CREATING…";


      try{


        const payload = {


          name:
            name,


          country:
            country,


          start_date:
            startDate
            ||
            null,


          end_date:
            endDate
            ||
            null,


          description:
            description
            ||
            null


        };


        if(
          editingTripId
        ){


          const result =
            await db

              .from(
                "trips"
              )

              .update(
                payload
              )

              .eq(
                "id",
                editingTripId
              )

              .eq(
                "owner_id",
                currentUser.id
              )

              .select();


          if(
            result.error
          ){


            throw result.error;


          }


          if(
            !result.data
            ||
            !result.data.length
          ){


            throw new Error(
              "Trip was not updated."
            );


          }


        }


        else{


          const result =
            await db

              .from(
                "trips"
              )

              .insert({


                ...payload,


                owner_id:
                  currentUser.id,


                status:
                  "active"


              })

              .select()

              .single();


          if(
            result.error
          ){


            throw result.error;


          }


          localStorage.setItem(

            "current_trip_id",

            String(
              result.data.id
            )

          );


        }


        message.textContent =
          "Saved ✓";


        message.className =
          "message success";


        await loadTrips();


        setTimeout(

          closeTripSheet,

          300

        );


      }


      catch(error){


        console.error(
          error
        );


        message.textContent =
          error.message
          ||
          "Could not save trip.";


        message.className =
          "message error";


      }


      finally{


        button.disabled =
          false;


        button.textContent =

          editingTripId

          ?

          "SAVE CHANGES"

          :

          "CREATE TRIP";


      }


    };



/* =========================================================
   VIEW PUBLIC
========================================================= */

document
  .getElementById(
    "viewPublic"
  )
  .onclick =
    () => {


      if(
        !editingTripId
      ){


        return;


      }


      const publication =
        publicationForTrip(
          editingTripId
        );


      if(
        !publication
        ||
        !publication.is_public
      ){


        return;


      }


      location.href =
        `places.html?open=${Number(
          publication.id
        )}`;


    };



/* =========================================================
   STOP SHARING
========================================================= */

document
  .getElementById(
    "unshareTrip"
  )
  .onclick =
    async () => {


      if(
        !editingTripId
      ){


        return;


      }


      if(
        !confirm(
          "Stop sharing this itinerary in Places?"
        )
      ){


        return;


      }


      const message =
        document.getElementById(
          "sheetMessage"
        );


      try{


        const result =
          await db.rpc(

            "unpublish_trip",

            {

              p_trip_id:
                Number(
                  editingTripId
                )

            }

          );


        if(
          result.error
        ){


          throw result.error;


        }


        await loadTrips();


        document
          .getElementById(
            "publicBox"
          )
          .classList
          .remove(
            "show"
          );


        message.textContent =
          "Sharing stopped ✓";


        message.className =
          "message success";


      }


      catch(error){


        console.error(
          error
        );


        message.textContent =
          error.message
          ||
          "Couldn't stop sharing.";


        message.className =
          "message error";


      }


    };



/* =========================================================
   DELETE TRIP
   Soft-delete: the row stays in Supabase with status="deleted".
========================================================= */

document
  .getElementById(
    "deleteTripButton"
  )
  .onclick =
    async () => {


      if(
        !editingTripId
      ){

        return;

      }


      const trip =
        ownedTrips.find(
          item =>

            Number(
              item.id
            )

            ===

            Number(
              editingTripId
            )
        );


      if(
        !trip
      ){

        return;

      }


      const okay =
        confirm(
          `Delete "${trip.name || "this trip"}"?\n\nThis will remove it from My Trips.`
        );


      if(
        !okay
      ){

        return;

      }


      const button =
        document.getElementById(
          "deleteTripButton"
        );


      const message =
        document.getElementById(
          "sheetMessage"
        );


      button.disabled =
        true;


      button.textContent =
        "DELETING…";


      message.className =
        "message";


      try{


        const result =
          await db

            .from(
              "trips"
            )

            .update({
              status:"deleted"
            })

            .eq(
              "id",
              editingTripId
            )

            .eq(
              "owner_id",
              currentUser.id
            )

            .select();


        if(
          result.error
        ){

          throw result.error;

        }


        if(
          !result.data
          ||
          !result.data.length
        ){

          throw new Error(
            "Trip was not deleted."
          );

        }


        if(
          Number(
            localStorage.getItem(
              "current_trip_id"
            )
          )

          ===

          Number(
            editingTripId
          )
        ){

          localStorage.removeItem(
            "current_trip_id"
          );

        }


        message.textContent =
          "Trip deleted ✓";


        message.className =
          "message success";


        await loadTrips();


        setTimeout(
          closeTripSheet,
          350
        );


      }


      catch(error){


        console.error(
          error
        );


        message.textContent =
          error.message
          ||
          "Couldn't delete trip.";


        message.className =
          "message error";


      }


      finally{


        button.disabled =
          false;


        button.textContent =
          "🗑 DELETE TRIP";


      }


    };



/* =========================================================
   GO
========================================================= */

start();

</script>
