<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMBN // RSI Perseus Tactical Blueprint</title><link rel="icon" href="assets/jmbn.ico"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070d0b;color:#e8dbbd;font:12px 'Segoe UI',sans-serif}#scene{position:fixed;inset:0}#header{position:fixed;top:0;left:0;right:0;padding:20px 25px;background:linear-gradient(#070d0be9,#070d0b00);pointer-events:none}small{color:#c5a56d;letter-spacing:2px}h1{margin:8px 0;font-size:25px;letter-spacing:2px}#panel{position:fixed;left:20px;top:110px;width:245px;max-height:calc(100% - 195px);overflow:auto;background:#09120fee;border:1px solid #75603d;padding:15px}#panel h2{font-size:16px}#stations button{display:block;width:100%;padding:10px;text-align:left;background:transparent;color:#e9d3a2;border:0;border-bottom:1px solid #5e523c;cursor:pointer}#stations button:hover{background:#493a2066}#dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:#09120ff2;padding:10px;border:1px solid #80643a}button{cursor:pointer;background:#101b16;color:#d9c08a;border:1px solid #80643a;padding:8px}button.active{background:#514020}#notice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0b1411f5;border:1px solid #ad8c50;padding:22px;max-width:400px;text-align:center;line-height:1.7}@media(max-width:650px){#panel{left:8px;top:90px;width:160px}#header{padding:12px}h1{font-size:17px}#dock{width:96%}}</style></head><body><div id="scene"></div><header id="header"><small>JMBN // FLEET TACTICAL REFERENCE</small><h1>RSI PERSEUS</h1></header><aside id="panel"><small>COMBAT STATIONS</small><h2 id="selected">SELECT A STATION</h2><div id="stations"></div></aside><div id="dock"><button data-layer="base" class="active">HULL</button><button data-layer="deck0" class="active">DECK 0</button><button data-layer="deck1" class="active">DECK 1</button><button data-layer="deck2" class="active">DECK 2</button><button id="fit">FIT SHIP</button><button id="top">TOP VIEW</button></div><div id="notice">Loading Perseus models…</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';import{OrbitControls}from'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#091813');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,2000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.getElementById('scene').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8e6cf,0x2a342e,2));const light=new THREE.DirectionalLight(0xffdc9a,3);light.position.set(10,20,10);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const root=new THREE.Group();scene.add(root);const models={};const visible={base:true,deck0:true,deck1:true,deck2:true};
const files={base:'JMBN_Perseus_Base.glb',deck0:'JMBN_Perseus_Deck_0.glb',deck1:'JMBN_Perseus_Deck_1.glb',deck2:'JMBN_Perseus_Deck_2.glb'};
function style(){models.base?.traverse(o=>{if(!o.isMesh)return;const turret=/turret|pdc|weapon|gun|cannon/i.test(o.name+' '+(o.parent?.name||''));o.material=new THREE.MeshStandardMaterial({color:turret?0xcba65b:0xb49a63,metalness:turret?.75:.3,roughness:turret?.28:.55,transparent:!turret,opacity:turret?1:.15,side:THREE.DoubleSide,depthWrite:turret})})}
function fit(top=false){const box=new THREE.Box3().setFromObject(root);if(box.isEmpty())return;const c=box.getCenter(new THREE.Vector3()),r=Math.max(box.getSize(new THREE.Vector3()).length(),1);controls.target.copy(c);camera.position.copy(c).add(top?new THREE.Vector3(0,r,0.01):new THREE.Vector3(r*.65,r*.55,r*.8));camera.lookAt(c);controls.update()}
const stations=[];function setupStations(){models.base?.traverse(o=>{if(/turret|pdc|bridge|chair/i.test(o.name)&&o.isMesh&&stations.length<32){stations.push(o);const b=document.createElement('button');b.textContent=o.name;b.onclick=()=>{document.getElementById('selected').textContent=o.name;const pos=o.getWorldPosition(new THREE.Vector3());controls.target.copy(pos);camera.position.copy(pos).add(new THREE.Vector3(2,2,3));controls.update()};document.getElementById('stations').append(b)}})}
Promise.all(Object.entries(files).map(async([k,file])=>{const gltf=await new GLTFLoader().loadAsync('assets/models/perseus/'+file);models[k]=gltf.scene;root.add(gltf.scene)})).then(()=>{style();fit();setupStations();document.getElementById('notice').remove()}).catch(e=>{document.getElementById('notice').textContent='Perseus model files are not yet published in assets/models/perseus/. Upload the four GLBs to activate the viewer. '+e.message});
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{visible[b.dataset.layer]=!visible[b.dataset.layer];if(models[b.dataset.layer])models[b.dataset.layer].visible=visible[b.dataset.layer];b.classList.toggle('active',visible[b.dataset.layer])});document.getElementById('fit').onclick=()=>fit();document.getElementById('top').onclick=()=>fit(true);function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
</script></body></html>
