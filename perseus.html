<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMBN // RSI Perseus Tactical Blueprint</title><link rel="icon" href="assets/jmbn.ico"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070d0b;color:#e8dbbd;font:12px 'Segoe UI',sans-serif}#scene{position:fixed;inset:0}#header{position:fixed;top:0;left:0;right:0;padding:20px 25px;background:linear-gradient(#070d0be9,#070d0b00);pointer-events:none}small{color:#c5a56d;letter-spacing:2px}h1{margin:8px 0;font-size:25px;letter-spacing:2px}#panel{position:fixed;left:20px;top:110px;width:245px;max-height:calc(100% - 195px);overflow:auto;background:#09120fee;border:1px solid #75603d;padding:15px}#panel h2{font-size:16px}#stations button{display:block;width:100%;padding:10px;text-align:left;background:transparent;color:#e9d3a2;border:0;border-bottom:1px solid #5e523c;cursor:pointer}#stations button:hover{background:#493a2066}#dock{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:#09120ff2;padding:10px;border:1px solid #80643a}button{cursor:pointer;background:#101b16;color:#d9c08a;border:1px solid #80643a;padding:8px}button.active{background:#514020}#notice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0b1411f5;border:1px solid #ad8c50;padding:22px;max-width:400px;text-align:center;line-height:1.7}@media(max-width:650px){#panel{left:8px;top:90px;width:160px}#header{padding:12px}h1{font-size:17px}#dock{width:96%}}body.fleet-embed #header{display:none}body.fleet-embed #panel{top:16px;max-height:calc(100% - 100px)}body.fleet-embed #dock{bottom:12px}@media(max-width:650px){body.fleet-embed #panel{top:12px}}#panel{left:auto;right:16px;top:18px;bottom:18px;width:255px;max-height:none;padding:0;display:flex;flex-direction:column;background:linear-gradient(160deg,#111c17ed,#07100ded);border:1px solid #80683e77;font-family:Oxanium,'Segoe UI',sans-serif}#panel .panelhead{padding:16px 14px 12px;border-bottom:1px solid #81673d66}#panel .panelhead small{font-size:10px;letter-spacing:.14em}#panel h2{font-size:17px;color:#e8d097;letter-spacing:.1em;margin:7px 0}#panel .panelhead p{font-size:11px;color:#95a49b;line-height:1.5;margin:0}#atlasTabs,#stationFilters{display:flex;gap:5px;padding:10px 10px 0}#atlasTabs button{flex:1}#stationFilters button{flex:1;font-size:10px;padding:7px 4px}#stations{padding:12px 10px;overflow:auto;flex:1}#stations .station{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:1px solid transparent;border-bottom:1px solid #514f384d;background:transparent;color:#ede6cf;padding:12px 7px}#stations .station:hover,#stations .station.active{background:#55421b55;border-color:#9c7b42}#stations .num{color:#d6ac59;border:1px solid #76613f;padding:7px;min-width:36px;text-align:center;font-weight:700}#stations strong{display:block;font-size:12px}#stations .station small{display:block;color:#84988c;font-size:10px;letter-spacing:0;margin-top:4px}#dock{z-index:5}#panel{z-index:6}body.fleet-embed #panel{top:12px;bottom:12px;max-height:none}@media(max-width:650px){#panel,body.fleet-embed #panel{right:6px;left:auto;top:8px;bottom:75px;width:180px}#panel .panelhead{padding:10px}#panel h2{font-size:13px}#atlasTabs,#stationFilters{gap:3px;padding:6px 5px 0}#atlasTabs button,#stationFilters button{font-size:9px;padding:6px 3px}#stations{padding:5px}#stations .station{padding:8px 3px}#stations strong{font-size:10px}#dock{width:96%}}@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700&display=swap');#scene{background:radial-gradient(ellipse at 50% 50%,#18231d,#07100e 55%,#040908 100%)}#scene canvas{display:block}#blueprintGrid{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 55px,#af8c2410 56px),repeating-linear-gradient(90deg,transparent 0 55px,#af8c2410 56px);opacity:.5}#panel,body.fleet-embed #panel{right:12px;top:12px;bottom:68px;width:240px;max-height:none}#dock{bottom:12px;left:12px;right:12px;width:auto;transform:none;justify-content:center;border:1px solid #997c4677;background:#080f0df2}#dock .docklabel{font-size:10px;letter-spacing:.15em;color:#ac9672;margin-right:8px}#dock button{font-size:10px}#pendingPins{position:fixed;inset:0;pointer-events:none;z-index:4}.pendingPin{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);color:#ffe3a0;border:1px solid #cb9e4d;background:#10170fe5;box-shadow:0 0 15px #b4853a55;font:700 10px Oxanium,'Segoe UI',sans-serif;padding:6px 8px;white-space:nowrap}.pendingPin.active{background:#826125;color:#fff}#panel{z-index:7}#header{z-index:5}#dock{z-index:8}@media(max-width:650px){#panel,body.fleet-embed #panel{right:6px;top:6px;bottom:80px;width:170px}#dock{left:5px;right:5px;width:auto;gap:3px;padding:5px}#dock button{font-size:9px;padding:6px 3px}#dock .docklabel{display:none}}</style></head><body><div id="scene"></div><div id="blueprintGrid"></div><div id="pendingPins"></div><header id="header"><small>JMBN // FLEET TACTICAL REFERENCE</small><h1>RSI PERSEUS</h1></header><aside id="panel"><div class="panelhead"><small>VESSEL // GUNSHIP</small><h2 id="directoryTitle">COMBAT STATIONS</h2><p id="directoryIntro">Station locations are not yet confirmed.</p></div><div id="atlasTabs"><button class="active" data-atlas="combat">⚔ COMBAT</button><button data-atlas="habitat">⌂ HABITAT</button></div><div id="stationFilters"><button class="active" data-filter="all">ALL</button><button data-filter="turrets">TURRETS</button><button data-filter="bridge">BRIDGE</button><button data-filter="support">SUPPORT</button></div><div id="stations"></div></aside><div id="dock"><span class="docklabel">BLUEPRINT</span><button data-layer="deck0" class="active">DECK 0</button><button data-layer="deck1" class="active">DECK 1</button><button data-layer="deck2" class="active">DECK 2</button><button data-layer="base" class="active">HULL</button><button id="fit">FIT SHIP</button><button id="top">TOP VIEW</button><button id="iso">ISOMETRIC</button><button id="labelsToggle" class="active">MARKERS ON</button></div><div id="notice">Loading Perseus models…</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';import{OrbitControls}from'https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
if(new URLSearchParams(location.search).has('fleet'))document.body.classList.add('fleet-embed');
const scene=new THREE.Scene();scene.background=new THREE.Color('#091813');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,2000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.getElementById('scene').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xe8e6cf,0x2a342e,2));const light=new THREE.DirectionalLight(0xffdc9a,3);light.position.set(10,20,10);scene.add(light);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;const root=new THREE.Group();scene.add(root);const models={};const visible={base:true,deck0:true,deck1:true,deck2:true};
const files={base:'JMBN_Perseus_Base.glb',deck0:'JMBN_Perseus_Deck_0.glb',deck1:'JMBN_Perseus_Deck_1.glb',deck2:'JMBN_Perseus_Deck_2.glb'};
function style(){
 // Material parameters copied from JMBN_Polaris_Base.glb: JMBN Metallic Gold Turrets 5/6.
 const turretGold=()=>new THREE.MeshStandardMaterial({
  name:'JMBN Metallic Gold Turrets',
  color:new THREE.Color().setRGB(.82,.59,.27),
  metalness:.72,roughness:.28,
  emissive:new THREE.Color().setRGB(.07,.045,.008),
  transparent:false,opacity:1,depthWrite:true,side:THREE.DoubleSide
 });
 const hullGhost=()=>new THREE.MeshBasicMaterial({
  color:0xb69658,transparent:true,opacity:.066,
  depthWrite:true,side:THREE.FrontSide
 });
 models.base?.traverse(o=>{
  if(!o.isMesh)return;
  let ancestor=o,isTurret=false;
  while(ancestor&&ancestor!==models.base){
   if(/pdc/i.test(ancestor.name||'')){isTurret=false;break}
   if(/turret|weapon|gun|cannon/i.test(ancestor.name||'')){isTurret=true;break}
   ancestor=ancestor.parent;
  }
  // Keep all original Perseus geometry. Only replace the material.
  const make=isTurret?turretGold:hullGhost;
  o.material=Array.isArray(o.material)?o.material.map(make):make();
 });
}
function fit(top=false){const box=new THREE.Box3().setFromObject(root);if(box.isEmpty())return;const c=box.getCenter(new THREE.Vector3()),r=Math.max(box.getSize(new THREE.Vector3()).length(),1);controls.target.copy(c);camera.position.copy(c).add(top?new THREE.Vector3(0,r,0.01):new THREE.Vector3(r*.65,r*.55,r*.8));camera.lookAt(c);controls.update()}
// Perseus stations are placeholders until their names and positions are verified.
const stationEntries=[
 {id:'pending-a',name:'PENDING STATION',location:'POSITION UNCONFIRMED',cat:'turrets'},
 {id:'pending-b',name:'PENDING STATION',location:'POSITION UNCONFIRMED',cat:'turrets'}
];
let atlas='combat',filter='all';
function renderStations(){
 const list=document.getElementById('stations');list.replaceChildren();
 const title=document.getElementById('directoryTitle'),intro=document.getElementById('directoryIntro');
 title.textContent=atlas==='combat'?'COMBAT STATIONS':'HABITAT & FACILITIES';
 intro.textContent=atlas==='combat'?'Station locations and assignments are pending confirmation.':'Habitat locations have not yet been confirmed.';
 document.getElementById('stationFilters').hidden=atlas!=='combat';
 const entries=atlas==='combat'?stationEntries.filter(x=>filter==='all'||x.cat===filter):[];
 if(!entries.length){const note=document.createElement('p');note.style.cssText='color:#a7a18d;line-height:1.6;padding:8px';note.textContent='Stations not yet confirmed.';list.append(note);return}
 for(const entry of entries){const button=document.createElement('button');button.className='station';button.type='button';
 const num=document.createElement('span');num.className='num';num.textContent='?';
 const info=document.createElement('span');const strong=document.createElement('strong');strong.textContent=entry.name;
 const small=document.createElement('small');small.textContent=entry.location;info.append(strong,small);button.append(num,info);
 button.onclick=()=>{list.querySelectorAll('.station').forEach(x=>x.classList.remove('active'));button.classList.add('active');intro.textContent='Station designation and location are pending confirmation.';document.querySelectorAll('.pendingPin').forEach(x=>x.classList.toggle('active',x.dataset.pendingId===entry.id))};
 list.append(button)}
}
document.querySelectorAll('[data-atlas]').forEach(b=>b.onclick=()=>{atlas=b.dataset.atlas;document.querySelectorAll('[data-atlas]').forEach(x=>x.classList.toggle('active',x===b));renderStations()});
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderStations()});
renderStations();
const pendingMarkers=[];
function setupPendingMarkers(){
 const host=document.getElementById('pendingPins');host.replaceChildren();pendingMarkers.length=0;
 // Indicative points only: these are NOT verified station coordinates.
 const bounds=new THREE.Box3().setFromObject(root),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());
 const offsets=[[-.19,.16,-.13],[.19,.16,.13]];
 stationEntries.forEach((entry,index)=>{
  const el=document.createElement('button');el.type='button';el.className='pendingPin';el.textContent='PENDING STATION';el.dataset.pendingId=entry.id;
  el.title='Unconfirmed station marker';el.onclick=()=>{document.querySelectorAll('.pendingPin').forEach(x=>x.classList.toggle('active',x===el));document.getElementById('directoryIntro').textContent='Station location is not yet confirmed.'};
  host.append(el);
  const [x,y,z]=offsets[index];pendingMarkers.push({el,point:new THREE.Vector3(center.x+x*size.x,center.y+y*size.y,center.z+z*size.z)});
 });
}
let markersOn=true;
function updatePendingMarkers(){
 for(const marker of pendingMarkers){
  const v=marker.point.clone().project(camera);
  const onScreen=v.z>=-1&&v.z<=1&&v.x>=-1&&v.x<=1&&v.y>=-1&&v.y<=1;
  marker.el.hidden=!markersOn||!onScreen||!visible.base;
  if(!marker.el.hidden){marker.el.style.left=((v.x+1)*50)+'%';marker.el.style.top=((1-v.y)*50)+'%'}
 }
}
Promise.all(Object.entries(files).map(async([k,file])=>{const gltf=await new GLTFLoader().loadAsync('assets/models/perseus/'+file);models[k]=gltf.scene;root.add(gltf.scene)})).then(()=>{style();fit();setupPendingMarkers();document.getElementById('notice').remove()}).catch(e=>{document.getElementById('notice').textContent='Perseus model files are not yet published in assets/models/perseus/. Upload the four GLBs to activate the viewer. '+e.message});
document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{visible[b.dataset.layer]=!visible[b.dataset.layer];if(models[b.dataset.layer])models[b.dataset.layer].visible=visible[b.dataset.layer];b.classList.toggle('active',visible[b.dataset.layer])});document.getElementById('fit').onclick=()=>fit();document.getElementById('top').onclick=()=>fit(true);document.getElementById('iso').onclick=()=>fit(false);document.getElementById('labelsToggle').onclick=e=>{markersOn=!markersOn;e.currentTarget.classList.toggle('active',markersOn);e.currentTarget.textContent=markersOn?'MARKERS ON':'MARKERS OFF'};function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();function loop(){requestAnimationFrame(loop);controls.update();updatePendingMarkers();renderer.render(scene,camera)}loop();
</script></body></html>
