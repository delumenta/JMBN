<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JMBN – Admin Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png"
      href="https://static.wixstatic.com/media/08ea88_820ac3bc561d4233ad73a7af859f28bf~mv2.png">

<style>
:root{
  --bg:#000;--panel:#0b0b0b;--sub:#0f0f0f;--row:#0a0a0a;
  --border:#d6b44c;--card:#141414;
  --accent:#f2d675;--text:#f7f1d0;--muted:#c9b06a;--bad:#ff6b6b;--ok:#5cd47c;
  --line:rgba(214,180,76,.62);
  --line-soft:rgba(214,180,76,.22);
  --frame-bg:linear-gradient(180deg,rgba(15,15,13,.97),rgba(6,7,7,.98));
  --clip:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  --clip-sm:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  --fs-base:14px;--fs-small:11px;--fs-h1:clamp(18px,2.2vw,22px);
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:10px 14px 16px;
  background:
    radial-gradient(1200px 900px at 15% -10%, rgba(242,214,117,.08), transparent 60%),
    radial-gradient(900px 700px at 120% 110%, rgba(214,180,76,.05), transparent 60%),
    #000;
  color:var(--text);
  font-family:'Play',system-ui,sans-serif;
  font-size:var(--fs-base);
  letter-spacing:.25px;
}

/* Brand fallback (header2.html may overwrite) */
.brand{
  display:flex;align-items:center;gap:10px;
  margin:0 0 8px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.brand-logo{
  width:44px;height:44px;object-fit:contain;
  filter:drop-shadow(0 0 4px rgba(242,214,117,.25));
}
.brand h1{
  margin:0;font-size:var(--fs-h1);font-weight:700;color:var(--accent);
}

/* Layout */
.page{max-width:1700px;margin:0 auto}

/* Panels */
.panel{
  position:relative;
  background:var(--frame-bg);
  border:0;
  border-radius:0;
  clip-path:var(--clip);
  box-shadow:0 0 22px rgba(214,180,76,.12);
}
.panel::before{
  content:"";
  position:absolute;inset:0;
  background:var(--border);
  clip-path:var(--clip);
  z-index:0;
}
.panel::after{
  content:"";
  position:absolute;inset:1px;
  background:var(--frame-bg);
  clip-path:var(--clip);
  z-index:0;
}
.panel>*{position:relative;z-index:1}
.panel .hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  border-bottom:1px solid var(--border);
}
.panel .hd h2,
.panel .hd h3{
  margin:0;color:var(--accent);font-size:16px;font-weight:700;
  display:flex;align-items:center;gap:10px;
}
.panel .body{padding:10px 14px 14px}
.main-panel{margin-top:10px}

/* Main grid inside big panel */
.main-grid{
  display:grid;
  grid-template-columns:minmax(320px,0.7fr) minmax(540px,1.3fr);
  gap:12px;
}
@media(max-width:1100px){
  .main-grid{grid-template-columns:1fr}
}

/* text bits */
.badge{
  display:inline-block;
  border:1px solid var(--border);
  border-radius:0;
  clip-path:var(--clip-sm);
  padding:2px 9px;
  font-size:10px;
  color:var(--muted);
  background:#050505;
}
.pill{
  display:inline-block;
  border-radius:0;
  border:1px solid var(--border);
  clip-path:var(--clip-sm);
  padding:4px 12px;
  font-size:12px;
  background:#050505;
  color:var(--accent);
}
.small{font-size:var(--fs-small);color:var(--muted)}

/* Inputs / buttons */
input[type="search"],select{
  width:100%;
  background:#0a0a0a;
  border:1px solid var(--border);
  border-radius:0;
  clip-path:var(--clip-sm);
  padding:8px 10px;
  color:var(--text);
  font-family:'Play';
  font-size:var(--fs-base);
}
button{
  padding:8px 12px;
  border-radius:0;
  clip-path:var(--clip-sm);
  border:1px solid var(--border);
  background:linear-gradient(180deg,#0c0c0c,#060606);
  color:var(--accent);
  cursor:pointer;
  font-family:'Play';
  font-size:12px;
  font-weight:700;
  transition:.18s;
}
button:hover{
  background:var(--accent);
  color:#000;
  box-shadow:0 0 12px rgba(214,180,76,.35);
}
.btn-danger{border-color:var(--bad);color:var(--bad)}
.btn-ok{border-color:var(--ok);color:var(--ok)}
.btn-ghost{background:transparent;border-radius:0;clip-path:var(--clip-sm)}

/* LEFT: Members list */
.members-col{
  display:flex;
  flex-direction:column;
  gap:8px;
  border-right:1px solid rgba(214,180,76,.3);
  padding-right:10px;
}
@media(max-width:1100px){
  .members-col{
    border-right:none;
    border-bottom:1px solid rgba(214,180,76,.3);
    padding-right:0;
    padding-bottom:10px;
  }
}
.mlist{
  display:flex;
  flex-direction:column;
  gap:8px;
  max-height:70vh;
  overflow:auto;
}
.mrow{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  padding:8px;
  border-radius:0;
  clip-path:var(--clip-sm);
  border:1px solid transparent;
  background:linear-gradient(90deg,#0a0a09,#080909);
  cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(214,180,76,.08);
}
.mrow:hover{
  background:#111;
  border-color:rgba(214,180,76,.45);
}
.mrow.active{
  background:rgba(214,180,76,.16);
  border-color:var(--border);
}

/* Avatar – frameless */
.mavatar{
  width:38px;height:38px;
  display:grid;place-items:center;
  overflow:hidden;
  background:transparent;
  border:none;
}
.mavatar img{
  width:100%;height:100%;object-fit:contain;
  border:none;background:transparent;box-shadow:none;filter:none;
}

/* RIGHT: dashboard */
.dashboard-col{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.ctrl-bar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.ctrl-bar select{max-width:150px}

/* KPI cards */
.kpis{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:8px 0 10px;
}
@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}}

.kpi{
  background:linear-gradient(180deg,#0b0b0b,#080808);
  border-radius:0;
  clip-path:var(--clip-sm);
  border:1px solid var(--border);
  padding:8px;
  box-shadow:0 0 14px rgba(214,180,76,.18),inset 0 0 0 1px rgba(214,180,76,.12);
  text-align:center;
}
.kpi h4{
  margin:0 0 4px;
  font-size:11px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.08em;
}
.kpi .val{
  font-size:18px;
  font-weight:700;
  color:var(--accent);
}

/* Progress bars */
.pb{
  display:grid;
  grid-template-columns:120px 1fr auto;
  gap:10px;
  align-items:center;
  margin:6px 0;
}
.pb .label{color:var(--muted);font-size:12px}
.bar{
  height:12px;background:#0a0a0a;
  border-radius:999px;border:1px solid var(--border);
  overflow:hidden;
}
.fill{
  height:100%;
  background:linear-gradient(180deg,var(--accent),#d6b44c);
}
.pb .val{
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  font-size:12px;
}

/* inner subpanels */
.subpanel{
  position:relative;
  background:linear-gradient(180deg,rgba(15,15,13,.94),rgba(8,9,9,.96));
  border-radius:0;
  border:1px solid rgba(214,180,76,.55);
  clip-path:var(--clip);
  box-shadow:0 0 12px rgba(214,180,76,.10);
  margin-top:10px;
}
.subpanel::before{
  content:"";
  position:absolute;top:0;left:0;width:74px;height:2px;
  background:var(--accent);
  box-shadow:0 0 8px rgba(242,214,117,.55);
}
.subpanel .hd{
  padding:8px 10px;
  border-bottom:1px solid rgba(214,180,76,.5);
}
.subpanel .body{padding:8px 10px 10px}
.subpanel .hd h3{font-size:13px}

/* Cert grid – 6-up */
.certGrid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:8px;
}
@media(max-width:1300px){.certGrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:1100px){.certGrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:780px){ .certGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){ .certGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.cert{
  background:transparent;
  border:none;
  padding:6px;
  text-align:center;
}
.cert.dim{opacity:.5;filter:grayscale(.5)}
.cert .thumb{
  height:72px;
  display:grid;place-items:center;
  margin-bottom:4px;
}
.cert .thumb img{
  max-height:60px;max-width:60px;
  width:auto;height:auto;object-fit:contain;
}
.cert .abbr{
  font-weight:700;
  letter-spacing:.5px;
  color:var(--accent);
  font-size:12px;
}


/* Academy Instructor Authorisation */
.instructor-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
@media(max-width:780px){.instructor-grid{grid-template-columns:1fr}}
.instructor-card{
  border:1px solid rgba(214,180,76,.4);
  border-radius:0;
  clip-path:var(--clip-sm);
  background:#0a0a0a;
  padding:10px;
}
.instructor-card.active{
  border-color:var(--border);
  background:rgba(214,180,76,.08);
}
.instructor-card .ititle{
  color:var(--accent);
  font-weight:700;
  margin-bottom:7px;
}
.instructor-options{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.instructor-options label{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:var(--muted);
}
.instructor-options input{accent-color:#d6b44c}
.instructor-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}

/* Timeline */
.timeline{
  position:relative;
  margin-top:6px;
  padding-left:0;
}
.timeline::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:2px;
  background:linear-gradient(var(--border),transparent);
}
.titem{
  position:relative;
  padding:8px 4px 8px 8px;
  border-bottom:1px solid rgba(255,255,255,.06);
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}
.titem.done .tlabel{color:var(--accent)}

/* Missions list */
.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.item{
  border:1px solid var(--border);
  border-radius:0;
  clip-path:var(--clip-sm);
  background:#0b0b0b;
  padding:8px 9px;
  box-shadow:0 0 10px rgba(214,180,76,.18),inset 0 0 0 1px rgba(214,180,76,.08);
}
.item h4{margin:0 0 4px;color:var(--accent);font-size:13px}
.item .meta{font-size:12px;color:var(--muted)}

/* New JMBN terminal-frame accents */
.panel .hd h2::before,
.subpanel .hd h3::before{
  content:"//";
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em;
}
.panel .hd{
  background:linear-gradient(90deg,rgba(214,180,76,.07),transparent 55%);
}
.subpanel .hd{
  background:linear-gradient(90deg,rgba(214,180,76,.055),transparent 60%);
}
.mrow.active{
  box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 1px rgba(214,180,76,.16);
}

</style>
</head>
<body>

<!-- Shared header mount (header2.html) -->
<div id="header2-mount">
  <!-- Fallback if header2.html fails -->
  <div class="brand">
    <img class="brand-logo"
         src="https://static.wixstatic.com/media/08ea88_820ac3bc561d4233ad73a7af859f28bf~mv2.png"
         alt="JMBN">
    <h1>JMBN Admin Console</h1>
  </div>
</div>

<div class="page">
  <!-- Big unified panel -->
  <section class="panel main-panel">
    <div class="hd">
      <h2>Member Management</h2>
      <span class="small">View activity • Manage ranks • Grant certs</span>
    </div>
    <div class="body">
      <div class="main-grid">

        <!-- LEFT: member list -->
        <div class="members-col">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">
            <h3 style="margin:0;color:var(--accent);font-size:14px;">Members</h3>
            <div style="display:flex;align-items:center;gap:6px;">
              <span class="small">Pick a member to inspect</span>
              <button id="btnSync" class="pill" type="button"
                      style="font-size:10px;padding:2px 8px;">Sync Profiles</button>
            </div>
          </div>
          <input id="mSearch" type="search" placeholder="Search handle / name…">
          <div id="mList" class="mlist" style="margin-top:8px">Loading…</div>
        </div>

        <!-- RIGHT: dashboard -->
        <div class="dashboard-col">
          <div class="ctrl-bar">
            <select id="rankTrack" title="Rank Track">
              <option value="">— Track —</option>
              <option value="Officer">Officer</option>
              <option value="Enlisted">Enlisted</option>
              <option value="Warrant">Warrant</option>
            </select>
            <button id="btnForce" class="pill" title="Force set user's rank track">Force Track</button>

            <select id="rankCode" title="Rank Code">
              <option value="">— Select Rank —</option>
            </select>
            <button id="btnSetRank" class="pill" title="Force set a specific rank code">Set Rank</button>

            <button id="btnPromote" class="pill" disabled>Run Promotion Check</button>
          </div>

          <div id="inspector">
            <div class="small">Select a member on the left to open their dashboard.</div>
          </div>
        </div>

      </div>
    </div>
  </section>
</div>

<!-- Supabase JS (ESM) -->
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

/* ===== Supabase config (same project as mission-log / editor) ===== */
const SUPABASE_URL  = 'https://fcegavhipeaeihxegsnw.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZWdhdmhpcGVhZWloeGVnc253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxMjk3NTcsImV4cCI6MjA3NzcwNTc1N30.i-ZjOlKc89-uA7fqOIvmAMv60-C2_NmKikRI_78Jei8'

const sb  = createClient(SUPABASE_URL, SUPABASE_ANON)

const $   = s => document.querySelector(s)
const esc = s => { const d=document.createElement('div'); d.textContent=s ?? ''; return d.innerHTML }
const setFill = (el,p) => {
  if(!el) return
  const x = Math.max(0, Math.min(1, Number(p)||0))
  el.style.width = (x*100) + '%'
}

let me        = null
let isElev    = false
let MEMBERS   = []
let SELECTED  = null
let RANKS     = []

/* ===== Shared header mount ===== */
async function mountHeader2(){
  const mount = document.getElementById('header2-mount')
  if(!mount) return
  try{
    const res = await fetch('header2.html',{cache:'no-cache'})
    if(!res.ok) return
    const html = await res.text()
    mount.innerHTML = html

    const here = (location.pathname.split('/').pop() || 'index.html')
    const active = mount.querySelector(`.nav-btn[href="${here}"]`)
    if(active) active.classList.add('active')
  }catch(err){
    console.error('Failed to mount header2:', err)
  }
}

/* ===== Sync missing profiles (RPC) ===== */
async function runSyncProfiles(quiet = false){
  const btn = $('#btnSync')
  if(!quiet && btn){
    btn.disabled = true
    btn.textContent = 'Syncing…'
  }
  try{
    const { data: syncCount, error: syncErr } = await sb.rpc('sync_missing_profiles')
    if(syncErr){
      console.warn('sync_missing_profiles error:', syncErr.message)
      if(!quiet) alert('Sync failed: ' + syncErr.message)
    }else{
      console.log('Profiles synced:', syncCount)
      if(!quiet) alert(`Profiles synced: ${syncCount ?? 0}`)
      await loadMembers()
    }
  }catch(e){
    console.warn('sync_missing_profiles failed:', e.message || e)
    if(!quiet) alert('Sync failed: ' + (e.message || e))
  }finally{
    if(!quiet && btn){
      btn.disabled = false
      btn.textContent = 'Sync Profiles'
    }
  }
}

/* ===== Boot ===== */
document.addEventListener('DOMContentLoaded', boot)

async function boot(){
  await mountHeader2()

  // Get current auth session
  const { data: { session }, error: sErr } = await sb.auth.getSession()
  if(sErr){
    console.error('getSession error:', sErr.message)
  }
  if(!session){
    $('#inspector').innerHTML =
      '<div class="small" style="color:#ff9c9c">Not signed in. Please log in via your auth flow.</div>'
    return
  }

  me = session.user.id

  // Quiet auto-sync on load
  runSyncProfiles(true)

  /* ==== CHECK ELEVATION ==== */
  try{
    const { data, error } = await sb.rpc('is_elevated',{ u: me })
    if(error) console.warn('is_elevated error:', error.message)
    isElev = data === true
  }catch(e){
    console.warn('is_elevated rpc failed:', e.message || e)
  }

  if(!isElev){
    $('#inspector').innerHTML =
      '<div class="small" style="color:#ff6b6b">Access denied — not elevated.</div>'
    $('#mList').textContent = 'No access.'
    return
  }

  // Wire Sync button for manual use
  const syncBtn = $('#btnSync')
  if(syncBtn){
    syncBtn.onclick = () => runSyncProfiles(false)
  }

  /* ==== CONTINUE NORMAL BOOT ==== */
  await loadMembers()
  await loadRankOptions()

  $('#mSearch').oninput    = renderMembers
  $('#rankTrack').onchange = e => loadRankOptions(e.target.value)

  $('#btnForce').onclick = async () => {
    if(!SELECTED) return alert('Select a member first.')
    const track = $('#rankTrack').value
    if(!track) return alert('Choose a track.')
    if(!confirm(`Force set ${SELECTED.handle || SELECTED.display_name || SELECTED.user_id.slice(0,8)} to ${track}?`)) return
    const { error } = await sb.rpc('set_rank_track',{ p_user: SELECTED.user_id, p_track: track })
    if(error) return alert('Force set failed: ' + error.message)
    alert('Track updated ✓')
    await openMember(SELECTED.user_id)
    await loadMembers()
  }

  $('#btnSetRank').onclick = async () => {
    if(!SELECTED) return alert('Select a member first.')
    const code = $('#rankCode').value
    if(!code) return alert('Choose a rank.')
    if(!confirm(`Force set ${SELECTED.handle || SELECTED.display_name || SELECTED.user_id.slice(0,8)} to ${code}?`)) return
    const { error } = await sb.rpc('set_rank_code',{ p_user: SELECTED.user_id, p_code: code })
    if(error) return alert('Set rank failed: ' + error.message)
    alert('Rank updated ✓')
    await openMember(SELECTED.user_id)
    await loadMembers()
  }

  $('#btnPromote').onclick = async () => {
    if(!SELECTED) return
    const { data, error } = await sb.rpc('request_promotion',{ p_user: SELECTED.user_id })
    if(error) return alert('Promotion failed: ' + error.message)
    alert(data?.message || (data?.ok ? 'Promotion OK' : 'Not eligible yet'))
    await openMember(SELECTED.user_id)
  }
}

/* ===== Ranks dropdown ===== */
async function loadRankOptions(track=''){
  if(!RANKS.length){
    const { data, error } = await sb
      .from('ranks')
      .select('code,name,category,sort_order')
      .order('sort_order')
    if(error){
      console.warn('ranks error:', error.message)
      return
    }
    RANKS = (data || [])
  }
  const want  = (track || $('#rankTrack').value || '').toLowerCase()
  const items = RANKS.filter(r => !want || (r.category || '').toLowerCase() === want)
  const sel   = $('#rankCode')
  sel.innerHTML = '<option value="">— Select Rank —</option>' +
    items.map(r => `<option value="${r.code}">${r.code} — ${esc(r.name)}</option>`).join('')
}

/* ===== Members list ===== */
async function loadMembers(){
  const list = $('#mList')
  list.textContent = 'Loading…'

  try {
    // rank + basic info
    const { data: vrows, error: vErr } = await sb
      .from('v_profiles_detailed')
      .select(`
        user_id,
        handle,
        display_name,
        current_rank_category,
        current_rank_name,
        current_rank_code,
        current_rank_image_url
      `)
      .order('handle')

    if (vErr) throw vErr

    // roles from public.profiles
    const { data: prows, error: pErr } = await sb
      .from('profiles')
      .select('user_id, role')

    if (pErr) throw pErr

    const roleMap = new Map((prows || []).map(r => [r.user_id, r.role]))

    MEMBERS = (vrows || []).map(r => ({
      ...r,
      role: roleMap.get(r.user_id) || 'Guest'
    }))

    renderMembers()
  } catch (err) {
    console.error('loadMembers error:', err.message || err)
    list.textContent = 'Failed to load members: ' + (err.message || err)
  }
}

function renderMembers(){
  const q    = ($('#mSearch').value || '').toLowerCase().trim()
  const list = $('#mList')
  const rows = q
    ? MEMBERS.filter(m => (`${m.handle} ${m.display_name}`).toLowerCase().includes(q))
    : MEMBERS

  if(!rows.length){
    list.textContent = 'No matches.'
    return
  }
  list.innerHTML = ''
  rows.forEach(m => {
    const row = document.createElement('div')
    row.className = 'mrow'
    row.innerHTML = `
      <div class="mavatar">
        ${m.current_rank_image_url
          ? `<img src="${esc(m.current_rank_image_url)}" alt="rank">`
          : '👤'}
      </div>
      <div>
        <div><b>${esc(m.handle || '(no handle)')}</b>
          <span class="small">• ${esc(m.display_name || '')}</span>
        </div>
        <div class="small">
          Role: ${esc(m.role || 'Guest')} •
          ${esc(m.current_rank_category || 'Unrated')} — ${esc(m.current_rank_name || 'Unrated')}
        </div>
      </div>
      <div><button class="pill" type="button">Open</button></div>`
    row.querySelector('button').onclick = () => openMember(m.user_id, row)
    list.appendChild(row)
  })
}

function markActive(row){
  document.querySelectorAll('.mrow').forEach(x => x.classList.remove('active'))
  row && row.classList.add('active')
}

/* ===== Dashboard for a member ===== */
async function openMember(userId, rowEl){
  const res = MEMBERS.find(x => x.user_id === userId)
  if(!res) return
  SELECTED = res
  markActive(rowEl)
  $('#btnPromote').disabled = false

  $('#rankTrack').value = res.current_rank_category || ''
  await loadRankOptions(res.current_rank_category || '')
  if(res.current_rank_code) $('#rankCode').value = res.current_rank_code

  $('#inspector').innerHTML = `
    <div id="summary"></div>

    <div class="kpis">
      <div class="kpi"><h4>Total Missions</h4><div class="val" id="k_mis">—</div></div>
      <div class="kpi"><h4>Total Hours</h4><div class="val" id="k_hrs">—</div></div>
      <div class="kpi"><h4>Owned Certs</h4><div class="val" id="k_cer">—</div></div>
    </div>

    <div class="pb">
      <div class="label">Missions</div>
      <div class="bar"><div id="pbMis" class="fill" style="width:0%"></div></div>
      <div class="val" id="vMis">—</div>
    </div>
    <div class="pb">
      <div class="label">Hours</div>
      <div class="bar"><div id="pbHrs" class="fill" style="width:0%"></div></div>
      <div class="val" id="vHrs">—</div>
    </div>
    <div class="pb">
      <div class="label">Certifications</div>
      <div class="bar"><div id="pbCer" class="fill" style="width:0%"></div></div>
      <div class="val" id="vCer">—</div>
    </div>

    <div class="subpanel">
      <div class="hd"><h3>Certifications</h3></div>
      <div class="body"><div id="certGrid" class="certGrid">Loading…</div></div>
    </div>

    <div class="subpanel">
      <div class="hd">
        <h3>Academy Instructor Authorisation</h3>
        <span id="instructorBadge" class="badge">Loading…</span>
      </div>
      <div class="body">
        <div class="small" style="margin-bottom:8px">
          Authorise this member to instruct and/or sign off specific Academy programmes.
          This does not change their normal JMBN role or rank.
        </div>
        <div id="instructorGrid" class="instructor-grid">Loading…</div>
        <div class="instructor-actions">
          <button id="btnSaveInstructor" class="btn-ok" type="button">Save Authorisation</button>
        </div>
      </div>
    </div>


    <div class="subpanel">
      <div class="hd">
        <h3>Certification Timeline</h3>
        <div>
          <select id="certSelect"></select>
          <button id="btnReloadTL" class="btn-ghost" type="button">Load</button>
        </div>
      </div>
      <div class="body">
        <div id="tlHint" class="small">Pick a certification to manage completions.</div>
        <div id="timeline" class="timeline"></div>
      </div>
    </div>

    <div class="subpanel">
      <div class="hd">
        <h3>Missions <span id="misCount" class="badge">0</span></h3>
        <div><button id="misReload" class="pill" type="button">Reload</button></div>
      </div>
      <div class="body"><div id="misList" class="list">Loading…</div></div>
    </div>
  `

  await Promise.all([
    loadProgress(userId),
    loadCerts(userId),
    loadInstructorAuthorisations(userId),
    loadMissions(userId)
  ])

  $('#misReload').onclick = () => loadMissions(userId)
}

/* ===== Progress + ROLE CONTROL ===== */
async function loadProgress(uid){
  const [{ data: prog }, { data: up }] = await Promise.all([
    sb.from('v_user_rank_progress').select('*').eq('user_id', uid).maybeSingle(),
    sb.from('v_user_progress').select('*').eq('user_id', uid).maybeSingle()
  ])

  const cur   = esc(prog?.current_name || '(unranked)')
  const curPg = esc(prog?.current_paygrade || '—')
  const nxt   = esc(prog?.next_name || '—')
  const nxtPg = esc(prog?.next_paygrade || '—')

  $('#summary').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">
      <div>
        <div><b>Current:</b>
          <span style="color:var(--accent)">${cur}</span>
          <span class="pill">PG: ${curPg}</span>
        </div>
        <div class="small">
          Next: ${nxt} <span class="pill">PG: ${nxtPg}</span>
        </div>
      </div>
      <div>
        <div class="small">
          Targets • M:${prog?.missions_target ?? 0}
          • H:${prog?.hours_target ?? 0}
          • C:${prog?.certification_target ?? 0}
        </div>
        <label class="small" style="display:flex;align-items:center;gap:6px;margin-top:4px;">
          Role:
          <select id="roleSelect"
            style="max-width:150px;background:#0a0a0a;border:1px solid var(--border);border-radius:8px;padding:4px 6px;color:var(--text);font-family:'Play';font-size:11px;">
            <option value="Admin">Admin</option>
            <option value="Member">Member</option>
            <option value="Recruit">Recruit</option>
            <option value="Guest">Guest</option>
          </select>
          <button id="btnSetRole" class="pill" type="button" style="font-size:11px;padding:3px 8px;">Update</button>
        </label>
      </div>
    </div>`

  const m  = Number(up?.missions_attended || 0)
  const h  = Number(up?.hours_total || 0)
  const c  = Number(up?.certifications_total || 0)
  const mt = Number(prog?.missions_target || 0)
  const ht = Number(prog?.hours_target || 0)
  const ct = Number(prog?.certification_target || 0)

  $('#k_mis').textContent = String(m)
  $('#k_hrs').textContent = String(h)
  $('#k_cer').textContent = String(c)

  $('#vMis').textContent = `${m} / ${mt}`
  $('#vHrs').textContent = `${h} / ${ht}`
  $('#vCer').textContent = `${c} / ${ct}`

  setFill($('#pbMis'), mt ? Math.min(1, m/mt) : 1)
  setFill($('#pbHrs'), ht ? Math.min(1, h/ht) : 1)
  setFill($('#pbCer'), ct ? Math.min(1, c/ct) : 1)

  // Wire up Role controls
  const roleSelect = document.getElementById('roleSelect')
  const btnSetRole = document.getElementById('btnSetRole')

  if(roleSelect){
    roleSelect.value = SELECTED?.role || 'Guest'
  }

  if(btnSetRole){
    btnSetRole.onclick = async () => {
      if(!SELECTED) return alert('No member selected.')
      const newRole = roleSelect.value
      try{
        const { error } = await sb
          .from('profiles')
          .update({ role: newRole })
          .eq('user_id', SELECTED.user_id)
        if(error) return alert('Failed to update role: ' + error.message)
        alert('Role updated ✓')

        // update local cache
        SELECTED.role = newRole
        const idx = MEMBERS.findIndex(m => m.user_id === SELECTED.user_id)
        if(idx !== -1) MEMBERS[idx].role = newRole
        renderMembers()
      }catch(e){
        alert('Failed to update role: ' + (e.message || e))
      }
    }
  }
}

/* ===== Certifications ===== */
async function loadCerts(uid){
  const [{ data: catalog }, { data: mine }] = await Promise.all([
    sb.from('certifications')
      .select('certification_code,name,image_url,sort_order,is_active')
      .order('sort_order'),
    sb.from('user_certifications')
      .select('certification_code')
      .eq('user_id', uid)
  ])

  const owned  = new Set((mine || []).map(x => x.certification_code))
  const grid   = $('#certGrid'); grid.innerHTML = ''
  const select = $('#certSelect'); select.innerHTML = ''

  ;(catalog || []).forEach(c => {
    const div = document.createElement('div')
    div.className = 'cert' + (owned.has(c.certification_code) ? '' : ' dim')
    div.innerHTML = `
      <div class="thumb">${c.image_url ? `<img src="${esc(c.image_url)}" alt="">` : '🏅'}</div>
      <div class="abbr">${esc(c.certification_code)}</div>`
    div.title = c.name || c.certification_code
    div.style.cursor = 'pointer'
    div.onclick = () => {
      select.value = c.certification_code
      loadTimeline(uid, c.certification_code)
      $('#tlHint').textContent = c.name || c.certification_code
      $('#timeline').scrollIntoView({ behavior:'smooth', block:'nearest' })
    }
    grid.appendChild(div)

    const opt = document.createElement('option')
    opt.value = c.certification_code
    opt.textContent = `${c.certification_code} — ${c.name}`
    select.appendChild(opt)
  })

  $('#btnReloadTL').onclick = () => loadTimeline(uid, select.value)
}


/* ===== Academy Instructor Authorisation ===== */
async function loadInstructorAuthorisations(uid){
  const grid = $('#instructorGrid')
  const badge = $('#instructorBadge')
  if(!grid) return

  grid.textContent = 'Loading…'

  const [{ data: catalog, error: cErr }, { data: auths, error: aErr }] = await Promise.all([
    sb.from('certifications')
      .select('certification_code,name,sort_order,is_active')
      .eq('is_active', true)
      .order('sort_order'),
    sb.from('academy_instructors')
      .select('certification_code,can_instruct,can_sign_off,is_active')
      .eq('user_id', uid)
  ])

  if(cErr || aErr){
    grid.innerHTML = `<div class="small" style="color:#ff9c9c">
      Failed to load instructor authorisations: ${esc(cErr?.message || aErr?.message || 'Unknown error')}
    </div>`
    if(badge) badge.textContent = 'ERROR'
    return
  }

  const map = new Map((auths || []).map(x => [x.certification_code, x]))
  grid.innerHTML = ''

  ;(catalog || []).forEach(c => {
    const a = map.get(c.certification_code)
    const enabled = !!a?.is_active
    const card = document.createElement('div')
    card.className = 'instructor-card' + (enabled ? ' active' : '')
    card.dataset.code = c.certification_code
    card.innerHTML = `
      <div class="ititle">${esc(c.certification_code)} — ${esc(c.name || c.certification_code)}</div>
      <div class="instructor-options">
        <label>
          <input class="i-enabled" type="checkbox" ${enabled ? 'checked' : ''}>
          Instructor authorised
        </label>
        <label>
          <input class="i-instruct" type="checkbox" ${a?.can_instruct ? 'checked' : ''}>
          Can conduct training
        </label>
        <label>
          <input class="i-signoff" type="checkbox" ${a?.can_sign_off ? 'checked' : ''}>
          Can sign off practicals
        </label>
      </div>`

    const enabledBox = card.querySelector('.i-enabled')
    const instructBox = card.querySelector('.i-instruct')
    const signoffBox = card.querySelector('.i-signoff')

    const syncCard = () => {
      const on = enabledBox.checked
      card.classList.toggle('active', on)
      instructBox.disabled = !on
      signoffBox.disabled = !on
      if(on && !instructBox.checked && !signoffBox.checked){
        instructBox.checked = true
        signoffBox.checked = true
      }
    }
    enabledBox.addEventListener('change', syncCard)
    syncCard()
    grid.appendChild(card)
  })

  const activeCount = (auths || []).filter(x => x.is_active).length
  if(badge) badge.textContent = activeCount ? `${activeCount} PROGRAMME${activeCount === 1 ? '' : 'S'}` : 'NOT INSTRUCTOR'

  const save = $('#btnSaveInstructor')
  if(save){
    save.onclick = () => saveInstructorAuthorisations(uid)
  }
}

async function saveInstructorAuthorisations(uid){
  if(!SELECTED || SELECTED.user_id !== uid) return
  const btn = $('#btnSaveInstructor')
  const cards = [...document.querySelectorAll('#instructorGrid .instructor-card')]

  if(!cards.length) return alert('No Academy programmes found.')
  if(!confirm(`Save Academy instructor permissions for ${SELECTED.handle || SELECTED.display_name || uid.slice(0,8)}?`)) return

  btn.disabled = true
  btn.textContent = 'Saving…'

  try{
    for(const card of cards){
      const certification_code = card.dataset.code
      const is_active = card.querySelector('.i-enabled').checked
      const can_instruct = is_active && card.querySelector('.i-instruct').checked
      const can_sign_off = is_active && card.querySelector('.i-signoff').checked

      const { error } = await sb
        .from('academy_instructors')
        .upsert({
          user_id: uid,
          certification_code,
          can_instruct,
          can_sign_off,
          is_active,
          authorised_by: me,
          authorised_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        }, { onConflict:'user_id,certification_code' })

      if(error) throw error
    }

    alert('Instructor authorisation updated ✓')
    await loadInstructorAuthorisations(uid)
  }catch(e){
    alert('Failed to save instructor authorisation: ' + (e.message || e))
  }finally{
    btn.disabled = false
    btn.textContent = 'Save Authorisation'
  }
}


/* ===== Timeline ===== */
async function loadTimeline(uid, certCode){
  const tl = $('#timeline'); tl.innerHTML = ''
  if(!certCode){
    tl.innerHTML = '<div class="small">Pick a certification.</div>'
    return
  }

  const [{ data: reqs }, { data: recs }] = await Promise.all([
    sb.from('certification_requirements')
      .select('event_code, sort_order, training_events(title, description)')
      .eq('certification_code', certCode)
      .order('sort_order'),
    sb.from('user_training_events')
      .select('event_code, completed_at, approved_by, approved_at')
      .eq('user_id', uid)
  ])
  const done = new Map((recs || []).map(r => [r.event_code, r]))

  if(!reqs?.length){
    tl.innerHTML = '<div class="small">No requirements configured.</div>'
    return
  }

  reqs.forEach(r => {
    const rec = done.get(r.event_code)
    const ok  = !!rec
    const row = document.createElement('div')
    row.className = 'titem' + (ok ? ' done' : '')
    row.innerHTML = `
      <div>
        <div class="tlabel">${esc(r.training_events?.title || r.event_code)}</div>
        <div class="small">${esc(r.training_events?.description || '')}</div>
        ${ok ? `<div class="small">
          Completed: ${new Date(rec.approved_at || rec.completed_at).toLocaleString()}
          ${rec.approved_by ? ` • by ${esc(rec.approved_by.slice(0,8))}` : ''}
        </div>` : ''}
      </div>
      <div>
        ${ok
          ? `<button class="btn-danger" data-remove="${r.event_code}" type="button">Remove</button>`
          : `<button class="btn-ok" data-add="${r.event_code}" type="button">Grant</button>`}
      </div>`
    tl.appendChild(row)
  })

  tl.querySelectorAll('button[data-add]').forEach(b => {
    b.onclick = async () => {
      const { error } = await sb.from('user_training_events').insert({
        user_id: uid,
        event_code: b.dataset.add,
        completed_at: new Date().toISOString()
      })
      if(error) return alert('Grant failed: ' + error.message)
      await Promise.all([loadTimeline(uid, certCode), loadProgress(uid)])
    }
  })
  tl.querySelectorAll('button[data-remove]').forEach(b => {
    b.onclick = async () => {
      const { error } = await sb.from('user_training_events')
        .delete().eq('user_id', uid).eq('event_code', b.dataset.remove)
      if(error) return alert('Remove failed: ' + error.message)
      await Promise.all([loadTimeline(uid, certCode), loadProgress(uid)])
    }
  })
}

/* ===== Missions ===== */
async function loadMissions(uid){
  const box   = $('#misList')
  const count = $('#misCount')
  box.textContent = 'Loading…'

  try{
    let { data, error } = await sb
      .from('v_mission_attendees_detailed')
      .select('mission_id, attendance, missions(id,title,start_time)')
      .eq('user_id', uid)
      .order('missions.start_time', { ascending:false })
      .limit(20)

    // fallback if joined missions is null
    if(error || (data && data.length && data[0].missions == null)){
      const { data: bare, error: e2 } = await sb
        .from('v_mission_attendees_detailed')
        .select('mission_id, attendance')
        .eq('user_id', uid)
        .order('mission_id', { ascending:false })
        .limit(50)
      if(e2) throw e2

      const ids = [...new Set((bare || []).map(r => r.mission_id))]
      let map = {}
      if(ids.length){
        const { data: mrows } = await sb
          .from('missions')
          .select('id,title,start_time')
          .in('id', ids)
        map = Object.fromEntries((mrows || []).map(m => [m.id, m]))
      }
      data = (bare || [])
        .map(r => ({ ...r, missions: map[r.mission_id] || null }))
        .sort((a,b) => new Date(b.missions?.start_time || 0) - new Date(a.missions?.start_time || 0))
        .slice(0,20)
    }

    const attended = (data || []).filter(r => r.attendance && r.attendance.toLowerCase() !== 'withdrawn')
    count.textContent = String(attended.length)

    if(!data || !data.length){
      box.innerHTML = '<div class="small">No missions found.</div>'
      return
    }

    box.innerHTML = data.map(r => {
      const m    = r.missions || {}
      const when = m.start_time ? new Date(m.start_time).toLocaleString() : ''
      const att  = r.attendance || '—'
      return `<div class="item">
        <h4>${esc(m.title || 'Untitled Mission')}</h4>
        <div class="meta">${when} • Attendance: ${esc(att)}</div>
      </div>`
    }).join('')
  }catch(e){
    box.innerHTML = `<div class="small" style="color:#ff9c9c">
      Failed to load missions: ${esc(e.message || e)}
    </div>`
    count.textContent = '0'
  }
}
</script>
