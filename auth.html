<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070806"><title>JMBN // Secure Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070806;color:#eef0e8;font-family:Inter,sans-serif;display:grid;place-items:center;padding:20px;overflow:hidden}.bg{position:fixed;inset:0;background:linear-gradient(90deg,#070806 10%,rgba(7,8,6,.78),rgba(7,8,6,.35)),url("assets/supabase/JMBNR/09.png") center/cover;filter:saturate(.55)}.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(212,182,91,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(212,182,91,.045) 1px,transparent 1px);background-size:45px 45px}.card{z-index:1;width:min(430px,100%);margin-left:min(42vw,600px);background:rgba(10,12,9,.94);border:1px solid #35372d;padding:32px;box-shadow:0 30px 80px #000}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}.sig{width:42px;height:42px}.logo-img{object-fit:contain;border:0!important;outline:0!important;transform:none!important;filter:none;background:transparent;box-shadow:none;border-radius:0;font-style:normal}.brand b{display:block;font:700 22px "Barlow Condensed";letter-spacing:.08em}.brand small,.eyebrow{color:#d4b65b;font-size:8px;letter-spacing:.18em}.card h1{font:700 46px "Barlow Condensed";line-height:.9;margin:9px 0 12px}.sub{color:#858b7d;font-size:11px;line-height:1.6;margin-bottom:25px}label{display:block;color:#9b9f94;font-size:9px;letter-spacing:.1em;margin:12px 0 6px}input{width:100%;background:#0a0c09;border:1px solid #2b2e26;color:#fff;padding:12px;outline:none}input:focus{border-color:#625a35}button{width:100%;padding:13px;margin-top:12px;font:700 10px Inter;letter-spacing:.08em;cursor:pointer}.primary{background:#d4b65b;border:1px solid #d4b65b;color:#080906}.discord{background:#11131b;border:1px solid #454d93;color:#dfe2ff}.divider{text-align:center;color:#555b51;font-size:8px;margin:15px 0 4px}.msg{color:#c9675f;font-size:10px;min-height:16px;margin-top:10px}.foot{margin-top:28px;border-top:1px solid #272b22;padding-top:14px;color:#555b51;font-size:8px;display:flex;justify-content:space-between}@media(max-width:800px){.card{margin:0}.bg{opacity:.5}.card h1{font-size:40px}}</style></head><body><div class="bg"></div><div class="grid"></div><main class="card"><div class="brand"><img class="sig logo-img" src="icons/icon-192.png" alt="JMBN Logo"><span><b>JMBN MANIFEST</b><small>OPERATIONS NETWORK</small></span></div><p class="eyebrow">SECURE PERSONNEL ACCESS</p><h1>REPORT TO<br>YOUR STATION.</h1><p class="sub">Authenticate to access the live crew manifest, operations board and Academy records.</p><label>USERNAME</label><input id="u" autocomplete="username" placeholder="Callsign"><label>PASSWORD</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••"><button id="login" class="primary">AUTHENTICATE</button><div class="divider">— OR —</div><button id="discord" class="discord">CONTINUE WITH DISCORD</button><div id="msg" class="msg"></div><div class="foot"><span>AUTHORIZED PERSONNEL ONLY</span><span>JMBN // SECURE</span></div></main><script>
const SUPABASE_URL="https://fcegavhipeaeihxegsnw.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6ImZjZWdhdmhpcGVhZWloeGVnc253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxMjk3NTcsImV4cCI6MjA3NzcwNTc1N30.i-ZjOlKc89-uA7fqOIvmAMv60-C2_NmKikRI_78Jei8";
function getBasePath(){try{const parts=location.pathname.split("/").filter(Boolean);if(/\.github\.io$/.test(location.hostname)&&parts.length)return"/"+parts[0]+"/"}catch{}return"/"}
const BASE=getBasePath();
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,detectSessionInUrl:false,flowType:"pkce",autoRefreshToken:true}});
function goto(path=""){location.href=/^\//.test(path)?path:BASE+path}
async function getSession(){const {data}=await sb.auth.getSession();return data?.session??null}
async function signIn(usernameOrEmail,password){const email=usernameOrEmail.includes("@")?usernameOrEmail:`${usernameOrEmail}@jmbn.local`;return await sb.auth.signInWithPassword({email,password})}
async function loginWithDiscord(){const redirectTo=`${location.origin}${BASE}auth.html`;const {error}=await sb.auth.signInWithOAuth({provider:"discord",options:{redirectTo,scopes:"identify email"}});if(error)throw error}
(async()=>{try{const url=new URL(location.href),code=url.searchParams.get("code"),errorDesc=url.searchParams.get("error_description");if(errorDesc)document.getElementById("msg").textContent="Discord login failed: "+errorDesc;if(code){const {error}=await sb.auth.exchangeCodeForSession(code);if(error){document.getElementById("msg").textContent=error.message;return}history.replaceState({},document.title,BASE+"auth.html")}const session=await getSession();if(session)goto("index.html")}catch(e){console.error("[auth]",e)}})();
document.getElementById("login").addEventListener("click",async()=>{const u=document.getElementById("u").value.trim(),p=document.getElementById("p").value,m=document.getElementById("msg");m.textContent="";if(!u||!p){m.textContent="Enter your credentials.";return}const {error}=await signIn(u,p);if(error)m.textContent=error.message;else goto("index.html")});
document.getElementById("discord").addEventListener("click",async()=>{const m=document.getElementById("msg");m.textContent="Connecting to Discord...";try{await loginWithDiscord()}catch(error){console.error("[auth] Discord login:",error);m.textContent=error?.message||"Discord login failed."}});
sb.auth.onAuthStateChange((event,session)=>{if(event==="SIGNED_IN"&&session&&(location.pathname.endsWith("/auth.html")||location.pathname.endsWith("auth.html")))goto("index.html")});
</script></body></html>
