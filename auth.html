<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070806"><title>JMBN // Secure Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>
:root{--auth-bg:#070806;--auth-armor:#35372d;--auth-line:#2b2e26;--auth-dark:#272b22;--auth-gold:#d4b65b;--auth-bright:#f1d77b;--auth-white:#edf0e8}
*{box-sizing:border-box}
html{background:var(--auth-bg)}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:12px;overflow-x:hidden;background:var(--auth-bg);color:var(--auth-white);font-family:"Play",system-ui,sans-serif}
.auth-backdrop{position:fixed;inset:0;z-index:0;background:url("assets/auth-background.png") center/cover no-repeat;filter:brightness(.55) saturate(.62)}
.auth-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(212,182,91,.038) 1px,transparent 1px),linear-gradient(90deg,rgba(212,182,91,.038) 1px,transparent 1px);background-size:50px 50px}
.auth-frame{position:relative;z-index:1;isolation:isolate;flex:0 0 auto;width:min(960px,96vw,calc((100svh - 24px)*1.5));aspect-ratio:1536/1024}
.auth-frame::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:url("assets/auth-panel.png") center/100% 100% no-repeat}
.auth-content{position:absolute;z-index:2;inset:11.5% 12.2% 10.4% 16.5%;display:flex;flex-direction:column;justify-content:center;padding:clamp(10px,1.7vw,23px) clamp(14px,2vw,26px);background:linear-gradient(125deg,rgba(8,10,8,.88),rgba(7,8,7,.77));border:1px solid rgba(53,55,45,.5);box-shadow:inset 0 0 32px rgba(0,0,0,.25);min-width:0}
.auth-brand{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.auth-brand img{width:48px;height:48px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(212,182,91,.15))}
.auth-brand strong{display:block;color:var(--auth-gold);font-weight:700;font-size:25px;letter-spacing:.25em;line-height:1.05}
.auth-brand small{display:block;color:#bbbba9;font-size:10px;letter-spacing:.19em;margin-top:4px}
.eyebrow{color:var(--auth-gold);font-weight:700;font-size:10px;letter-spacing:.13em;margin:0 0 6px}
h1{margin:0 0 8px;font-weight:700;font-size:clamp(30px,3.2vw,43px);letter-spacing:.025em;line-height:.99}
.sub{color:#b8bcb0;font-size:12px;line-height:1.45;margin:0 0 11px;max-width:500px}
.auth-fields{display:grid;gap:6px}
label{display:block;color:#d6d7c8;font-size:10px;letter-spacing:.12em;margin-top:2px}
input{width:100%;height:39px;padding:9px 12px;border:1px solid var(--auth-armor);border-radius:0;outline:none;background:rgba(8,10,8,.93);color:var(--auth-white);font:13px "Play",system-ui,sans-serif}
input::placeholder{color:#858a7d}
input:focus{border-color:var(--auth-gold);box-shadow:0 0 0 1px rgba(212,182,91,.18)}
button{width:100%;min-height:40px;padding:10px 12px;margin-top:11px;font:700 12px "Play",system-ui,sans-serif;letter-spacing:.12em;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
button:hover{transform:translateY(-1px)}
button:focus-visible{outline:2px solid var(--auth-bright);outline-offset:3px}
.primary{background:linear-gradient(135deg,var(--auth-bright),var(--auth-gold));border:1px solid var(--auth-bright);color:#12130d}
.primary:hover{background:var(--auth-bright)}
.divider{text-align:center;color:#9b9e8c;font-size:10px;letter-spacing:.13em;margin:7px 0 -3px}
.discord{background:rgba(39,43,34,.82);border:1px solid #6f6a49;color:#e9eadd;margin-top:9px}
.discord:hover{background:var(--auth-armor);border-color:var(--auth-gold)}
.msg{color:#ff9788;font-size:11px;min-height:15px;margin-top:6px}
.foot{margin-top:5px;padding-top:8px;border-top:1px solid var(--auth-line);display:flex;justify-content:space-between;gap:10px;color:#abae9f;font-size:9px;letter-spacing:.06em}
.foot span:last-child{color:var(--auth-gold)}
@media(max-height:740px) and (min-width:721px){.auth-frame{width:min(900px,95vw,calc((100svh - 14px)*1.5))}.auth-content{inset:10.6% 12.2% 9.6% 16.5%;padding:8px 18px}.auth-brand{margin-bottom:7px}.auth-brand img{width:39px;height:39px}.auth-brand strong{font-size:21px}.auth-brand small{font-size:9px;margin-top:2px}h1{font-size:32px;margin-bottom:5px}.sub{margin-bottom:6px;font-size:11px}.eyebrow{margin-bottom:4px}.auth-fields{gap:4px}input{height:34px;padding:6px 11px}button{min-height:35px;padding:7px 10px;margin-top:7px}.divider{margin:5px 0 -4px}.discord{margin-top:7px}.foot{margin-top:2px;padding-top:6px}}
@media(max-width:720px){body{padding:8px;align-items:flex-start;overflow-y:auto}.auth-backdrop{filter:brightness(.38) saturate(.65)}.auth-frame{aspect-ratio:auto;width:min(480px,100%);min-height:700px;margin:auto 0}.auth-content{inset:8% 7% 8% 13%;padding:20px 17px}.auth-brand{gap:9px}.auth-brand img{width:45px;height:45px}.auth-brand strong{font-size:22px}.auth-brand small{font-size:9px;letter-spacing:.14em}.eyebrow{font-size:9px}h1{font-size:clamp(29px,8vw,38px)}.sub{font-size:11px;line-height:1.5}input{height:42px}.foot{font-size:8px}.auth-frame::before{background-size:100% 100%}}
@media(max-width:375px){.auth-frame{min-height:685px}.auth-content{inset:7.5% 6% 7.5% 15%;padding:12px 11px}.auth-brand strong{font-size:19px;letter-spacing:.18em}.auth-brand img{width:39px;height:39px}.auth-brand small{font-size:8px}.foot{font-size:7px;letter-spacing:0}h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){button{transition:none}button:hover{transform:none}}
</style></head><body>
<div class="auth-backdrop" aria-hidden="true"></div>
<div class="auth-grid" aria-hidden="true"></div>
<main class="auth-frame" aria-label="JMBN secure personnel authentication">
 <div class="auth-content">
  <header class="auth-brand"><img src="assets/jmbn.png" alt="JMBN emblem"><div><strong>JMBN</strong><small>MANIFEST SYSTEM</small></div></header>
  <p class="eyebrow">/// SECURE PERSONNEL ACCESS</p>
  <h1>REPORT TO<br>YOUR STATION.</h1>
  <p class="sub">Authenticate to access the live crew manifest, operations board and Academy records.</p>
  <div class="auth-fields">
   <label for="u">USERNAME</label><input id="u" autocomplete="username" placeholder="Callsign" aria-label="Username or callsign">
   <label for="p">PASSWORD</label><input id="p" type="password" autocomplete="current-password" placeholder="••••••••" aria-label="Password">
  </div>
  <button id="login" type="button" class="primary">AUTHENTICATE</button>
  <div class="divider">— OR —</div>
  <button id="discord" type="button" class="discord">CONTINUE WITH DISCORD</button>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div class="foot"><span>AUTHORIZED PERSONNEL ONLY</span><span>JMBN // SECURE</span></div>
 </div>
</main>
<script src="js/auth.js?v=jmbn-auth-20261118-manifest1"></script><script>
const msg=document.getElementById("msg");
(async()=>{try{const session=await getSession();if(session)location.replace(getBasePath()+"manifest/")}catch(error){console.error("[auth.html] Session check:",error)}})();
document.getElementById("login").addEventListener("click",async()=>{const u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;msg.textContent="";if(!u||!p){msg.textContent="Enter your credentials.";return}try{const {error}=await signIn(u,p);if(error){msg.textContent=error.message;return}location.replace(getBasePath()+"manifest/")}catch(error){msg.textContent=error?.message||"Unable to sign in."}});
document.getElementById("discord").addEventListener("click",async()=>{msg.textContent="Connecting to Discord...";try{await loginWithDiscord()}catch(error){console.error("[auth.html] Discord login:",error);msg.textContent=error?.message||"Discord login failed."}});
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("login").click()});
const oauthError=new URLSearchParams(location.search).get("error_description");if(oauthError)msg.textContent="Discord login failed: "+oauthError;
</script></body></html>
