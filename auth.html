<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070806"><title>JMBN // Secure Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>

:root{--gold:#d4b65b;--bright:#f1d77b;--armor:#35372d;--dark:#272b22;--line:#2b2e26;--white:#eef0e8}
*{box-sizing:border-box}
html{background:#050706}
body{margin:0;min-height:100vh;min-height:100svh;padding:12px;display:flex;align-items:center;justify-content:center;overflow-x:hidden;background:#050706;color:var(--white);font-family:"Play",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("assets/auth-background.png") center/cover no-repeat;filter:brightness(.72) saturate(.76)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(2,4,3,.04),rgba(1,2,2,.30))}
.auth-frame{position:relative;isolation:isolate;z-index:1;flex:0 0 auto;width:min(1340px,97vw,calc((100svh - 24px)*1.3));aspect-ratio:1430/1100;transform:scale(.56);transform-origin:center center}
.auth-frame::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:url("assets/auth-panel.png?v=20261118-member-discord1") center/100% 100% no-repeat}
.auth-interior{position:absolute;z-index:1;inset:7.6% 6.1% 7.8% 7.9%;pointer-events:none;clip-path:polygon(7% 0,93% 0,100% 8%,100% 92%,93% 100%,7% 100%,0 92%,0 8%);background:linear-gradient(110deg,rgba(5,8,8,.64),rgba(5,8,8,.54) 50%,rgba(5,8,8,.61))}
.auth-layout{position:absolute;z-index:2;inset:13.5% 15.5% 12.9% 20.5%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.auth-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.auth-brand img{display:block;width:82px;height:82px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(212,182,91,.19))}
.auth-brand strong{font-size:33px;line-height:1.06;letter-spacing:.32em;padding-left:.32em;font-weight:700;color:var(--gold)}
.auth-brand-rule{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px;color:var(--gold);font-size:8px;letter-spacing:.18em}
.auth-brand-rule::before,.auth-brand-rule::after{content:"";width:58px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.auth-brand-rule::after{transform:rotate(180deg)}
.auth-main{width:100%;margin:51px 0 0}
.auth-main h1{margin:0;color:var(--white);font-size:clamp(43px,5.1vw,74px);font-weight:700;line-height:1.08;letter-spacing:.135em;padding-left:.135em;white-space:nowrap;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.auth-collective{margin:13px 0 0;color:var(--gold);font-size:clamp(13px,1.75vw,22px);line-height:1.5;letter-spacing:.38em;padding-left:.38em;white-space:nowrap}
.auth-discord{position:relative;display:block;width:min(730px,100%);height:96px;padding:0;margin:47px auto 0;border:0;outline:none;background:transparent;color:var(--bright);cursor:pointer;font:700 20px "Play",system-ui,sans-serif;letter-spacing:.065em}
.auth-discord img{position:absolute;z-index:0;display:block;width:100%;height:auto;top:50%;left:0;transform:translateY(-50%);pointer-events:none;user-select:none;transition:filter .2s}
.auth-discord span{position:absolute;z-index:1;top:50%;left:29%;right:10%;transform:translateY(-50%);white-space:nowrap;text-align:center;text-shadow:0 1px 2px #050505}
.auth-discord:hover img{filter:brightness(1.13)}
.auth-discord:focus-visible{outline:2px solid var(--bright);outline-offset:4px}
.auth-discord:disabled{cursor:progress;opacity:.75}
.auth-note{margin:43px 0 0;font-size:clamp(13px,1.5vw,18px);letter-spacing:.11em;font-style:italic;color:#c6c9c4;line-height:1.5}
.auth-status{margin:12px 0 0;min-height:18px;color:#efbcb4;font-size:12px;line-height:1.45}
@media(max-height:780px) and (min-width:721px){
.auth-frame{width:min(1200px,96vw,calc((100svh - 18px)*1.3))}
.auth-layout{inset:12.7% 15.5% 12% 20.5%}
.auth-brand img{width:60px;height:60px}.auth-brand strong{font-size:25px}.auth-brand-rule{margin-top:3px}
.auth-main{margin-top:27px}.auth-main h1{font-size:clamp(36px,4.4vw,55px)}
.auth-collective{font-size:clamp(12px,1.5vw,17px);margin-top:9px}
.auth-discord{width:min(650px,100%);height:82px;margin-top:29px;font-size:17px}
.auth-note{margin-top:26px;font-size:14px}.auth-status{margin-top:8px}
}
@media(max-width:720px){
body{padding:6px;overflow-y:auto;align-items:flex-start}
body::before{filter:brightness(.42) saturate(.65)}
.auth-frame{width:min(490px,100%);aspect-ratio:auto;min-height:680px;margin:auto;transform:none}
.auth-interior{inset:7.6% 6.1% 7.8% 7.9%;background:linear-gradient(110deg,rgba(5,8,8,.70),rgba(5,8,8,.62) 50%,rgba(5,8,8,.68))}
.auth-layout{inset:12.4% 9.2% 11.5% 17.5%}
.auth-brand img{width:62px;height:62px}.auth-brand strong{font-size:25px}.auth-brand-rule::before,.auth-brand-rule::after{width:35px}
.auth-main{margin-top:37px}.auth-main h1{white-space:normal;font-size:clamp(29px,7vw,42px);line-height:1.12;letter-spacing:.07em;padding-left:.07em}
.auth-collective{font-size:clamp(9px,2.5vw,13px);letter-spacing:.17em;padding-left:.17em;white-space:normal;margin-top:12px}
.auth-discord{width:100%;height:62px;margin-top:38px;font-size:clamp(9px,2.8vw,13px);letter-spacing:.02em}
.auth-note{margin-top:28px;font-size:12px;letter-spacing:.04em}
.auth-status{font-size:10px;margin-top:8px}
}
@media(max-width:370px){
.auth-frame{min-height:640px}.auth-layout{inset:12.2% 8.5% 11% 19.2%}
.auth-brand img{width:51px;height:51px}.auth-brand strong{font-size:23px}
.auth-main{margin-top:30px}.auth-main h1{font-size:28px}.auth-collective{font-size:9px;letter-spacing:.11em}
.auth-discord{margin-top:31px;height:55px;font-size:9px}.auth-note{font-size:11px;margin-top:23px}
}
@media(min-width:721px){.auth-brand{transform:translateY(-12px) scale(1.3);transform-origin:center center}.auth-brand img{transform:scale(1.25);transform-origin:center center}}
@media(prefers-reduced-motion:reduce){.auth-discord img{transition:none}}

</style></head><body>
<main class="auth-frame" aria-label="JMBN member access">
 <div class="auth-interior" aria-hidden="true"></div>
 <div class="auth-layout">
  <header class="auth-brand">
   <img src="assets/jmbn.png" alt="JMBN logo">
   <strong>JMBN</strong>
   <div class="auth-brand-rule" aria-hidden="true"></div>
  </header>
  <section class="auth-main" aria-labelledby="access-title">
   <h1 id="access-title">MEMBER ACCESS</h1>
   <p class="auth-collective">THE JAMBANI COLLECTIVE</p>
   <button id="discord" class="auth-discord" type="button" aria-label="Continue with Discord">
    <img src="assets/auth-discord.png?v=20261118-member-discord1" alt="" aria-hidden="true">
    <span>CONTINUE WITH DISCORD</span>
   </button>
   <p class="auth-note">Secure access for JMBN members</p>
   <div id="msg" class="auth-status" role="status" aria-live="polite"></div>
  </section>
 </div>
</main>
<script src="js/auth.js?v=jmbn-auth-20261118-manifest1"></script>
<script>
const msg=document.getElementById("msg");
(async()=>{
 try {
  const session=await getSession();
  if(session) location.replace(getBasePath()+"manifest/");
 } catch(error){console.error("[auth.html] Session check:",error)}
})();
document.getElementById("discord").addEventListener("click",async()=>{
 const btn=document.getElementById("discord");
 btn.disabled=true;
 msg.textContent="Connecting to Discord...";
 try { await loginWithDiscord(); }
 catch(error){
  console.error("[auth.html] Discord login:",error);
  msg.textContent=error?.message||"Discord login failed.";
  btn.disabled=false;
 }
});
const oauthError=new URLSearchParams(location.search).get("error_description");
if(oauthError)msg.textContent="Discord login failed: "+oauthError;
</script>
</body></html>
