<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070806"><title>JMBN // Secure Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>

:root{--gold:#d4b65b;--bright:#f1d77b;--armor:#35372d;--dark:#272b22;--line:#2b2e26;--white:#eef0e8}
*{box-sizing:border-box}
html{background:#050706}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:12px;overflow-x:hidden;background:#050706;color:var(--white);font-family:"Play",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("assets/auth-background.png") center/cover no-repeat;filter:brightness(.72) saturate(.76)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(2,4,3,.04),rgba(1,2,2,.30))}
/* The frame itself is sized to the viewport; all text and trim uses its width as a unit.
   No transform scale means browser zoom cannot detach the frame from its content. */
.auth-frame{position:relative;isolation:isolate;z-index:1;width:min(680px,76vw,calc((100svh - 24px)*1.3));aspect-ratio:1430/1100;container-type:inline-size;min-width:0}
.auth-frame::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:url("assets/auth-panel.png?v=20261118-member-discord1") center/100% 100% no-repeat}
.auth-interior{position:absolute;z-index:1;inset:7.6% 6.1% 7.8% 7.9%;pointer-events:none;clip-path:polygon(7% 0,93% 0,100% 8%,100% 92%,93% 100%,7% 100%,0 92%,0 8%);background:linear-gradient(110deg,rgba(5,8,8,.64),rgba(5,8,8,.54) 50%,rgba(5,8,8,.61))}
/* Shift the entire login stack downward together so its top and bottom frame clearances match. */
.auth-layout{position:absolute;z-index:3;inset:5% 15% -5% 15%;min-width:0;text-align:center;pointer-events:none}
.auth-brand{position:absolute;top:15.1%;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
.auth-brand img{display:block;width:9.1cqw;height:9.1cqw;object-fit:contain;filter:drop-shadow(0 0 1.6cqw rgba(212,182,91,.19))}
.auth-brand strong{display:block;color:var(--gold);font-size:3.95cqw;font-weight:700;line-height:1.06;letter-spacing:.30em;padding-left:.30em;margin-top:1.1cqw;text-align:center}
.auth-brand-rule{display:block;width:24cqw;max-width:75%;height:1px;margin-top:1cqw;background:linear-gradient(90deg,transparent 0%,rgba(212,182,91,.35) 22%,rgba(241,215,123,.78) 50%,rgba(212,182,91,.35) 78%,transparent 100%);box-shadow:0 0 .7cqw rgba(212,182,91,.15)}
.auth-main{position:absolute;top:41.3%;left:0;right:0;width:100%;margin:0;text-align:center;pointer-events:auto}
.auth-main h1{margin:0;color:var(--white);font-size:5.35cqw;font-weight:700;line-height:1.08;letter-spacing:.12em;padding-left:.12em;white-space:nowrap;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.auth-collective{margin:1.7cqw 0 0;color:var(--gold);font-size:1.69cqw;line-height:1.5;letter-spacing:.31em;padding-left:.31em;white-space:nowrap}
.auth-discord{position:relative;display:block;width:min(55cqw,100%);height:7.5cqw;min-height:0;margin:4cqw auto 0;border:0;outline:none;background:transparent;color:var(--bright);cursor:pointer;font:700 1.7cqw "Play",system-ui,sans-serif;letter-spacing:.055em}
.auth-discord img{position:absolute;z-index:0;display:block;width:100%;height:auto;top:50%;left:0;transform:translateY(-50%);pointer-events:none;user-select:none;transition:filter .2s}
.auth-discord span{position:absolute;z-index:1;top:50%;left:29%;right:10%;transform:translateY(-50%);white-space:nowrap;text-align:center;text-shadow:0 1px 2px #050505}
.auth-discord:hover img{filter:brightness(1.13)}
.auth-discord:focus-visible{outline:2px solid var(--bright);outline-offset:4px}
.auth-discord:disabled{cursor:progress;opacity:.75}
.auth-note{margin:3cqw 0 0;font-size:1.47cqw;letter-spacing:.09em;font-style:italic;color:#c6c9c4;line-height:1.5}
.auth-status{margin:.8cqw 0 0;min-height:1.5cqw;color:#efbcb4;font-size:1.4cqw;line-height:1.4}
/* The four corner markers and fading dots are independent HUD effects, not baked into PNG. */
.auth-hud{position:absolute;z-index:2;inset:13.5% 10.3% 13% 12%;pointer-events:none;overflow:hidden}
.auth-hud::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(212,182,91,.40) .09cqw,transparent .15cqw);background-size:2.9cqw 2.9cqw;background-position:.2cqw .1cqw;opacity:.30;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.43) 31%,transparent 50%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.78) 100%);mask-image:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.43) 31%,transparent 50%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.78) 100%)}
.auth-crosshair{position:absolute;width:2cqw;height:2cqw;opacity:.68;filter:drop-shadow(0 0 .25cqw rgba(212,182,91,.25))}
.auth-crosshair::before,.auth-crosshair::after{content:"";position:absolute;background:var(--gold)}
.auth-crosshair::before{height:1px;width:100%;top:50%;left:0}
.auth-crosshair::after{width:1px;height:100%;left:50%;top:0}
.auth-crosshair-tl{top:5%;left:4%}
.auth-crosshair-tr{top:5%;right:4%}
.auth-crosshair-bl{bottom:5%;left:4%}
.auth-crosshair-br{bottom:5%;right:4%}
/* Actual phone portrait mode: allow a taller touch-friendly treatment. This does not
   trigger merely because desktop browser zoom makes the CSS viewport narrower. */
@media(max-width:600px) and (orientation:portrait) and (pointer:coarse){
 body{padding:6px;overflow-y:auto}
 body::before{filter:brightness(.45) saturate(.68)}
 .auth-frame{width:min(490px,98vw);aspect-ratio:auto;height:min(680px,calc(100svh - 12px));min-height:500px}
 .auth-layout{inset:0 15% 0 15%}
 .auth-brand{top:15%}
 .auth-brand img{width:clamp(45px,12vw,65px);height:clamp(45px,12vw,65px)}
 .auth-brand strong{font-size:clamp(22px,6vw,29px);margin-top:9px}
 .auth-brand-rule{width:140px;margin-top:9px}
 .auth-main{top:42%}
 .auth-main h1{font-size:clamp(24px,6.7vw,36px);white-space:normal}
 .auth-collective{font-size:clamp(9px,2.5vw,12px);margin-top:10px;white-space:normal}
 .auth-discord{width:100%;height:54px;margin-top:28px;font-size:clamp(10px,2.8vw,13px)}
 .auth-note{font-size:11px;margin-top:24px}
 .auth-status{font-size:10px;margin-top:8px;min-height:15px}
 .auth-hud::before{opacity:.2}
}
@media(prefers-reduced-motion:reduce){.auth-discord img{transition:none}}


/* JMBN post-login Command Deck clearance sequence */
.jmbn-access-transition{--seq-gold:#e2bb61;position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;visibility:hidden;opacity:0;pointer-events:none;background:radial-gradient(ellipse 74% 60% at center,#17190f 0%,#0b0e0a 44%,#030504 100%);color:#efdeab;transition:opacity .22s ease,visibility .22s ease}
.jmbn-access-transition.is-running{visibility:visible;opacity:1;pointer-events:all}
.jmbn-access-transition:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(220,183,82,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(220,183,82,.025) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(ellipse at center,#000,transparent 88%)}
.jmbn-access-transition:after{content:"";position:absolute;inset:-100% 0;opacity:.45;background:linear-gradient(transparent 48%,rgba(245,213,115,.055) 50%,transparent 52%);animation:jmbn-scan 4s linear infinite;pointer-events:none}
.jmbn-sequence-label{position:absolute;top:clamp(18px,4vh,38px);left:clamp(18px,4vw,56px);font-size:10px;letter-spacing:.24em;color:#c5a65e}
.jmbn-sequence-id{position:absolute;top:clamp(18px,4vh,38px);right:clamp(18px,4vw,56px);font-size:10px;letter-spacing:.15em;color:#8a7c55}
.jmbn-sequence-wheel{position:relative;width:min(82vw,70svh,460px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 0 18px rgba(212,173,72,.13))}
.jmbn-sequence-wheel:before{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(228,190,98,.28);box-shadow:0 0 26px rgba(220,172,63,.11),inset 0 0 28px rgba(227,171,58,.08)}
.jmbn-sequence-orbit{position:absolute;border-radius:50%;pointer-events:none}
.jmbn-sequence-orbit.outer{inset:3%;border:3px solid transparent;border-top-color:#efc15e;border-bottom-color:rgba(211,159,56,.37);border-left-color:rgba(213,171,66,.12);box-shadow:0 -4px 18px -12px #ffe49c;animation:jmbn-orbit 4s linear infinite}
.jmbn-sequence-orbit.mid{inset:9%;border:1px dashed rgba(224,182,74,.46);animation:jmbn-orbit 12s linear infinite reverse}
.jmbn-sequence-orbit.inner{inset:15%;border:2px solid transparent;border-right-color:#edcd79;border-left-color:rgba(196,144,54,.40);box-shadow:inset 0 0 12px rgba(222,165,57,.07);animation:jmbn-orbit 5.5s linear infinite reverse}
.jmbn-sequence-wheel .jmbn-axis{position:absolute;inset:0;opacity:.72;background:linear-gradient(#c79b44,#c79b44) center top/1px 17px no-repeat,linear-gradient(#c79b44,#c79b44) center bottom/1px 17px no-repeat,linear-gradient(90deg,#c79b44,#c79b44) left center/17px 1px no-repeat,linear-gradient(90deg,#c79b44,#c79b44) right center/17px 1px no-repeat}
.jmbn-sequence-core{position:relative;z-index:1;width:80%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(7px,1.3vh,13px)}
.jmbn-sequence-logo{width:clamp(49px,12vw,75px);height:clamp(49px,12vw,75px);object-fit:contain;filter:drop-shadow(0 0 14px rgba(238,194,89,.30))}
.jmbn-sequence-brand{font-size:clamp(15px,3vw,23px);font-weight:700;letter-spacing:.2em;padding-left:.2em;color:#e9c56d;line-height:1}
.jmbn-sequence-step{font-size:clamp(8px,1.7vw,11px);letter-spacing:.23em;text-transform:uppercase;color:#bcaa79;margin-top:2px}
.jmbn-sequence-title{font-size:clamp(16px,3.5vw,26px);font-weight:700;letter-spacing:.075em;color:#f2d484;text-shadow:0 0 17px rgba(225,179,65,.27);line-height:1.15}
.jmbn-sequence-description{font-size:clamp(10px,1.7vw,12px);color:#d2c7ad;line-height:1.35}
.jmbn-sequence-track{height:13px;width:85%;border:1px solid rgba(230,193,91,.72);border-radius:99px;padding:2px;background:#080b08;box-shadow:0 0 12px rgba(217,177,69,.18);overflow:hidden;margin-top:6px}
.jmbn-sequence-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#a77730,#e9bf60 58%,#fff2b1);box-shadow:0 0 12px #cba650,0 0 6px #ffe28e;position:relative}
.jmbn-access-transition.is-running .jmbn-sequence-fill{animation:jmbn-fill 2.25s linear forwards}
.jmbn-sequence-detail{font-size:clamp(8px,1.4vw,10px);letter-spacing:.12em;color:#bc9d58;text-transform:uppercase;line-height:1.5}
.jmbn-access-transition[data-phase="2"] .jmbn-sequence-wheel,.jmbn-access-transition[data-phase="3"] .jmbn-sequence-wheel{filter:drop-shadow(0 0 24px rgba(226,174,66,.25))}
.jmbn-access-transition[data-phase="3"] .jmbn-sequence-orbit.outer{border-top-color:#ffe8a1;border-right-color:#ddb359}
.jmbn-sequence-footer{position:absolute;bottom:clamp(24px,5vh,55px);left:0;right:0;text-align:center;letter-spacing:.22em;font-size:9px;color:#937f52}
@keyframes jmbn-orbit{to{transform:rotate(360deg)}}
@keyframes jmbn-fill{to{width:100%}}
@keyframes jmbn-scan{to{transform:translateY(50%)}}
@media(max-width:520px){.jmbn-sequence-wheel{width:min(94vw,65svh,380px)}.jmbn-sequence-core{gap:7px}.jmbn-sequence-track{height:11px}.jmbn-sequence-logo{width:52px;height:52px}.jmbn-sequence-title{font-size:clamp(15px,4.5vw,23px)}}
@media(prefers-reduced-motion:reduce){.jmbn-sequence-orbit,.jmbn-access-transition:after,.jmbn-access-transition.is-running .jmbn-sequence-fill{animation:none!important}.jmbn-access-transition.is-running .jmbn-sequence-fill{width:100%}}

</style></head><body>
<main class="auth-frame" aria-label="JMBN member access">
 <div class="auth-interior" aria-hidden="true"></div>
 <div class="auth-hud" aria-hidden="true">
  <span class="auth-crosshair auth-crosshair-tl"></span>
  <span class="auth-crosshair auth-crosshair-tr"></span>

<!-- Animated Command Deck clearance: shown only after successful member login. -->
<div class="jmbn-access-transition" id="jmbnAccessTransition" aria-hidden="true" data-phase="0">
 <div class="jmbn-sequence-label">JMBN // SECURE CONNECTION</div>
 <div class="jmbn-sequence-id">PERSONNEL ACCESS // 01</div>
 <div class="jmbn-sequence-wheel">
  <div class="jmbn-sequence-orbit outer" aria-hidden="true"></div>
  <div class="jmbn-sequence-orbit mid" aria-hidden="true"></div>
  <div class="jmbn-sequence-orbit inner" aria-hidden="true"></div>
  <div class="jmbn-axis" aria-hidden="true"></div>
  <div class="jmbn-sequence-core" role="status" aria-live="polite">
   <img class="jmbn-sequence-logo" src="assets/jmbn.png" alt="">
   <div class="jmbn-sequence-brand">JMBN</div>
   <div class="jmbn-sequence-step" id="jmbnSeqStep">01 // AUTHENTICATION</div>
   <div class="jmbn-sequence-title" id="jmbnSeqTitle">IDENTITY VERIFIED</div>
   <div class="jmbn-sequence-description" id="jmbnSeqDesc">Secure credentials confirmed.</div>
   <div class="jmbn-sequence-track" role="progressbar" aria-label="Opening JMBN Command Deck" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="jmbnSeqProgress"><div class="jmbn-sequence-fill"></div></div>
   <div class="jmbn-sequence-detail" id="jmbnSeqDetail">PERSONNEL AUTHENTICATION COMPLETE</div>
  </div>
 </div>
 <div class="jmbn-sequence-footer">THE JAMBANI COLLECTIVE // COMMAND SYSTEM</div>
</div>
<script>
(function(){
 let started=false;
 window.startJmbnAuthTransition=function(navigate){
  if(started)return;
  started=true;
  const panel=document.getElementById('jmbnAccessTransition');
  if(!panel){navigate();return;}
  panel.classList.add('is-running');
  panel.setAttribute('aria-hidden','false');
  const title=document.getElementById('jmbnSeqTitle');
  const step=document.getElementById('jmbnSeqStep');
  const desc=document.getElementById('jmbnSeqDesc');
  const detail=document.getElementById('jmbnSeqDetail');
  const progress=document.getElementById('jmbnSeqProgress');
  const phases=[
   {at:0,step:'01 // AUTHENTICATION',title:'IDENTITY VERIFIED',desc:'Secure credentials confirmed.',detail:'PERSONNEL AUTHENTICATION COMPLETE',pct:0},
   {at:600,step:'02 // CLEARANCE',title:'ACCESS GRANTED',desc:'Command clearance authorized.',detail:'ESTABLISHING SECURE CONNECTION',pct:27},
   {at:1150,step:'03 // INITIALIZATION',title:'JMBN // COMMAND DECK',desc:'Initializing personnel interface.',detail:'LOADING OPERATIONS · FLEET · MANIFEST',pct:51},
   {at:1800,step:'04 // READY',title:'WELCOME ABOARD',desc:'Command Deck online.',detail:'ALL SYSTEMS OPERATIONAL',pct:80}
  ];
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(i){
   const p=phases[i];panel.dataset.phase=String(i);
   step.textContent=p.step;title.textContent=p.title;desc.textContent=p.desc;detail.textContent=p.detail;
   progress.setAttribute('aria-valuenow',String(p.pct));
  }
  show(0);
  if(reduced){show(3);progress.setAttribute('aria-valuenow','100');setTimeout(navigate,220);return;}
  for(let i=1;i<phases.length;i++)setTimeout(()=>show(i),phases[i].at);
  setTimeout(()=>{progress.setAttribute('aria-valuenow','100');navigate();},2350);
 };
})();
</script>

<script src="js/auth.js?v=jmbn-auth-20261121-clearance1"></script>
<script>
const msg=document.getElementById("msg");
document.getElementById("discord").addEventListener("click",async()=>{
 const btn=document.getElementById("discord");
 btn.disabled=true;
 msg.textContent="Connecting to Discord...";
 try { await loginWithDiscord(); }
 catch(error){
  console.error("[auth.html] Discord login:",error);
  msg.textContent=error?.message||"Discord login failed.";
  btn.disabled=false;
 }
});
const oauthError=new URLSearchParams(location.search).get("error_description");
if(oauthError)msg.textContent="Discord login failed: "+oauthError;
</script>
