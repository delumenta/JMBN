<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070806"><title>JMBN // Secure Access</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><style>

:root{--auth-bg:#050707;--auth-armor:#35372d;--auth-line:#2b2e26;--auth-metal:#272b22;--auth-gold:#d4b65b;--auth-bright:#f1d77b;--auth-text:#f0efe8}
*{box-sizing:border-box}
html{background:var(--auth-bg)}
body{margin:0;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;padding:10px;background:#050707;color:var(--auth-text);font-family:"Play",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url("assets/auth-background.png") center / cover no-repeat;filter:brightness(.62) saturate(.7)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(4,7,7,.02) 15%,rgba(2,3,3,.34) 100%)}

.auth-layout{position:absolute;z-index:2;inset:9.5% 18% 10.9% 23%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.auth-brand{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;gap:2px;text-align:center}
.auth-brand img{display:block;width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(212,182,91,.22))}

.auth-description{margin:16px auto 20px;max-width:430px;color:#c5c7c0;font-size:14px;line-height:1.55}
.auth-fields{display:grid;gap:13px;text-align:left}
.auth-field{min-width:0}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.auth-fieldbox{height:56px;display:flex;align-items:center;min-width:0;border:1px solid var(--auth-gold);background:rgba(5,9,7,.88);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);transition:border-color .15s,background .15s}
.auth-fieldbox:focus-within{border-color:var(--auth-bright);background:rgba(11,16,12,.94)}
.auth-field-icon{height:78%;width:73px;flex:none;border-right:1px solid rgba(212,182,91,.54);display:flex;align-items:center;justify-content:center;color:var(--auth-gold)}
.auth-field-icon svg,.auth-eye svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.auth-fieldbox input{min-width:0;flex:1;width:100%;height:100%;padding:0 17px;color:var(--auth-text);border:0;outline:0;background:transparent;font:14px "Play",system-ui,sans-serif}
.auth-fieldbox input::placeholder{color:#aeb0a7}

.auth-eye:focus-visible{outline:2px solid var(--auth-bright);outline-offset:-5px}
.auth-eye svg{width:22px;height:22px}
.auth-actions{margin-top:20px}
.auth-actions button{width:100%;height:58px;font:700 15px "Play",system-ui,sans-serif;letter-spacing:.10em;cursor:pointer;transition:filter .15s,background .15s}
.auth-actions button:focus-visible{outline:2px solid var(--auth-bright);outline-offset:3px}
.auth-primary{display:flex;gap:15px;align-items:center;justify-content:center;position:relative;overflow:hidden;border:1px solid var(--auth-bright);color:#090b08;background:linear-gradient(135deg,#f7de88,var(--auth-bright) 45%,var(--auth-gold));clip-path:polygon(11px 0,100% 0,calc(100% - 35px) 100%,0 100%,0 11px)}
.auth-primary::after{content:"";position:absolute;right:2%;top:0;width:60px;height:100%;background:repeating-linear-gradient(118deg,transparent 0 10px,rgba(11,14,8,.93) 10px 15px,transparent 15px 20px);clip-path:polygon(25% 0,100% 0,75% 100%,0 100%)}
.auth-primary:hover{filter:brightness(1.08)}
.auth-primary .auth-chevron{font-size:31px;line-height:.6;letter-spacing:-.14em;margin-right:6px}
.auth-divider{display:flex;align-items:center;justify-content:center;gap:17px;margin:15px auto 13px;color:#d3d4cc;font-size:11px;letter-spacing:.10em}
.auth-divider::before,.auth-divider::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,rgba(232,234,222,.8))}
.auth-divider::after{transform:rotate(180deg)}
.auth-discord{display:flex;align-items:center;justify-content:center;gap:13px;color:#f0eee5;background:rgba(10,13,10,.83);border:1px solid var(--auth-gold);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.auth-discord:hover{background:rgba(39,43,34,.84)}
.auth-discord svg{width:27px;height:27px;fill:var(--auth-gold)}
.auth-message{margin:8px 0 0;min-height:16px;color:#f9a69e;font-size:11px;line-height:1.4}
.auth-footer{display:flex;align-items:center;justify-content:center;gap:17px;flex:none;margin-top:16px;color:#e0e1db;font-size:11px;letter-spacing:.14em;text-align:center}
.auth-footer::before,.auth-footer::after{content:"";height:1px;width:80px;background:linear-gradient(90deg,transparent,rgba(231,231,222,.67))}
.auth-footer::after{transform:rotate(180deg)}
.auth-footer svg{width:18px;height:18px;stroke:var(--auth-gold);stroke-width:1.5;fill:none;vertical-align:middle;margin-right:8px}
@media(max-height:830px) and (min-width:721px){
.auth-frame{width:min(1200px,97vw,calc((100svh - 14px)*1.3))}
.auth-layout{inset:9% 18% 10% 23%}
.auth-brand img{width:46px;height:46px}.auth-brand strong{font-size:31px}.auth-brand-subtitle{font-size:9px;gap:12px}.auth-brand-subtitle::before,.auth-brand-subtitle::after{width:38px}
.auth-login{margin-top:17px;width:min(100%,470px)}.auth-kicker{font-size:10px;margin-bottom:7px}h1{font-size:36px}
.auth-description{margin:10px auto 13px;font-size:11px}
.auth-fields{gap:9px}.auth-fieldbox{height:43px}.auth-field-icon{width:55px}.auth-field-icon svg{width:22px;height:22px}.auth-fieldbox input{font-size:12px}
.auth-actions{margin-top:12px}.auth-actions button{height:43px;font-size:12px}.auth-primary .auth-chevron{font-size:24px}.auth-divider{margin:10px auto 8px}.auth-discord svg{width:20px;height:20px}
.auth-message{margin:4px 0 0;min-height:12px}.auth-footer{margin-top:9px;font-size:9px}
}
@media(max-width:720px){
body{padding:6px;overflow-y:auto;align-items:flex-start}
.auth-frame{aspect-ratio:auto;width:min(480px,100%);min-height:770px;margin:auto 0}
.auth-void{inset:8% 6.5% 7% 11.2%}
.auth-layout{inset:10% 12.5% 10% 20%;justify-content:center}
.auth-brand img{width:50px;height:50px}.auth-brand strong{font-size:30px}.auth-brand-subtitle{font-size:8px;gap:7px;letter-spacing:.17em;padding-left:.17em}.auth-brand-subtitle::before,.auth-brand-subtitle::after{width:23px}
.auth-login{width:100%;margin-top:22px}.auth-kicker{font-size:9px;margin-bottom:8px;letter-spacing:.07em}
h1{font-size:clamp(25px,7.4vw,36px)}.auth-description{font-size:11px;line-height:1.5;margin:11px auto 17px}
.auth-fields{gap:12px}.auth-fieldbox{height:46px}.auth-field-icon{width:45px}.auth-field-icon svg{width:19px;height:19px}.auth-fieldbox input{font-size:11px;padding:0 9px}.auth-eye{width:30px;padding:4px}.auth-eye svg{width:17px;height:17px}
.auth-actions{margin-top:16px}.auth-actions button{height:47px;font-size:11px;letter-spacing:.05em}.auth-primary::after{width:31px}.auth-primary .auth-chevron{font-size:21px}.auth-divider{margin:12px auto 11px}
.auth-discord{gap:8px}.auth-discord svg{width:20px;height:20px}
.auth-footer{font-size:8px;gap:8px;letter-spacing:.04em;margin-top:11px}.auth-footer::before,.auth-footer::after{width:20px}.auth-footer svg{width:15px;height:15px;margin-right:5px}
}
@media(max-width:380px){
.auth-frame{min-height:745px}.auth-layout{inset:10% 12% 10% 21%}
.auth-brand img{width:44px;height:44px}.auth-brand strong{font-size:26px}.auth-brand-subtitle{font-size:7px}.auth-brand-subtitle::before,.auth-brand-subtitle::after{width:16px}
.auth-login{margin-top:17px}h1{font-size:25px}.auth-description{font-size:10px;margin-bottom:12px}.auth-fieldbox{height:43px}
.auth-actions{margin-top:12px}.auth-actions button{height:44px}.auth-footer{font-size:7px}
}
@media(prefers-reduced-motion:reduce){.auth-fieldbox,.auth-actions button{transition:none}}

</style></head><body>
<main class="auth-frame" aria-label="JMBN secure personnel login">
 <div class="auth-void" aria-hidden="true"></div>
 <div class="auth-layout">
  <header class="auth-brand">
   <img src="assets/jmbn.png" alt="JMBN insignia">
   <strong>JMBN</strong>
   <div class="auth-brand-subtitle">MANIFEST SYSTEM</div>
  </header>
  <section class="auth-login" aria-label="Secure personnel access">
   <p class="auth-kicker">/// SECURE PERSONNEL ACCESS</p>
   <h1>REPORT TO<br>YOUR STATION.</h1>
   <p class="auth-description">Authenticate to access the crew manifest,<br>operations board and Academy records.</p>
   <div class="auth-fields">
    <div class="auth-field">
     <label class="sr-only" for="u">Username</label>
     <div class="auth-fieldbox">
      <span class="auth-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.5"></circle><path d="M4.5 20v-2.2c0-3.2 2.7-5.2 7.5-5.2s7.5 2 7.5 5.2V20"></path></svg></span>
      <input id="u" autocomplete="username" placeholder="Enter your callsign" aria-label="Username or callsign">
     </div>
    </div>
    <div class="auth-field">
     <label class="sr-only" for="p">Password</label>
     <div class="auth-fieldbox">
      <span class="auth-field-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5.5" y="10" width="13" height="11" rx="1"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14.5v3"></path></svg></span>
      <input id="p" type="password" autocomplete="current-password" placeholder="Enter your password" aria-label="Password">
      <button id="togglePassword" type="button" class="auth-eye" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle><path d="M3 21 21 3"></path></svg></button>
     </div>
    </div>
   </div>
   <div class="auth-actions">
    <button id="login" type="button" class="auth-primary"><span class="auth-chevron" aria-hidden="true">»</span> AUTHENTICATE</button>
    <div class="auth-divider">OR</div>
    <button id="discord" type="button" class="auth-discord"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.75 5.5a18.9 18.9 0 0 0-4.65-1.43l-.55 1.1a17.5 17.5 0 0 0-5.1 0l-.55-1.1A18.9 18.9 0 0 0 4.25 5.5C1.3 9.8.5 14 .88 18.1a18.5 18.5 0 0 0 5.7 2.85l1.2-1.95c-.65-.23-1.28-.5-1.86-.83.16.12.33.22.5.32a14.6 14.6 0 0 0 11.16 0l.5-.32c-.58.33-1.2.6-1.86.83l1.2 1.95a18.5 18.5 0 0 0 5.7-2.85c.45-4.64-.78-8.78-3.37-12.6ZM8.5 15.45c-1.1 0-2-.98-2-2.17s.88-2.17 2-2.17 2.02.98 2 2.17c0 1.19-.88 2.17-2 2.17Zm7 0c-1.1 0-2-.98-2-2.17s.88-2.17 2-2.17 2.02.98 2 2.17c0 1.19-.88 2.17-2 2.17Z"></path></svg> CONTINUE WITH DISCORD</button>
   </div>
   <div id="msg" class="auth-message" role="status" aria-live="polite"></div>
  </section>
  <footer class="auth-footer"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 3v6c0 5.2-3.2 8.3-8 11-4.8-2.7-8-5.8-8-11V5l8-3Z"></path><path d="M12 7v9m-4-5h8"></path></svg>AUTHORIZED PERSONNEL ONLY</span></footer>
 </div>
</main>
<script src="js/auth.js?v=jmbn-auth-20261118-manifest1"></script><script>
const msg=document.getElementById("msg");
(async()=>{try{const session=await getSession();if(session)location.replace(getBasePath()+"manifest/")}catch(error){console.error("[auth.html] Session check:",error)}})();
document.getElementById("login").addEventListener("click",async()=>{const u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;msg.textContent="";if(!u||!p){msg.textContent="Enter your credentials.";return}try{const {error}=await signIn(u,p);if(error){msg.textContent=error.message;return}location.replace(getBasePath()+"manifest/")}catch(error){msg.textContent=error?.message||"Unable to sign in."}});
document.getElementById("discord").addEventListener("click",async()=>{msg.textContent="Connecting to Discord...";try{await loginWithDiscord()}catch(error){console.error("[auth.html] Discord login:",error);msg.textContent=error?.message||"Discord login failed."}});
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("login").click()});
document.getElementById("togglePassword").addEventListener("click",()=>{const el=document.getElementById("p");const reveal=el.type==="password";el.type=reveal?"text":"password";const btn=document.getElementById("togglePassword");btn.setAttribute("aria-label",reveal?"Hide password":"Show password");btn.setAttribute("aria-pressed",String(reveal));});
const oauthError=new URLSearchParams(location.search).get("error_description");if(oauthError)msg.textContent="Discord login failed: "+oauthError;
</script></body></html>
