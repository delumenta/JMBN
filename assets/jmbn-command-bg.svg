<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0a"/>
      <stop offset=".5" stop-color="#060705"/>
      <stop offset="1" stop-color="#040504"/>
    </linearGradient>
    <radialGradient id="softGold" cx="50%" cy="-10%" r="90%">
      <stop offset="0" stop-color="#d9b53e" stop-opacity=".030"/>
      <stop offset=".42" stop-color="#d9b53e" stop-opacity=".008"/>
      <stop offset="1" stop-color="#d9b53e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="18" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".028 .11" numOctaves="3" seed="9"/>
      <feColorMatrix values="0.35 0 0 0 0
                             0 0.35 0 0 0
                             0 0 0.35 0 0
                             0 0 0 .17 0"/>
    </filter>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#fff" stroke-opacity=".012" stroke-width=".6"/>
    </pattern>
    <style>
      .g{fill:none;stroke:#d9b53e;stroke-linejoin:miter;stroke-linecap:square}
      .major{stroke-opacity:.48;stroke-width:1.35}
      .minor{stroke-opacity:.25;stroke-width:.85}
      .micro{stroke-opacity:.13;stroke-width:.65}
      .tick{fill:#d9b53e;fill-opacity:.56}
      .cross{stroke:#d9b53e;stroke-opacity:.43;stroke-width:1}
      .txt{fill:#d9b53e;font-family:monospace;letter-spacing:3px}
      .t1{font-size:14px;font-weight:700;fill-opacity:.72}
      .t2{font-size:10px;font-weight:700;fill-opacity:.56}
      .t3{font-size:9px;fill-opacity:.44}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#softGold)"/>
  <rect width="1920" height="1080" fill="url(#micro)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".62"/>
  <rect width="1920" height="1080" filter="url(#rough)" opacity=".38"/>

  <!-- faint uneven surface washes -->
  <path d="M190 0C460 130 560 22 820 156S1338 118 1740 4V1080H0V80C58 42 105 22 190 0Z"
        fill="#fff" opacity=".012"/>
  <path d="M0 760C280 650 450 850 750 734S1240 660 1920 810V1080H0Z"
        fill="#000" opacity=".34"/>

  <!-- upper-left organization block -->
  <g>
    <path class="g major" d="M22 0V190L48 216V402L24 426V636"/>
    <path class="g minor" d="M48 40V160L74 186V264"/>
    <path class="g micro" d="M88 118H566L598 86H856"/>
    <path class="g major" d="M186 112H566L594 86H860"/>
    <rect class="tick" x="183" y="107" width="8" height="8"/>
    <rect class="tick" x="854" y="82" width="8" height="8"/>
    <path class="cross" d="M244 228h16m-8-8v16"/>
    <path class="cross" d="M460 128h10m-5-5v10"/>
    <text class="txt t2" x="78" y="139">INTEGRITY</text>
    <text class="txt t2" x="78" y="159">DISCIPLINE</text>
    <text class="txt t2" x="78" y="179">RESULTS</text>
    <text class="txt t2" x="76" y="332">SECTOR 07</text>
    <text class="txt t3" x="76" y="355">LINK: STABLE</text>
    <text class="txt t3" x="76" y="375">LAT: 1.3521</text>
    <text class="txt t3" x="76" y="395">LON: 103.8198</text>
  </g>

  <!-- left middle / lower routing -->
  <g>
    <path class="g major" d="M0 626H236L284 676V858L206 932H0"/>
    <path class="g minor" d="M0 642H202L252 692V834L192 894H0"/>
    <path class="g minor" d="M204 760V1010H322L370 1058"/>
    <path class="g micro" d="M204 888H490L548 946H864L956 854"/>
    <rect class="tick" x="278" y="670" width="9" height="9"/>
    <rect class="tick" x="308" y="1005" width="8" height="8"/>
    <path class="cross" d="M96 914h18m-9-9v18"/>
    <path class="cross" d="M238 894h14m-7-7v14"/>
    <text class="txt t2" x="74" y="686">JMBN-01</text>
    <text class="txt t3" x="74" y="709">NODE</text>
    <text class="txt t3" x="74" y="729">SYNC</text>
    <text class="txt t3" x="74" y="749">ONLINE</text>
    <text class="txt t3" x="70" y="1018">// SYSTEMS CHECK</text>
    <text class="txt t3" x="70" y="1040">// ALL GREEN</text>
    <text class="txt t3" x="70" y="1062">// FOR A GREATER TOMORROW</text>
  </g>

  <!-- top center -->
  <g>
    <path class="g major" d="M860 0L910 54H1154V0"/>
    <path class="g minor" d="M1126 0V82H1358L1402 38H1658L1698 0"/>
    <path class="g micro" d="M1188 94H1368"/>
    <path class="g micro" d="M1200 82v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18"/>
    <path class="cross" d="M1366 186h28m-14-14v28"/>
    <text class="txt t2" x="1178" y="50">NAV // 02</text>
    <text class="txt t2" x="1778" y="52">NODE 04</text>
    <text class="txt t3" x="1778" y="88">COMMS</text>
    <text class="txt t3" x="1778" y="108">DATA</text>
    <text class="txt t3" x="1778" y="128">SYS</text>
    <text class="txt t3" x="1778" y="148">UI</text>
  </g>

  <!-- right routing -->
  <g>
    <path class="g major" d="M1920 0V206L1870 254V500L1832 538V708L1764 776H1490L1422 842H1138L1084 900"/>
    <path class="g minor" d="M1910 190H1846V476H1920"/>
    <path class="g micro" d="M1780 500H1920"/>
    <rect class="tick" x="1830" y="532" width="9" height="9"/>
    <rect class="tick" x="1486" y="772" width="9" height="9"/>
    <path class="cross" d="M1404 466h16m-8-8v16"/>
    <path class="cross" d="M1450 846h14m-7-7v14"/>
    <text class="txt t2" x="1766" y="568">JMBN-01</text>
    <text class="txt t3" x="1766" y="591">X:74 Y:18 Z:0</text>
    <text class="txt t2" x="1754" y="824">SECTOR P-03</text>
    <text class="txt t3" x="1754" y="846">SYNC // 97.4</text>
    <text class="txt t3" x="1754" y="866">UPTIME // 99.9%</text>
    <text class="txt t3" x="1754" y="886">LINK // STABLE</text>
  </g>

  <!-- lower perimeter -->
  <g>
    <path class="g major" d="M550 1080L518 1040H870L960 936H1060L1116 992H1410L1470 930H1880"/>
    <path class="g minor" d="M590 1080L554 1030H860"/>
    <path class="g micro" d="M1120 1008H1450"/>
    <rect class="tick" x="1111" y="987" width="8" height="8"/>
    <rect class="tick" x="1428" y="987" width="8" height="8"/>
    <text class="txt t2" x="1596" y="1040">FOR A GREATER TOMORROW —</text>
  </g>

  <!-- edge brackets / hatch accents -->
  <g opacity=".52">
    <path class="g minor" d="M0 236h54v18H0M0 448h72"/>
    <path class="g minor" d="M1920 252h-32v220h32"/>
    <path class="g minor" d="M1590 770l-52 58h54l52-58"/>
    <path class="g micro" d="M1544 824l66-74m-52 82l66-74m-52 82l66-74m-52 82l66-74"/>
  </g>
</svg>