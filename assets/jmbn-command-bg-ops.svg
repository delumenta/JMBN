<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0a"/>
      <stop offset=".5" stop-color="#060705"/>
      <stop offset="1" stop-color="#040504"/>
    </linearGradient>
    <radialGradient id="softGold" cx="50%" cy="-10%" r="90%">
      <stop offset="0" stop-color="#d9b53e" stop-opacity=".030"/>
      <stop offset=".42" stop-color="#d9b53e" stop-opacity=".008"/>
      <stop offset="1" stop-color="#d9b53e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="18" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".028 .11" numOctaves="3" seed="9"/>
      <feColorMatrix values="0.35 0 0 0 0
                             0 0.35 0 0 0
                             0 0 0.35 0 0
                             0 0 0 .17 0"/>
    </filter>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#fff" stroke-opacity=".012" stroke-width=".6"/>
    </pattern>
    <style>
      .g{fill:none;stroke:#9a8031;stroke-linejoin:miter;stroke-linecap:square}
      .major{stroke-opacity:.38;stroke-width:1.25}
      .minor{stroke-opacity:.22;stroke-width:.82}
      .micro{stroke-opacity:.11;stroke-width:.62}
      .tick{fill:#9a8031;fill-opacity:.42}
      .cross{stroke:#9a8031;stroke-opacity:.32;stroke-width:1}
      .txt{fill:#a48835;font-family:monospace;letter-spacing:3px}
      .t1{font-size:14px;font-weight:700;fill-opacity:.46}
      .t2{font-size:10px;font-weight:700;fill-opacity:.40}
      .t3{font-size:9px;fill-opacity:.30}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#softGold)"/>
  <rect width="1920" height="1080" fill="url(#micro)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".62"/>
  <rect width="1920" height="1080" filter="url(#rough)" opacity=".38"/>

  <!-- faint uneven surface washes -->
  <path d="M190 0C460 130 560 22 820 156S1338 118 1740 4V1080H0V80C58 42 105 22 190 0Z"
        fill="#fff" opacity=".012"/>
  <path d="M0 760C280 650 450 850 750 734S1240 660 1920 810V1080H0Z"
        fill="#000" opacity=".34"/>

  <!-- upper-left organization block -->
  <g>
    <path class="g major" d="M0 72H132L190 130V286L254 350V506L194 566H0"/>
    <path class="g minor" d="M0 114H98L154 170V276L200 322"/>
    <path class="g micro" d="M286 58H640L694 112H978L1040 50H1278"/>
    <path class="g major" d="M338 96H604L664 154H946L1008 90H1188"/>
    <rect class="tick" x="183" y="107" width="8" height="8"/>
    <rect class="tick" x="854" y="82" width="8" height="8"/>
    <path class="cross" d="M244 228h16m-8-8v16"/>
    <path class="cross" d="M460 128h10m-5-5v10"/>
    <text class="txt t2" x="84" y="186">OPS</text>
    <text class="txt t2" x="84" y="206">MISSION</text>
    <text class="txt t2" x="84" y="226">NETWORK</text>
    <text class="txt t2" x="82" y="410">SECTOR O-07</text>
    <text class="txt t3" x="82" y="433">LINK: DEPLOYED</text>
    <text class="txt t3" x="82" y="453">ROUTE: ACTIVE</text>
    <text class="txt t3" x="82" y="473">SYNC: 98.9</text>
  </g>

  <!-- left middle / lower routing -->
  <g>
    <path class="g major" d="M0 704H210L270 644H420L486 710V880L556 950H786"/>
    <path class="g minor" d="M0 742H174L232 684H396L450 738V862L504 916"/>
    <path class="g minor" d="M116 834V1040H348L398 990H626"/>
    <path class="g micro" d="M500 1008H772L838 942H1092L1160 874H1344"/>
    <rect class="tick" x="278" y="670" width="9" height="9"/>
    <rect class="tick" x="308" y="1005" width="8" height="8"/>
    <path class="cross" d="M96 914h18m-9-9v18"/>
    <path class="cross" d="M238 894h14m-7-7v14"/>
    <text class="txt t2" x="286" y="684">OPS-NODE</text>
    <text class="txt t3" x="286" y="707">DEPLOY</text>
    <text class="txt t3" x="286" y="727">SYNC</text>
    <text class="txt t3" x="286" y="747">ONLINE</text>
    <text class="txt t3" x="70" y="1018">// SYSTEMS CHECK</text>
    <text class="txt t3" x="70" y="1040">// ALL GREEN</text>
    <text class="txt t3" x="70" y="1062">// FOR A GREATER TOMORROW</text>
  </g>

  <!-- top center -->
  <g>
    <path class="g major" d="M740 0V46H948L1004 102H1284L1344 42H1518V0"/>
    <path class="g minor" d="M1080 0V72H1392L1440 120H1660L1712 68H1920"/>
    <path class="g micro" d="M1166 144H1438"/>
    <path class="g micro" d="M1200 82v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18"/>
    <path class="cross" d="M1366 186h28m-14-14v28"/>
    <text class="txt t2" x="1210" y="128">NAV // OPS-07</text>
    <text class="txt t2" x="1740" y="154">NODE 07</text>
    <text class="txt t3" x="1740" y="188">COMMS</text>
    <text class="txt t3" x="1740" y="208">ROUTE</text>
    <text class="txt t3" x="1740" y="228">CREW</text>
    <text class="txt t3" x="1740" y="248">LOG</text>
  </g>

  <!-- right routing -->
  <g>
    <path class="g major" d="M1920 172H1832L1770 234V420L1828 478V642L1762 708H1600L1536 772H1320L1254 838H1082"/>
    <path class="g minor" d="M1920 224H1874V390L1810 454H1870V606H1920"/>
    <path class="g micro" d="M1694 522H1838L1886 570H1920"/>
    <rect class="tick" x="1830" y="532" width="9" height="9"/>
    <rect class="tick" x="1486" y="772" width="9" height="9"/>
    <path class="cross" d="M1404 466h16m-8-8v16"/>
    <path class="cross" d="M1450 846h14m-7-7v14"/>
    <text class="txt t2" x="1632" y="664">OPERATION DATA</text>
    <text class="txt t3" x="1632" y="687">MISSION // LIVE</text>
    <text class="txt t2" x="1514" y="806">SECTOR O-07</text>
    <text class="txt t3" x="1514" y="828">SYNC // 98.9</text>
    <text class="txt t3" x="1514" y="848">CREW // LINKED</text>
    <text class="txt t3" x="1514" y="868">ROUTE // ACTIVE</text>
  </g>

  <!-- lower perimeter -->
  <g>
    <path class="g major" d="M362 1080L430 1012H700L770 942H1014L1080 1008H1388L1460 936H1704L1770 870H1920"/>
    <path class="g minor" d="M492 1080L548 1024H826"/>
    <path class="g micro" d="M1114 1032H1362L1428 966H1598"/>
    <rect class="tick" x="1111" y="987" width="8" height="8"/>
    <rect class="tick" x="1428" y="987" width="8" height="8"/>
    <text class="txt t2" x="1500" y="1034">OPERATIONS NETWORK // ONLINE —</text>
  </g>

  <!-- edge brackets / hatch accents -->
  <g opacity=".52">
    <path class="g minor" d="M0 236h54v18H0M0 448h72"/>
    <path class="g minor" d="M1920 252h-32v220h32"/>
    <path class="g minor" d="M1590 770l-52 58h54l52-58"/>
    <path class="g micro" d="M1544 824l66-74m-52 82l66-74m-52 82l66-74m-52 82l66-74"/>
  </g>
</svg>