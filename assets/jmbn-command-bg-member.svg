<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0c0a"/>
      <stop offset=".5" stop-color="#060705"/>
      <stop offset="1" stop-color="#040504"/>
    </linearGradient>
    <radialGradient id="softGold" cx="50%" cy="-10%" r="90%">
      <stop offset="0" stop-color="#d9b53e" stop-opacity=".030"/>
      <stop offset=".42" stop-color="#d9b53e" stop-opacity=".008"/>
      <stop offset="1" stop-color="#d9b53e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="18" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .14"/>
      </feComponentTransfer>
    </filter>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".028 .11" numOctaves="3" seed="9"/>
      <feColorMatrix values="0.35 0 0 0 0
                             0 0.35 0 0 0
                             0 0 0.35 0 0
                             0 0 0 .17 0"/>
    </filter>
    <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#fff" stroke-opacity=".012" stroke-width=".6"/>
    </pattern>
    <style>
      .g{fill:none;stroke:#9a8031;stroke-linejoin:miter;stroke-linecap:square}
      .major{stroke-opacity:.38;stroke-width:1.25}
      .minor{stroke-opacity:.22;stroke-width:.82}
      .micro{stroke-opacity:.11;stroke-width:.62}
      .tick{fill:#9a8031;fill-opacity:.42}
      .cross{stroke:#9a8031;stroke-opacity:.32;stroke-width:1}
      .txt{fill:#a48835;font-family:monospace;letter-spacing:3px}
      .t1{font-size:14px;font-weight:700;fill-opacity:.46}
      .t2{font-size:10px;font-weight:700;fill-opacity:.40}
      .t3{font-size:9px;fill-opacity:.30}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#softGold)"/>
  <rect width="1920" height="1080" fill="url(#micro)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity=".62"/>
  <rect width="1920" height="1080" filter="url(#rough)" opacity=".38"/>

  <!-- faint uneven surface washes -->
  <path d="M190 0C460 130 560 22 820 156S1338 118 1740 4V1080H0V80C58 42 105 22 190 0Z"
        fill="#fff" opacity=".012"/>
  <path d="M0 760C280 650 450 850 750 734S1240 660 1920 810V1080H0Z"
        fill="#000" opacity=".34"/>

  <!-- upper-left organization block -->
  <g>
    <path class="g major" d="M0 0V148L34 182V310L76 352V540L34 582V742"/>
    <path class="g minor" d="M42 0V118L86 162V252L112 278V390"/>
    <path class="g micro" d="M110 92H430L486 148H760L822 86H1010"/>
    <path class="g major" d="M152 126H406L472 190H736L806 118H962"/>
    <rect class="tick" x="148" y="122" width="8" height="8"/>
    <rect class="tick" x="956" y="114" width="8" height="8"/>
    <path class="cross" d="M174 328h16m-8-8v16"/>
    <path class="cross" d="M706 184h10m-5-5v10"/>
    <text class="txt t2" x="92" y="188">PERSONNEL</text>
    <text class="txt t2" x="92" y="208">REGISTRY</text>
    <text class="txt t2" x="92" y="228">ACTIVE</text>
    <text class="txt t2" x="76" y="430">SECTOR M-02</text>
    <text class="txt t3" x="76" y="453">LINK: VERIFIED</text>
    <text class="txt t3" x="76" y="473">NODE: 12</text>
    <text class="txt t3" x="76" y="493">SYNC: 99.7</text>
  </g>

  <!-- left middle / lower routing -->
  <g>
    <path class="g major" d="M0 594H170L238 662V806L310 878H548L602 932H760"/>
    <path class="g minor" d="M0 626H146L210 690V824L276 890H522"/>
    <path class="g minor" d="M94 782V1028H284L336 976H520"/>
    <path class="g micro" d="M334 938H612L676 874H980L1048 942H1198"/>
    <rect class="tick" x="278" y="670" width="9" height="9"/>
    <rect class="tick" x="308" y="1005" width="8" height="8"/>
    <path class="cross" d="M96 914h18m-9-9v18"/>
    <path class="cross" d="M238 894h14m-7-7v14"/>
    <text class="txt t2" x="324" y="904">MEM-REG</text>
    <text class="txt t3" x="324" y="927">ROSTER</text>
    <text class="txt t3" x="324" y="947">SYNC</text>
    <text class="txt t3" x="324" y="967">ONLINE</text>
    <text class="txt t3" x="70" y="1018">// SYSTEMS CHECK</text>
    <text class="txt t3" x="70" y="1040">// ALL GREEN</text>
    <text class="txt t3" x="70" y="1062">// FOR A GREATER TOMORROW</text>
  </g>

  <!-- top center -->
  <g>
    <path class="g major" d="M720 0V54H940L988 102H1226L1274 54H1470V0"/>
    <path class="g minor" d="M1040 0V34H1320L1362 76H1582L1630 28H1822L1854 0"/>
    <path class="g micro" d="M1268 112H1478"/>
    <path class="g micro" d="M1200 82v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18m12-18v18"/>
    <path class="cross" d="M1366 186h28m-14-14v28"/>
    <text class="txt t2" x="1310" y="92">REG // 12</text>
    <text class="txt t2" x="1740" y="106">NODE 12</text>
    <text class="txt t3" x="1778" y="88">COMMS</text>
    <text class="txt t3" x="1778" y="108">DATA</text>
    <text class="txt t3" x="1778" y="128">SYS</text>
    <text class="txt t3" x="1778" y="148">UI</text>
  </g>

  <!-- right routing -->
  <g>
    <path class="g major" d="M1920 86H1852L1796 142V342L1744 394V620L1682 682H1520L1460 742H1260L1188 814"/>
    <path class="g minor" d="M1920 164H1818V410H1876V544H1920"/>
    <path class="g micro" d="M1724 466H1860L1900 506H1920"/>
    <rect class="tick" x="1830" y="532" width="9" height="9"/>
    <rect class="tick" x="1486" y="772" width="9" height="9"/>
    <path class="cross" d="M1404 466h16m-8-8v16"/>
    <path class="cross" d="M1450 846h14m-7-7v14"/>
    <text class="txt t2" x="1660" y="658">MEMBER DATA</text>
    <text class="txt t3" x="1660" y="681">ROSTER // ACTIVE</text>
    <text class="txt t2" x="1510" y="786">SECTOR M-02</text>
    <text class="txt t3" x="1510" y="808">SYNC // 99.7</text>
    <text class="txt t3" x="1510" y="828">INDEX // LIVE</text>
    <text class="txt t3" x="1510" y="848">LINK // VERIFIED</text>
  </g>

  <!-- lower perimeter -->
  <g>
    <path class="g major" d="M406 1080L470 1016H730L812 934H1060L1126 1000H1382L1454 928H1738L1804 862H1920"/>
    <path class="g minor" d="M520 1080L574 1026H786"/>
    <path class="g micro" d="M1000 1018H1284L1356 946H1508"/>
    <rect class="tick" x="1111" y="987" width="8" height="8"/>
    <rect class="tick" x="1428" y="987" width="8" height="8"/>
    <text class="txt t2" x="1510" y="1030">PERSONNEL NETWORK // ONLINE —</text>
  </g>

  <!-- edge brackets / hatch accents -->
  <g opacity=".52">
    <path class="g minor" d="M0 236h54v18H0M0 448h72"/>
    <path class="g minor" d="M1920 252h-32v220h32"/>
    <path class="g minor" d="M1590 770l-52 58h54l52-58"/>
    <path class="g micro" d="M1544 824l66-74m-52 82l66-74m-52 82l66-74m-52 82l66-74"/>
  </g>
</svg>