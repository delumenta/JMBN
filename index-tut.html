<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#05090c">

<title>Home Guide · Travel</title>


<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --bg:#030608;
  --surface:#0b1217;
  --surface-2:#10181e;

  --line:#2a353d;
  --line-soft:rgba(255,255,255,.065);

  --text:#f7f4ef;
  --muted:#9aa4aa;
  --muted-2:#68757e;

  --red:#ff6b68;
  --red-2:#ff8c88;
  --red-soft:rgba(255,107,104,.09);
  --red-line:rgba(255,107,104,.38);
}


*{
  box-sizing:border-box;
}


html,
body{
  margin:0;

  width:100%;
  min-height:100%;
}


body{
  min-height:100svh;

  overflow:hidden;

  background:#05090c;

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}


button{
  font:inherit;

  -webkit-tap-highlight-color:
    transparent;
}


/* =========================================================
   TUTORIAL WRAPPER
========================================================= */

.tutorial{
  position:relative;

  width:min(100%,720px);
  height:100svh;

  margin:auto;

  overflow:hidden;

  background:#05090c;
}


/* =========================================================
   SCREENSHOT
========================================================= */

.shot{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center center;

  user-select:none;
  pointer-events:none;

  transition:
    opacity .18s ease;
}


/* =========================================================
   TOP LABEL
========================================================= */

.guide-top{
  position:absolute;

  z-index:60;

  top:
    calc(
      15px +
      env(safe-area-inset-top)
    );

  left:25px;
  right:25px;

  display:flex;

  align-items:center;
  justify-content:space-between;

  pointer-events:none;
}


.guide-name,
.guide-count{
  color:#f5f1ec;

  font-size:11px;
  font-weight:900;

  letter-spacing:.13em;

  text-shadow:
    0 2px 10px
    rgba(0,0,0,.75);
}


.guide-count{
  color:#f3aaa6;
}


/* =========================================================
   SPOTLIGHT
========================================================= */

.spotlight{
  position:absolute;

  z-index:30;

  border:
    1.5px solid
    rgba(255,125,120,.98);

  border-radius:18px;

  background:
    rgba(255,107,104,.018);

  box-shadow:
    0 0 0 9999px
    rgba(2,5,8,.76),

    inset
    0 0 0 1px
    rgba(255,255,255,.025),

    0 0 0 4px
    rgba(255,107,104,.045),

    0 0 22px
    rgba(255,107,104,.22);

  pointer-events:none;

  transition:
    left .34s cubic-bezier(.2,.82,.2,1),
    top .34s cubic-bezier(.2,.82,.2,1),
    width .34s cubic-bezier(.2,.82,.2,1),
    height .34s cubic-bezier(.2,.82,.2,1),
    border-radius .22s ease;
}


/* =========================================================
   GUIDE CARD
========================================================= */

.guide-card{
  position:absolute;

  z-index:50;

  left:22px;
  right:22px;

  padding:
    20px
    24px
    20px;

  overflow:hidden;

  border:
    1px solid
    #334149;

  border-radius:29px;

  background:
    radial-gradient(
      circle at 92% 0%,
      rgba(255,107,104,.05),
      transparent 28%
    ),
    linear-gradient(
      150deg,
      rgba(16,25,31,.985),
      rgba(8,15,20,.99)
    );

  box-shadow:
    0 18px 55px
    rgba(0,0,0,.56);

  backdrop-filter:
    blur(18px)
    saturate(115%);

  -webkit-backdrop-filter:
    blur(18px)
    saturate(115%);

  transition:
    top .30s ease,
    bottom .30s ease;
}


.guide-card.bottom{
  bottom:
    calc(
      18px +
      env(safe-area-inset-bottom)
    );

  top:auto;
}


.guide-card.top{
  top:
    calc(
      68px +
      env(safe-area-inset-top)
    );

  bottom:auto;
}


.guide-card.middle{
  top:50%;

  bottom:auto;

  transform:
    translateY(-50%);
}


.guide-card::before{
  content:"";

  position:absolute;

  left:0;
  top:22px;
  bottom:22px;

  width:2px;

  border-radius:
    0
    4px
    4px
    0;

  background:
    linear-gradient(
      180deg,
      #ff7773,
      rgba(255,107,104,.34)
    );
}


/* =========================================================
   CARD COPY
========================================================= */

.card-eyebrow{
  margin-bottom:8px;

  color:#f08d88;

  font-size:10px;
  font-weight:900;

  letter-spacing:.14em;

  text-transform:uppercase;
}


.card-title{
  margin:0;

  color:#fbf7f1;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:31px;
  font-weight:700;

  line-height:1.05;

  letter-spacing:-.02em;
}


.card-text{
  margin:
    12px
    0
    18px;

  color:#a5adb2;

  font-size:12px;

  line-height:1.55;
}


.card-text strong{
  color:#f0c1bd;

  font-weight:850;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress{
  display:flex;

  align-items:center;

  gap:7px;

  min-height:6px;

  margin-bottom:20px;
}


.progress-segment{
  width:24px;
  height:5px;

  border-radius:999px;

  background:#3d4850;

  transition:
    width .18s ease,
    background .18s ease;
}


.progress-segment.active{
  width:43px;

  background:#ff706d;

  box-shadow:
    0 0 10px
    rgba(255,107,104,.17);
}


/* =========================================================
   ACTIONS
========================================================= */

.card-actions{
  display:grid;

  grid-template-columns:
    auto
    minmax(0,1fr)
    auto;

  gap:13px;

  align-items:center;
}


.skip-btn{
  min-width:45px;
  height:54px;

  padding:0;

  border:0;

  background:transparent;

  color:#87939b;

  font-size:10px;
  font-weight:900;

  letter-spacing:.06em;

  cursor:pointer;
}


.back-btn{
  min-height:54px;

  padding:
    0
    18px;

  border:
    1px solid
    #303c44;

  border-radius:999px;

  background:
    rgba(13,21,26,.74);

  color:#aeb6bb;

  font-size:10px;
  font-weight:900;

  cursor:pointer;
}


.back-btn:disabled{
  opacity:.28;

  cursor:default;
}


.next-btn{
  min-width:85px;
  min-height:54px;

  padding:
    0
    18px;

  border:
    1px solid
    rgba(255,107,104,.47);

  border-radius:999px;

  background:
    rgba(255,107,104,.075);

  color:#ffc0bc;

  font-size:10px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    inset
    0 0 18px
    rgba(255,107,104,.025);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  .guide-top{
    left:25px;
    right:25px;
  }


  .guide-name,
  .guide-count{
    font-size:10px;
  }


  .guide-card{
    left:22px;
    right:22px;

    padding:
      19px
      24px
      19px;

    border-radius:28px;
  }


  .card-title{
    font-size:29px;
  }


  .card-text{
    margin-top:10px;
    margin-bottom:17px;

    font-size:11px;
  }


  .progress{
    margin-bottom:18px;
  }


  .back-btn,
  .next-btn{
    min-height:52px;
  }

}


@media(max-width:370px){

  .guide-card{
    left:15px;
    right:15px;

    padding:
      17px
      18px;
  }


  .card-title{
    font-size:26px;
  }


  .card-text{
    font-size:10.5px;
  }


  .card-actions{
    gap:8px;
  }


  .next-btn{
    min-width:74px;

    padding:
      0
      13px;
  }

}

</style>


<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="application-name" content="Travel">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel">

</head>


<body>


<div class="tutorial">


  <img
    id="tutorialShot"
    class="shot"
    alt="Home page guide"
  >


  <div class="guide-top">

    <div class="guide-name">
      HOME GUIDE
    </div>

    <div
      id="guideCount"
      class="guide-count"
    >
      1 / 6
    </div>

  </div>


  <div
    id="spotlight"
    class="spotlight"
  ></div>


  <section
    id="guideCard"
    class="guide-card bottom"
    aria-live="polite"
  >


    <div
      id="cardEyebrow"
      class="card-eyebrow"
    >
      TRIPS
    </div>


    <h1
      id="cardTitle"
      class="card-title"
    >
      Manage your trips
    </h1>


    <div
      id="cardText"
      class="card-text"
    ></div>


    <div
      id="progress"
      class="progress"
    ></div>


    <div class="card-actions">


      <button
        id="skipBtn"
        class="skip-btn"
        type="button"
      >
        SKIP
      </button>


      <button
        id="backBtn"
        class="back-btn"
        type="button"
        disabled
      >
        BACK
      </button>


      <button
        id="nextBtn"
        class="next-btn"
        type="button"
      >
        NEXT
      </button>


    </div>


  </section>


</div>


<script>

/* =========================================================
   YOUR TWO HOME TUTORIAL SCREENSHOTS
========================================================= */

const HOME_IMAGE_1 =
  "https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Screenshot_20260920_214756_Chrome.jpg?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvU2NyZWVuc2hvdF8yMDI2MDkyMF8yMTQ3NTZfQ2hyb21lLmpwZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk5MTIyMjYsImV4cCI6MzMzMjU5MTIyMjZ9.USTE0vaXfkyMfZWLTTp53CUlMYyCeOICgCpLmlHIybc_cnrGTtdHNQstlnGgnIk1XA__tJhN67o6ebonYRXF7A";


const HOME_IMAGE_2 =
  "https://zngncasvdrrxyrkjqutj.supabase.co/storage/v1/object/sign/Photos/Screenshot_20260920_214802_Chrome.jpg?token=eyJraWQiOiIzOTgxNDUwNy1mM2QwLTQ5ZGItODA4My0xODg1MWZkNGYxMmEiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJQaG90b3MvU2NyZWVuc2hvdF8yMDI2MDkyMF8yMTQ4MDJfQ2hyb21lLmpwZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk5MTIzNTMsImV4cCI6MzMzMjU5MTIzNTN9.d8s5siDhsz-gomLR1t2-JhVo8TE_FYuXcvQKO_6ii-JKHHzt9f_ruY7npVDac20Qr-mM5JBgDemL5FApj_0wGA";


/* =========================================================
   HOME GUIDE — EXACTLY 6 STEPS

   1. Manage your trips
   2. Switch between days
   3. View your full schedule
   4. Food Finder
   5. Tap the pin beside a location / restaurant
   6. Tap + to open the guide menu
========================================================= */

const tutorialSteps = [

  /* =======================================================
     1 / 6 — MANAGE TRIPS
     This one was already correct.
  ======================================================= */

  {
    image:
      HOME_IMAGE_1,

    eyebrow:
      "TRIPS",

    title:
      "Manage your trips",

    text:
      `Tap <strong>MANAGE TRIP</strong> or <strong>MANAGE TRIPS</strong> to switch between your trips or manage them.`,

    box:{
      left:4.0,
      top:17.1,
      width:52.0,
      height:5.0,
      radius:18
    },

    card:
      "bottom"
  },


  /* =======================================================
     2 / 6 — DAY CARDS
     Highlight only the 18 / 19 / 20 / 21... cards.
  ======================================================= */

  {
    image:
      HOME_IMAGE_2,

    eyebrow:
      "TRIP DAYS",

    title:
      "Switch between the days",

    text:
      `Swipe through the day cards and tap <strong>18, 19, 20, 21…</strong> to preview that day’s itinerary on Home.`,

    box:{
      left:4.6,
      top:3.6,
      width:91.0,
      height:10.6,
      radius:20
    },

    card:
      "bottom"
  },


  /* =======================================================
     3 / 6 — VIEW FULL PLAN BUTTON
     Highlight the actual VIEW FULL PLAN button only.
  ======================================================= */

  {
    image:
      HOME_IMAGE_2,

    eyebrow:
      "FULL SCHEDULE",

    title:
      "View your full schedule",

    text:
      `Tap <strong>VIEW FULL PLAN</strong> whenever you want to open the complete schedule for your trip.`,

    box:{
      left:70.0,
      top:20.2,
      width:25.4,
      height:5.8,
      radius:999
    },

    card:
      "bottom"
  },


  /* =======================================================
     4 / 6 — FOOD FINDER
     Highlight the Food Finder card itself.
  ======================================================= */

  {
    image:
      HOME_IMAGE_2,

    eyebrow:
      "FOOD FINDER",

    title:
      "Find food around you",

    text:
      `Open <strong>FOOD FINDER</strong> to see your saved picks first, followed by restaurants around your current location.`,

    box:{
      left:5.1,
      top:88.7,
      width:89.8,
      height:8.4,
      radius:17
    },

    card:
      "top"
  },


  /* =======================================================
     5 / 6 — MAP PIN
     Highlight the red pin beside an itinerary location.
  ======================================================= */

  {
    image:
      HOME_IMAGE_2,

    eyebrow:
      "GOOGLE MAPS",

    title:
      "Open a place in Maps",

    text:
      `Tap the <strong>📍 pin</strong> beside a location or restaurant to open that place directly in Google Maps.`,

    box:{
      left:85.0,
      top:48.3,
      width:8.0,
      height:6.4,
      radius:999
    },

    card:
      "bottom"
  },


  /* =======================================================
     6 / 6 — FLOATING + BUTTON
     Highlight the actual + button at the bottom centre.
  ======================================================= */

  {
    image:
      HOME_IMAGE_2,

    eyebrow:
      "MORE GUIDES",

    title:
      "Open the guide menu",

    text:
      `Tap <strong>+</strong> to open the menu and choose guides for the other tabs and features.`,

    box:{
      left:43.2,
      top:91.4,
      width:13.6,
      height:7.2,
      radius:999
    },

    card:
      "top"
  }

];


/* =========================================================
   STATE
========================================================= */

let currentStep =
  0;


/* =========================================================
   ELEMENTS
========================================================= */

const tutorialShot =
  document.getElementById(
    "tutorialShot"
  );


const spotlight =
  document.getElementById(
    "spotlight"
  );


const guideCard =
  document.getElementById(
    "guideCard"
  );


const guideCount =
  document.getElementById(
    "guideCount"
  );


const cardEyebrow =
  document.getElementById(
    "cardEyebrow"
  );


const cardTitle =
  document.getElementById(
    "cardTitle"
  );


const cardText =
  document.getElementById(
    "cardText"
  );


const progress =
  document.getElementById(
    "progress"
  );


const skipBtn =
  document.getElementById(
    "skipBtn"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


const nextBtn =
  document.getElementById(
    "nextBtn"
  );


/* =========================================================
   PROGRESS
========================================================= */

function renderProgress(){

  progress.innerHTML =
    tutorialSteps
      .map(
        (_,index) => `

          <span
            class="
              progress-segment
              ${
                index === currentStep
                ?
                "active"
                :
                ""
              }
            "
          ></span>

        `
      )
      .join("");

}


/* =========================================================
   SCREENSHOT SWITCH
========================================================= */

function setScreenshot(url){

  /*
    Avoid flashing when consecutive steps
    use the same screenshot.
  */

  if(
    tutorialShot.dataset.url ===
    url
  ){

    return;

  }


  const preload =
    new Image();


  tutorialShot.style.opacity =
    "0";


  preload.onload =
    () => {

      tutorialShot.src =
        url;


      tutorialShot.dataset.url =
        url;


      requestAnimationFrame(
        () => {

          tutorialShot.style.opacity =
            "1";

        }
      );

    };


  preload.onerror =
    () => {

      tutorialShot.src =
        url;


      tutorialShot.dataset.url =
        url;


      tutorialShot.style.opacity =
        "1";

    };


  preload.src =
    url;

}


/* =========================================================
   RENDER STEP
========================================================= */

function renderStep(){

  const step =
    tutorialSteps[
      currentStep
    ];


  setScreenshot(
    step.image
  );


  guideCount.textContent =
    `${currentStep + 1} / ${tutorialSteps.length}`;


  cardEyebrow.textContent =
    step.eyebrow;


  cardTitle.textContent =
    step.title;


  cardText.innerHTML =
    step.text;


  const box =
    step.box;


  spotlight.style.left =
    box.left + "%";


  spotlight.style.top =
    box.top + "%";


  spotlight.style.width =
    box.width + "%";


  spotlight.style.height =
    box.height + "%";


  spotlight.style.borderRadius =
    (
      box.radius
      ||
      18
    )
    +
    "px";


  guideCard.classList.remove(
    "top",
    "bottom",
    "middle"
  );


  guideCard.classList.add(
    step.card
    ||
    "bottom"
  );


  backBtn.disabled =
    currentStep === 0;


  nextBtn.textContent =
    currentStep ===
    tutorialSteps.length - 1
    ?
    "DONE"
    :
    "NEXT";


  renderProgress();

}


/* =========================================================
   FINISH
========================================================= */

function finishTutorial(){

  localStorage.setItem(
    "home_tutorial_seen",
    "1"
  );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnTo =
    params.get(
      "return"
    );


  const tripId =
    params.get(
      "trip"
    )
    ||
    localStorage.getItem(
      "current_trip_id"
    );


  if(returnTo){

    window.location.href =
      returnTo;


    return;

  }


  if(tripId){

    window.location.href =
      `index.html?trip=${
        encodeURIComponent(
          tripId
        )
      }`;


    return;

  }


  window.location.href =
    "index.html";

}


/* =========================================================
   BUTTONS
========================================================= */

backBtn.addEventListener(
  "click",
  () => {

    if(
      currentStep > 0
    ){

      currentStep -= 1;

      renderStep();

    }

  }
);


nextBtn.addEventListener(
  "click",
  () => {

    if(
      currentStep <
      tutorialSteps.length - 1
    ){

      currentStep += 1;

      renderStep();


      return;

    }


    finishTutorial();

  }
);


skipBtn.addEventListener(
  "click",
  finishTutorial
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "ArrowRight"
    ){

      nextBtn.click();

    }


    else if(
      event.key ===
      "ArrowLeft"
      &&
      currentStep > 0
    ){

      backBtn.click();

    }


    else if(
      event.key ===
      "Escape"
    ){

      finishTutorial();

    }

  }
);


/* =========================================================
   PRELOAD SCREENSHOTS
========================================================= */

const preloadOne =
  new Image();

preloadOne.src =
  HOME_IMAGE_1;


const preloadTwo =
  new Image();

preloadTwo.src =
  HOME_IMAGE_2;


/* =========================================================
   START
========================================================= */

renderStep();

</script>



<script src="pwa.js"></script>
</body>

</html>
