<!-- =========================================================
     SHARED FOOTER
     DARK CIRCLE ICONS — NO CIRCLE BORDER
========================================================= -->

<style>

:root{
  --footer-bg:#070c10;
  --footer-panel:#10161c;
  --footer-line:#29323b;
  --footer-text:#f5f5f3;
  --footer-muted:#aeb5bc;
  --footer-red:#ff625f;
  --footer-blue:#5c9dff;
}


/* =========================================================
   PAGE SPACING
========================================================= */

body{
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}


/* =========================================================
   BOTTOM NAVIGATION
========================================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  z-index:80;

  display:grid;
  grid-template-columns:repeat(6,1fr);
  align-items:center;

  padding:
    6px
    8px
    calc(6px + env(safe-area-inset-bottom));

  border:0;

  background:rgba(7,12,16,.98);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}


/* =========================================================
   NAV ITEMS
========================================================= */

.bottom-nav a,
.bottom-nav button{
  min-width:0;
  height:58px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  padding:0;

  border:0;
  background:transparent;

  color:var(--footer-muted);

  text-decoration:none;

  font:inherit;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   ICON CIRCLE
========================================================= */

.bottom-nav .nav-icon{
  position:relative;

  width:42px;
  height:42px;

  flex:0 0 42px;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  border:0;
  border-radius:50%;

  background:#10171d;

  box-shadow:none;

  box-sizing:border-box;

  transition:
    transform .18s ease,
    background .18s ease,
    box-shadow .18s ease;
}


/* =========================================================
   ICON ARTWORK
========================================================= */

.bottom-nav .nav-icon img{
  display:block;

  object-fit:contain;

  max-width:none;

  transition:
    transform .22s ease,
    filter .22s ease,
    opacity .22s ease;
}


/* HOME */

#sharedNavHome .nav-icon img{
  width:35px;
  height:35px;
}


/* PLAN */

#sharedNavPlan .nav-icon img{
  width:35px;
  height:35px;
}


/* FOOD */

#sharedNavFood .nav-icon img{
  width:37px;
  height:37px;
}


/* BOOKING */

#sharedNavHub .nav-icon img{
  width:27px;
  height:27px;
}


/* EXPENSES */

#sharedNavExpenses .nav-icon img{
  width:35px;
  height:35px;
}


/* MORE */

#sharedNavMore .nav-icon img{
  width:37px;
  height:37px;
}


/* =========================================================
   LABEL
========================================================= */

.bottom-nav .nav-label{
  display:block;

  color:var(--footer-muted);

  font-size:7.5px;
  font-weight:800;

  line-height:1;

  letter-spacing:.6px;

  white-space:nowrap;

  transition:
    color .22s ease,
    text-shadow .22s ease;
}


/* =========================================================
   ACTIVE PAGE
========================================================= */

.bottom-nav a.active,
.bottom-nav button.active{
  color:var(--footer-red);

  border:0;
  background:transparent;
}


.bottom-nav a.active .nav-icon,
.bottom-nav button.active .nav-icon{
  border:0;

  background:rgba(255,98,95,.10);

  box-shadow:
    0 0 15px
    rgba(255,98,95,.13);
}


.bottom-nav a.active .nav-icon img,
.bottom-nav button.active .nav-icon img{
  transform:scale(1.04);

  filter:
    brightness(1.08)
    saturate(1.12);
}


.bottom-nav a.active .nav-label,
.bottom-nav button.active .nav-label{
  color:var(--footer-red);

  text-shadow:
    0 0 8px
    rgba(255,98,95,.18);
}


/* =========================================================
   MORE BUTTON
========================================================= */

#sharedNavMore{
  color:var(--footer-muted);
}


#sharedNavMore .nav-icon{
  border:0;
  border-radius:50%;

  background:#10171d;
}


#sharedNavMore.active .nav-icon{
  background:rgba(255,98,95,.10);

  box-shadow:
    0 0 15px
    rgba(255,98,95,.13);
}


/* =========================================================
   HOVER
========================================================= */

@media(hover:hover){

  .bottom-nav a:hover .nav-icon img,
  .bottom-nav button:hover .nav-icon img{
    transform:
      translateY(-2px)
      scale(1.04);
  }


  .bottom-nav a:hover .nav-label,
  .bottom-nav button:hover .nav-label{
    color:#e3e5e6;
  }


  .bottom-nav a.active:hover .nav-label,
  .bottom-nav button.active:hover .nav-label{
    color:var(--footer-red);
  }

}


/* =========================================================
   TAP EFFECT
========================================================= */

.bottom-nav a:active .nav-icon,
.bottom-nav button:active .nav-icon{
  transform:scale(.90);
}


/* =========================================================
   SHEET BACKDROP
========================================================= */

.footer-sheet-backdrop{
  position:fixed;
  inset:0;

  z-index:150;

  display:none;
  align-items:flex-end;

  background:rgba(0,0,0,.68);

  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}


.footer-sheet-backdrop.open{
  display:flex;
}


/* =========================================================
   SHEET
========================================================= */

.footer-sheet{
  width:100%;
  max-width:760px;

  max-height:
    calc(
      92vh -
      env(safe-area-inset-top)
    );

  overflow-y:auto;

  margin:0 auto;

  padding:
    8px
    14px
    calc(
      18px +
      env(safe-area-inset-bottom)
    );

  border:1px solid var(--footer-line);

  border-radius:
    20px
    20px
    0
    0;

  background:#0d1318;

  color:var(--footer-text);
}


/* =========================================================
   SHEET HANDLE
========================================================= */

.footer-sheet-handle{
  width:38px;
  height:4px;

  margin:
    2px
    auto
    12px;

  border-radius:999px;

  background:#39454d;
}


/* =========================================================
   SHEET HEADER
========================================================= */

.footer-sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-bottom:12px;
}


.footer-sheet-title{
  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:19px;
}


.footer-sheet-close{
  width:34px;
  height:34px;

  border:1px solid var(--footer-line);

  border-radius:9px;

  background:#151c22;

  color:#fff;

  font:inherit;

  cursor:pointer;
}


/* =========================================================
   MORE LINKS
========================================================= */

.footer-more-link{
  width:100%;
  min-height:58px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:9px 10px;

  margin-bottom:6px;

  border:1px solid var(--footer-line);

  border-radius:11px;

  background:#11181e;

  color:#fff;

  text-decoration:none;

  text-align:left;

  font:inherit;

  cursor:pointer;

  transition:
    border-color .18s ease,
    background .18s ease;
}


.footer-more-link:hover{
  border-color:#39454d;
  background:#141c22;
}


.footer-more-link.current{
  border-color:
    rgba(255,98,95,.30);

  background:
    rgba(255,98,95,.065);
}


.footer-more-icon{
  flex:0 0 31px;

  font-size:18px;

  text-align:center;
}


.footer-more-main{
  flex:1;

  min-width:0;
}


.footer-more-title{
  font-size:9px;

  font-weight:900;
}


.footer-more-sub{
  margin-top:2px;

  color:#7f8b93;

  font-size:6.5px;

  line-height:1.4;
}


.footer-more-arrow{
  color:#8d9aa2;

  font-size:12px;
}


.footer-more-separator{
  height:1px;

  margin:11px 2px;

  background:var(--footer-line);
}


/* =========================================================
   LOGOUT
========================================================= */

.footer-more-link.logout{
  border-color:
    rgba(
      201,
      111,
      104,
      .28
    );

  background:
    rgba(
      201,
      111,
      104,
      .055
    );
}


.footer-more-link.logout
.footer-more-title{
  color:#efa39d;
}


.footer-more-link.logout:disabled{
  opacity:.55;

  cursor:wait;
}


/* =========================================================
   TRIP LIST
========================================================= */

.footer-trip-list{
  display:flex;
  flex-direction:column;

  gap:7px;
}


.footer-trip-card{
  width:100%;
  min-height:70px;

  display:flex;
  align-items:center;

  gap:10px;

  padding:10px;

  border:1px solid var(--footer-line);

  border-radius:12px;

  background:#11181e;

  color:#fff;

  text-decoration:none;
}


.footer-trip-card.current{
  border-color:
    rgba(
      201,
      111,
      104,
      .55
    );

  background:
    rgba(
      201,
      111,
      104,
      .09
    );
}


.footer-trip-icon{
  flex:0 0 36px;

  font-size:21px;

  text-align:center;
}


.footer-trip-main{
  flex:1;

  min-width:0;
}


.footer-trip-name{
  font-size:9px;

  font-weight:900;

  line-height:1.3;
}


.footer-trip-meta{
  margin-top:3px;

  color:#87949c;

  font-size:6.5px;

  line-height:1.4;
}


.footer-trip-role{
  display:inline-block;

  margin-top:4px;

  padding:2px 5px;

  border:
    1px solid
    rgba(
      92,
      157,
      255,
      .22
    );

  border-radius:999px;

  color:#8ab9ff;

  font-size:5.5px;

  font-weight:900;
}


.footer-trip-card.current
.footer-trip-role{
  border-color:
    rgba(
      201,
      111,
      104,
      .28
    );

  color:#e7aaa5;
}


.footer-trip-arrow{
  color:#7f8b93;

  font-size:13px;
}


.footer-trip-message{
  padding:18px 10px;

  color:#7f8b93;

  font-size:8px;

  text-align:center;

  line-height:1.5;
}


.footer-trip-message.error{
  color:#ffc5c1;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:700px){

  .footer-sheet{
    max-width:620px;
  }


  .bottom-nav{
    left:50%;
    right:auto;

    width:min(820px,100%);

    transform:translateX(-50%);

    border:0;
    border-radius:0;
  }

}
