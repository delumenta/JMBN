========================================================= */

/* =========================================================

========================================================= */

const params =

let TRIP_ID =

/* =========================================================

========================================================= */

let trip =
  null;


let restaurants =
  [];


let tripRestaurants =

let scheduleRows =
  [];


let currentUser =
  null;


let countryLibraryFallback =
  false;

  "mine";


let selectedCity =

/* =========================================================
   HELPERS
========================================================= */

function text(value){

  return String(
    value ?? ""
  );

}



function esc(value){

  return text(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function norm(value){

  return text(value)
    .trim()
    .toLowerCase();

}



function unique(values){

  return [

    ...new Set(

      values

        .map(
          value =>
            text(value)
              .trim()
        )

        .filter(
          Boolean
        )

    )

  ]

  .sort(
    (a,b) =>
      a.localeCompare(b)
  );

}



/* =========================================================
   ACCESSIBLE TRIPS
========================================================= */

async function getAccessibleTrips(){

  if(!currentUser && TRIP_ID){
    const publicResult = await db.from("trips").select("*").eq("id", TRIP_ID).maybeSingle();
    if(publicResult.error) throw publicResult.error;
    return publicResult.data ? [publicResult.data] : [];
  }


  const {
    data:userData,
    error:userError
  } =
    await db.auth
      .getUser();


  if(userError){

    throw userError;

  }


  const user =
    userData?.user;


  if(!user){

    throw new Error(
      "You are not signed in."
    );

  }


  currentUser =
    user;


  /* OWNED */


  const ownedResult =
    await db

      .from(
        "trips"
      )

      .select(
        "*"
      )

      .eq(
        "owner_id",
        user.id
      );


  if(
    ownedResult.error
  ){

    throw ownedResult.error;

  }


  /* SHARED */


  const memberResult =
    await db

      .from(
        "trip_members"
      )

      .select(
        "trip_id"
      )

      .eq(
        "user_id",
        user.id
      );


  if(
    memberResult.error
  ){

    throw memberResult.error;

  }


  const sharedIds = [

    ...new Set(

      (
        memberResult.data
        ||
        []
      )

      .map(
        row =>
          Number(
            row.trip_id
          )
      )

      .filter(
        Number.isFinite
      )

    )

  ];


  let sharedTrips =
    [];


  if(
    sharedIds.length
  ){


    const sharedResult =
      await db

        .from(
          "trips"
        )

        .select(
          "*"
        )

        .in(
          "id",
          sharedIds
        );


    if(
      sharedResult.error
    ){

      throw sharedResult.error;

    }


    sharedTrips =
      sharedResult.data
      ||
      [];

  }


  const tripMap =
    new Map();


  (
    ownedResult.data
    ||
    []
  )
  .forEach(
    item => {


      tripMap.set(

        Number(
          item.id
        ),

        {
          ...item,
          __role:
            "owner"
        }

      );


    }
  );


  sharedTrips
    .forEach(
      item => {


        const id =
          Number(
            item.id
          );


        if(
          !tripMap.has(id)
        ){


          tripMap.set(

            id,

            {
              ...item,
              __role:
                "member"
            }

          );


        }


      }
    );


  return [

    ...tripMap.values()

  ]

  .sort(
    (a,b) =>

      String(
        a.start_date
        ||
        ""
      )

      .localeCompare(

        String(
          b.start_date
          ||
          ""
        )

      )

  );

}



/* =========================================================
   RESOLVE CURRENT TRIP
========================================================= */

async function resolveTrip(){


  const accessibleTrips =
    await getAccessibleTrips();


  if(
    !accessibleTrips.length
  ){

    throw new Error(
      "No trips are available for this account."
    );

  }


  if(
    !TRIP_ID
  ){


    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(

      {},

      "",

      `food.html?trip=${TRIP_ID}`

    );


  }


  const allowed =
    accessibleTrips
      .some(
        item =>

          Number(
            item.id
          )

          ===

          Number(
            TRIP_ID
          )
      );


  if(
    !allowed
  ){


    TRIP_ID =
      Number(
        accessibleTrips[0].id
      );


    history.replaceState(

      {},

      "",

      `food.html?trip=${TRIP_ID}`

    );


  }


}

function eatenDate(r){


  const value =
    relationFor(
      r.id
    )
    ?.eaten_at;


  if(
    !value
  ){

    return "";

  }


  const d =
    new Date(
      value
    );


  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return "";

  }


  return new Intl.DateTimeFormat(

    "en-SG",

    {
      day:"numeric",
      month:"short"
    }

  )

  .format(d)

  .toUpperCase();

}

  return scheduleRows

        Number(

        ===

          r.id
        )

        String(

function foodGroup(restaurant){


  const value =
    norm(
      rCuisine(
        restaurant
      )
    );


  if(
    value.includes("sushi")
    ||
    value.includes("sashimi")
    ||
    value.includes("omakase")
  ){

    return "sushi";

  }


  if(
    value.includes("ramen")
    ||
    value.includes("udon")
    ||
    value.includes("soba")
    ||
    value.includes("noodle")
  ){

    return "noodles";

  }


  if(
    value.includes("yakitori")
    ||
    value.includes("kushiyaki")
    ||
    value.includes("chicken")
  ){

    return "yakitori";

  }


  if(
    value.includes("tonkatsu")
    ||
    value.includes("katsu")
  ){

    return "katsu";

  }


  if(
    value.includes("oyakodon")
    ||
    value.includes("donburi")
    ||
    value.includes("rice bowl")
    ||
    value.includes("rice")
  ){

    return "rice";

  }


  if(
    value.includes(
      "tempura"
    )
  ){

    return "tempura";

  }


  if(
    value.includes("unagi")
    ||
    value.includes("eel")
    ||
    value.includes("seafood")
    ||
    value.includes("fish")
  ){

    return "seafood";

  }


  if(
    value.includes(
      "curry"
    )
  ){

    return "curry";

  }


  if(
    value.includes("izakaya")
    ||
    value.includes("japanese pub")
  ){

    return "izakaya";

  }


  if(
    value.includes("cafe")
    ||
    value.includes("coffee")
    ||
    value.includes("dessert")
    ||
    value.includes("sweet")
    ||
    value.includes("wagashi")
    ||
    value.includes("bakery")
    ||
    value.includes("pastry")
  ){

    return "cafe";

  }


  return "";

}



/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){


  try{


    await resolveTrip();


    /* -----------------------------------------------
       TRIP
    ----------------------------------------------- */


    const tripResult =
      await db

        .from(
          "trips"
        )

        .select(
          "*"
        )

        .eq(
          "id",
          TRIP_ID
        )

        .single();


    if(
      tripResult.error
    ){

      throw tripResult.error;

    }


    trip =
      tripResult.data;


    tripName.textContent =
      trip.name
      ||
      "My Trip";


    tripEyebrow.textContent =
      trip.country

      ?

      `${trip.country} · TRIP FOOD`

      :

      "TRIP FOOD";


    document.title =
      `Food · ${
        trip.name
        ||
        "My Trip"
      }`;


    /* -----------------------------------------------
       ALL FOOD / MASTER LIST
    ----------------------------------------------- */


    const restaurantResult =
      await db

        .from(
          "restaurants"
        )

        .select(
          "*"
        )

        .order(
          "name",
          {
            ascending:true
          }
        );


    if(
      restaurantResult.error
    ){

      throw restaurantResult.error;

    }


    const allRestaurants =
      restaurantResult.data
      ||
      [];


    restaurants =
      allRestaurants.slice();


    const canonicalTripCountry =
      (
        typeof canonicalCountryName
        ===
        "function"
      )
      ?
      canonicalCountryName(
        trip.country
      )
      :
      (
        trip.country
        ||
        null
      );


    countryLibraryFallback =
      Boolean(
        trip.country
        &&
        !canonicalTripCountry
      );


    /*
      Use the trip country only when it is recognised.
      If an older trip contains a typo/unknown value such as "D",
      keep the full reusable restaurant library visible.
    */


    if(canonicalTripCountry){


      const country =
        norm(
          canonicalTripCountry
        );


      const exactCountry =
        allRestaurants.filter(
          restaurant =>
            restaurant.country
            &&
            norm(
              restaurant.country
            )
            ===
            country
        );


      const uncategorised =
        allRestaurants.filter(
          restaurant =>
            !restaurant.country
        );


      if(
        exactCountry.length
      ){

        restaurants = [
          ...exactCountry,
          ...uncategorised
        ];

      }

      else if(
        allRestaurants.length
      ){

        restaurants =
          allRestaurants.slice();


        countryLibraryFallback =
          true;

      }


    }


    /* -----------------------------------------------
       MY FOOD
    ----------------------------------------------- */


    const relationResult =
      await db

        .from(
          "trip_restaurants"
        )

        .select(
          "*"
        )

        .eq(
          "trip_id",
          TRIP_ID
        );


    if(
      relationResult.error
    ){

      throw relationResult.error;

    }


    tripRestaurants =
      relationResult.data
      ||
      [];


    /* -----------------------------------------------
       SCHEDULE
    ----------------------------------------------- */


    const scheduleResult =
      await db

        .from(
          "schedule"
        )

        .select(`
          id,
          restaurant_id,
          schedule_date,
          start_time,
          time_label,
          title,
          is_locked
        `)

        .eq(
          "trip_id",
          TRIP_ID
        )

        .not(
          "restaurant_id",
          "is",
          null
        );


    if(
      scheduleResult.error
    ){


      console.warn(
        "Schedule food:",
        scheduleResult.error
      );


      scheduleRows =
        [];


    }

    else{


      scheduleRows =
        scheduleResult.data
        ||
        [];


    }


    renderCountryLibraryNotice();

    createCityChips();

    render();


  }

  catch(error){


    console.error(
      "Food load error:",
      error
    );


    tripEyebrow.textContent =
      "FOOD";


    tripName.textContent =
      "Could not load trip";


    results.innerHTML = `

      <div class="state">

        <strong>
          Couldn't load Food
        </strong>

        ${esc(
          error.message
          ||
          "Unknown database error."
        )}

      </div>

    `;


  }


}

/* =========================================================
   BASE FILTER
========================================================= */

function baseList(){


  let list =
    restaurants.slice();


  if(
    activeTab
    ===
    "mine"
  ){


    list =
      list.filter(
        inMyFood
      );


    if(
      myFilter
      ===
      "eaten"
    ){


      list =
        list.filter(
          isEaten
        );


    }

    else{


      list =
        list.filter(
          restaurant =>
            !isEaten(
              restaurant
            )
        );


      if(
        myFilter
        ===
        "pick"
      ){


        list =
          list.filter(
            isPick
          );


      }


      if(
        myFilter
        ===
        "flexible"
      ){


        list =
          list.filter(
            isFlexible
          );


      }


      if(
        myFilter
        ===
        "scheduled"
      ){


        list =
          list.filter(
            isScheduled
          );


      }


    }


  }

  else{


    if(
      allFoodStatus
      ===
      "tabelog"
    ){


      list =
        list.filter(
          hasTabelog
        );


    }


    if(
      allFoodStatus
      ===
      "eaten"
    ){


      list =
        list.filter(
          isEaten
        );


    }


  }


  if(
    selectedCity
  ){


    list =
      list.filter(
        restaurant =>

          norm(
            rCity(
              restaurant
            )
          )

          ===

          norm(
            selectedCity
          )
      );


  }


  return list;


}



/* =========================================================
   QUICK SEARCH
========================================================= */

function matchesQuickSearch(restaurant){


  const query =
    norm(
      quickSearch
    );


  if(
    !query
  ){

    return true;

  }


  const haystack =
    norm(

      [

        restaurant.name,

        restaurant.name_japanese,

        rCity(
          restaurant
        ),

        rArea(
          restaurant
        ),

        rCuisine(
          restaurant
        ),

        restaurant.category,

        restaurant.location,

        restaurant.description,

        restaurant.award,

        restaurant.recognition

      ]

      .map(
        text
      )

      .join(
        " "
      )

    );


  return haystack
    .includes(
      query
    );

}



/* =========================================================
   FINAL FILTER
========================================================= */

function filteredRestaurants(){


  let list =
    baseList();


  if(
    areaFilter
  ){


    list =
      list.filter(
        restaurant =>

          norm(
            rArea(
              restaurant
            )
          )

          ===

          norm(
            areaFilter
          )
      );


  }


  if(
    foodFilter
  ){


    list =
      list.filter(
        restaurant =>

          foodGroup(
            restaurant
          )

          ===

          foodFilter
      );


  }


  if(
    quickSearch
  ){


    list =
      list.filter(
        matchesQuickSearch
      );


  }


  return list;


}

        const key =
          norm(
            area
          );


        if(
          !areaCounts.has(key)
        ){


          areaCounts.set(

            key,

            {
              label:area,
              count:0
            }

          );


        }


        areaCounts
          .get(key)
          .count += 1;


      }
    );


  const areas = [

    ...areaCounts.values()

  ]

  .sort(
    (a,b) =>
      a.label
        .localeCompare(
          b.label
        )
  );


  if(
    areaFilter
    &&
    !areas.some(
      item =>
        norm(
          item.label
        )
        ===
        norm(
          areaFilter
        )
    )
  ){


    areaFilter =
      "";


  }


  areaFilterButtonText.textContent =
    areaFilter

    ?

    `📍 ${areaFilter}`

    :

    "📍 All Areas";


  areaFilterButton
    .classList
    .toggle(
      "active",
      Boolean(
        areaFilter
      )
    );


  areaFilterMenu.innerHTML = `


    <button
      class="filter-menu-item ${
        !areaFilter
        ?
        "active"
        :
        ""
      }"
      data-area=""
      type="button"
    >

      <span>
        ✓ All Areas
      </span>

      <span class="filter-menu-count">
        ${source.length}
      </span>

    </button>


    ${

      areas

        .map(
          item => `

            <button
              class="filter-menu-item ${
                norm(
                  areaFilter
                )
                ===
                norm(
                  item.label
                )
                ?
                "active"
                :
                ""
              }"
              data-area="${esc(item.label)}"
              type="button"
            >

              <span>
                ${esc(item.label)}
              </span>

              <span class="filter-menu-count">
                ${item.count}
              </span>

            </button>

          `
        )

        .join("")

    }


  `;


  areaFilterMenu
    .querySelectorAll(
      "[data-area]"
    )
    .forEach(
      button => {


        button.onclick =
          () => {


            areaFilter =
              button.dataset.area
              ||
              "";


            foodFilter =
              "";


            closeFilterMenus();


            render();


          };


      }
    );


  /* -----------------------------------------------
     FOOD GROUP
  ----------------------------------------------- */


  let foodSource =
    source.slice();


  if(
    areaFilter
  ){


    foodSource =
      foodSource.filter(
        restaurant =>

          norm(
            rArea(
              restaurant
            )
          )

          ===

          norm(
            areaFilter
          )
      );


  }


  const foodCounts =
    {};


  FOOD_GROUPS
    .forEach(
      group => {


        foodCounts[
          group.key
        ] =
          0;


      }
    );


  foodSource
    .forEach(
      restaurant => {


        const key =
          foodGroup(
            restaurant
          );


        if(
          key
          &&
          key in foodCounts
        ){


          foodCounts[key] +=
            1;


        }


      }
    );


  const availableGroups =
    FOOD_GROUPS
      .filter(
        group =>
          foodCounts[
            group.key
          ]
          >
          0
      );


  if(
    foodFilter
    &&
    !availableGroups.some(
      group =>
        group.key
        ===
        foodFilter
    )
  ){


    foodFilter =
      "";


  }


  const selectedGroup =
    FOOD_GROUPS
      .find(
        group =>
          group.key
          ===
          foodFilter
      );


  foodFilterButtonText.textContent =
    selectedGroup

    ?

    `${selectedGroup.icon} ${selectedGroup.label}`

    :

    "🍽️ All Food";


  foodFilterButton
    .classList
    .toggle(
      "active",
      Boolean(
        foodFilter
      )
    );


  foodFilterMenu.innerHTML = `


    <button
      class="filter-menu-item ${
        !foodFilter
        ?
        "active"
        :
        ""
      }"
      data-food=""
      type="button"
    >

      <span>
        ✓ All Food
      </span>

      <span class="filter-menu-count">
        ${foodSource.length}
      </span>

    </button>


    ${

      availableGroups

        .map(
          group => `

            <button
              class="filter-menu-item ${
                foodFilter
                ===
                group.key
                ?
                "active"
                :
                ""
              }"
              data-food="${group.key}"
              type="button"
            >

              <span>
                ${group.icon}
                ${group.label}
              </span>

              <span class="filter-menu-count">
                ${foodCounts[group.key]}
              </span>

            </button>

          `
        )

        .join("")

    }


  `;


  foodFilterMenu
    .querySelectorAll(
      "[data-food]"
    )
    .forEach(
      button => {


        button.onclick =
          () => {


            foodFilter =
              button.dataset.food
              ||
              "";


            closeFilterMenus();


            render();


          };


      }
    );


  clearCompactFilters
    .classList
    .toggle(

      "active",

      Boolean(

        areaFilter

        ||

        foodFilter

        ||

        quickSearch

      )

    );


}

/* =========================================================
   SCHEDULE DISPLAY
========================================================= */

function planHTML(r){


  const rows =
    scheduleFor(
      r
    );


  if(
    !rows.length
  ){

    return "";

  }


  return rows

    .map(
      row => {


        const time =
          row.time_label

          ||

          (
            row.start_time

            ?

            row.start_time
              .slice(
                0,
                5
              )

            :

            ""
          );


        return `

          <div class="plan-box">

            📅
            ${esc(
              formatScheduleDate(
                row.schedule_date
              )
            )}

            ${
              time
              ?
              ` · ${esc(time)}`
              :
              ""
            }

            ${
              row.is_locked
              ?
              " · 🔒 Locked"
              :
              ""
            }

          </div>

        `;


      }
    )

    .join(
      ""
    );


}

            </button>

              </div>

              <div class="food-term">
                <b>📅 SCHEDULED</b>
                Already assigned to your itinerary.
              </div>

            </div>

          `

          :

          myFilter
          ===
          "eaten"

          ?

          `

            Nothing marked as eaten yet.

          `

          :

          `

            No restaurants match this filter.

          `
        }


      </div>


    `;


    return;


  }


  if(
    myFilter
    !==
    "all"
  ){


    results.innerHTML =

      list

        .map(
          cardHTML
        )

        .join(
          ""
        );


    return;


  }


  const picks =
    list.filter(
      isPick
    );


  const scheduled =
    list.filter(
      restaurant =>

        isScheduled(
          restaurant
        )

        &&

        !isPick(
          restaurant
        )
    );


  const flexible =
    list.filter(
      restaurant =>

        isFlexible(
          restaurant
        )

        &&

        !isPick(
          restaurant
        )

        &&

        !isScheduled(
          restaurant
        )
    );


  const saved =
    list.filter(
      restaurant =>

        !isPick(
          restaurant
        )

        &&

        !isFlexible(
          restaurant
        )

        &&

        !isScheduled(
          restaurant
        )
    );


  let html =

  if(

  if(
    scheduled.length
  ){


    html +=
      sectionHTML(
        "📅 SCHEDULED",
        scheduled
      );


  }


  if(
    flexible.length
  ){


    html +=
      sectionHTML(
        "🌙 FLEXIBLE / MAYBE",
        flexible
      );


  }


  if(
    saved.length
  ){


    html +=
      sectionHTML(
        "❤️ SAVED",
        saved
      );


  }


  results.innerHTML =
    html;


}

/* =========================================================
   ADD EXISTING RESTAURANT TO MY FOOD
========================================================= */

async function addToMyFood(
  restaurantId
){


  if(
    !currentUser
  ){


    window.location.href =
      "login.html";


    return;


  }


  const existing =
    relationFor(
      restaurantId
    );


  if(
    existing
  ){


    render();

    return;


  }


  try{


    const result =
      await db

        .from(
          "trip_restaurants"
        )

        .insert({


          trip_id:
            TRIP_ID,


          restaurant_id:
            restaurantId,


          is_pick:
            false,


          is_flexible:
            false,


          is_eaten:
            false,


          eaten_at:
            null


        })

        .select()

        .single();


    if(
      result.error
    ){

      throw result.error;

    }


    tripRestaurants.push(
      result.data
    );


    render();


  }

  catch(error){


    console.error(
      error
    );


    alert(
      error.message
      ||
      "Couldn't add restaurant to My Food."
    );


  }


}



/* =========================================================
   PICK
========================================================= */

async function togglePick(
  restaurantId
){


  const relation =
    relationFor(
      restaurantId
    );


  if(
    !relation
  ){

    return;

  }


  const value =
    !relation.is_pick;


  try{


    const result =
      await db

        .from(
          "trip_restaurants"
        )

        .update({
          is_pick:
            value
        })

        .eq(
          "trip_id",
          TRIP_ID
        )

        .eq(
          "restaurant_id",
          restaurantId
        );


    if(
      result.error
    ){

      throw result.error;

    }


    relation.is_pick =
      value;


    render();


  }

  catch(error){


    console.error(
      error
    );


    alert(
      error.message
      ||
      "Couldn't update Pick."
    );


  }


}

      .find(
        item =>

          Number(
            item.id
          )

          ===

          Number(
            restaurantId
          )
      );


  if(
    !restaurant
  ){

    return;

  }


  const okay =
    confirm(

      `Remove "${restaurant.name}" from My Food?\n\nThe restaurant will stay in All Food.`

    );


  if(
    !okay
  ){

    return;

  }


  try{


    const result =
      await db

        .from(
          "trip_restaurants"
        )

        .delete()

        .eq(
          "trip_id",
          TRIP_ID
        )

        .eq(
          "restaurant_id",
          restaurantId
        );


    if(
      result.error
    ){

      throw result.error;

    }


    tripRestaurants =
      tripRestaurants
        .filter(
          item =>

            Number(
              item.restaurant_id
            )

            !==

            Number(
              restaurantId
            )
        );


    render();


  }

  catch(error){


    console.error(
      error
    );


    alert(
      error.message
      ||
      "Couldn't remove restaurant."
    );


  }


}



/* =========================================================
   GOOGLE PLACES
========================================================= */

let googlePlaceAutocomplete =
  null;


let selectedGoogleLatitude =
  null;


let selectedGoogleLongitude =
  null;



function setPlaceStatus(
  message,
  type=""
){


  const el =
    document.getElementById(
      "googlePlaceStatus"
    );


  if(
    !el
  ){

    return;

  }


  el.textContent =
    message;


  el.className =
    `place-status ${type}`
      .trim();


}



function guessCuisine(types){


  const values =
    (
      types
      ||
      []
    )

    .map(
      norm
    );


  if(
    values.includes(
      "ramen_restaurant"
    )
  ){

    return "Ramen";

  }


  if(
    values.includes(
      "sushi_restaurant"
    )
  ){

    return "Sushi";

  }


  if(
    values.includes(
      "japanese_restaurant"
    )
  ){

    return "Japanese";

  }


  if(
    values.includes(
      "seafood_restaurant"
    )
  ){

    return "Seafood";

  }


  if(
    values.includes(
      "cafe"
    )
  ){

    return "Cafe";

  }


  if(
    values.includes(
      "bakery"
    )
  ){

    return "Bakery";

  }


  if(
    values.includes(
      "bar"
    )
  ){

    return "Bar";

  }


  if(
    values.includes(
      "restaurant"
    )
  ){

    return "Restaurant";

  }


  return "";


}



async function initGooglePlaces(){


  const host =
    document.getElementById(
      "googlePlaceSearch"
    );


  if(
    !host
  ){

    return;

  }


  try{


    setPlaceStatus(
      "Loading Google Places…"
    );


    if(

      typeof window.loadGoogleMaps
      !==
      "function"

      ||

      typeof window.getGooglePlaces
      !==
      "function"

      ||

      typeof window.createGooglePlaceAutocomplete
      !==
      "function"

      ||

      typeof window.getGooglePlaceDetails
      !==
      "function"

      ||

      typeof window.normalizeGooglePlace
      !==
      "function"

    ){


      throw new Error(
        "The Google Maps helper functions were not found."
      );


    }


    await window.loadGoogleMaps();


    await window.getGooglePlaces();


    googlePlaceAutocomplete =
      await window
        .createGooglePlaceAutocomplete(

          host,

          {

            placeholder:

              `Search restaurant${
                trip?.country
                ?
                " in "
                +
                trip.country
                :
                ""
              }...`

          }

        );


    googlePlaceAutocomplete
      .addEventListener(

        "gmp-select",

        async event => {


          try{


            setPlaceStatus(
              "Getting place details…"
            );


            const place =
              await window
                .getGooglePlaceDetails(
                  event
                );


            const data =
              window
                .normalizeGooglePlace(
                  place
                );


            selectedGoogleLatitude =
              data.latitude
              ??
              null;


            selectedGoogleLongitude =
              data.longitude
              ??
              null;


            document
              .getElementById(
                "newName"
              )
              .value =
                data.name
                ||
                "";


            document
              .getElementById(
                "newCity"
              )
              .value =
                data.city
                ||
                selectedCity
                ||
                "";


            document
              .getElementById(
                "newArea"
              )
              .value =
                data.area
                ||
                "";


            document
              .getElementById(
                "newLocation"
              )
              .value =
                data.address
                ||
                "";


            document
              .getElementById(
                "newMaps"
              )
              .value =
                data.maps_url
                ||
                "";


            document
              .getElementById(
                "newWebsite"
              )
              .value =
                data.website_url
                ||
                "";


            const cuisineInput =
              document.getElementById(
                "newCuisine"
              );


            if(
              !cuisineInput
                .value
                .trim()
            ){


              cuisineInput.value =
                guessCuisine(
                  place.types
                  ||
                  []
                );


            }


            setPlaceStatus(

              `✓ ${
                data.name
                ||
                "Restaurant"
              } selected.`,

              "success"

            );


          }

          catch(error){


            console.error(
              "Google Places selection:",
              error
            );


            setPlaceStatus(

              "Google place error: "
              +
              (
                error.message
                ||
                String(error)
              ),

              "error"

            );


          }


        }

      );


    setPlaceStatus(
      "Search for a restaurant and select the correct Google result."
    );


  }

  catch(error){


    console.error(
      "Google Places init:",
      error
    );


    setPlaceStatus(

      "Google Places error: "
      +
      (
        error.message
        ||
        String(error)
      ),

      "error"

    );


  }


}

){

}



/* =========================================================
   ADD RESTAURANT

   ALWAYS:
   restaurants       = ALL FOOD
   trip_restaurants  = MY FOOD
========================================================= */

addForm
  .addEventListener(

    "submit",

    async event => {


      event.preventDefault();


      if(
        !currentUser
      ){


        window.location.href =
          "login.html";


        return;


      }


      const saveBtn =
        document.getElementById(
          "saveBtn"
        );


      saveBtn.disabled =
        true;


      saveBtn.textContent =
        "SAVING…";


      formMessage.className =
        "form-message";


      let newRestaurant =
        null;


      try{


        const name =
          document
            .getElementById(
              "newName"
            )
            .value
            .trim();


        const japanese =
          document
            .getElementById(
              "newJapanese"
            )
            .value
            .trim();


        const city =
          document
            .getElementById(
              "newCity"
            )
            .value
            .trim();


        const area =
          document
            .getElementById(
              "newArea"
            )
            .value
            .trim();


        const location =
          document
            .getElementById(
              "newLocation"
            )
            .value
            .trim();


        const cuisine =
          document
            .getElementById(
              "newCuisine"
            )
            .value
            .trim();


        const ratingText =
          document
            .getElementById(
              "newRating"
            )
            .value
            .trim();


        const price =
          document
            .getElementById(
              "newPrice"
            )
            .value
            .trim();


        const tabelog =
          document
            .getElementById(
              "newTabelog"
            )
            .value
            .trim();


        const maps =
          document
            .getElementById(
              "newMaps"
            )
            .value
            .trim();


        const website =
          document
            .getElementById(
              "newWebsite"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "newDescription"
            )
            .value
            .trim();


        const pick =
          document
            .getElementById(
              "newPick"
            )
            .checked;


        const flexible =
          document
            .getElementById(
              "newFlexible"
            )
            .checked;


        /* -----------------------------------------------
           DUPLICATE CHECK
        ----------------------------------------------- */


        const duplicate =
          restaurants
            .find(
              restaurant =>

                norm(
                  restaurant.name
                )

                ===

                norm(
                  name
                )

                &&

                norm(
                  rCity(
                    restaurant
                  )
                )

                ===

                norm(
                  city
                )
            );


        if(
          duplicate
        ){


          throw new Error(

            "This restaurant is already in All Food. Find it there and tap + My Food instead."

          );


        }


        /* -----------------------------------------------
           RATING
        ----------------------------------------------- */


        let rating =
          null;


        if(
          ratingText
        ){


          rating =
            Number(
              ratingText
            );


          if(
            Number.isNaN(
              rating
            )
          ){


            throw new Error(
              "Tabelog rating must be a number."
            );


          }


        }


        /* -----------------------------------------------
           1. INSERT INTO ALL FOOD
        ----------------------------------------------- */


        const restaurantResult =
          await db

            .from(
              "restaurants"
            )

            .insert({


              name:
                name,


              name_japanese:
                japanese
                ||
                null,


              cuisine:
                cuisine
                ||
                null,


              country:
                (
                  typeof canonicalCountryName
                  ===
                  "function"
                )
                ?
                (
                  canonicalCountryName(
                    trip?.country
                  )
                  ||
                  null
                )
                :
                (
                  trip?.country
                  ||
                  null
                ),


              city:
                city,


              area:
                area
                ||
                null,


              location:
                location
                ||
                null,


              description:
                description
                ||
                null,


              price:
                price
                ||
                null,


              tabelog_url:
                tabelog
                ||
                null,


              maps_url:
                maps
                ||
                null,


              website_url:
                website
                ||
                null,


              rating:
                rating,


              latitude:
                selectedGoogleLatitude,


              longitude:
                selectedGoogleLongitude,


              status:
                "active",


              created_by:
                currentUser.id,


              verified:
                false


            })

            .select()

            .single();


        if(
          restaurantResult.error
        ){


          throw restaurantResult.error;


        }


        newRestaurant =
          restaurantResult.data;


        /* -----------------------------------------------
           2. ALWAYS INSERT INTO MY FOOD
        ----------------------------------------------- */


        const relationResult =
          await db

            .from(
              "trip_restaurants"
            )

            .insert({


              trip_id:
                TRIP_ID,


              restaurant_id:
                newRestaurant.id,


              is_pick:
                pick,


              is_flexible:
                flexible,


              is_eaten:
                false,


              eaten_at:
                null


            })

            .select()

            .single();


        if(
          relationResult.error
        ){


          /*
            Best-effort rollback.

            If the My Food relationship fails,
            try to remove the restaurant that
            was just created in All Food.
          */


          try{


            await db

              .from(
                "restaurants"
              )

              .delete()

              .eq(
                "id",
                newRestaurant.id
              )

              .eq(
                "created_by",
                currentUser.id
              );


          }

          catch(rollbackError){


            console.warn(
              "Restaurant rollback failed:",
              rollbackError
            );


          }


          throw relationResult.error;


        }


        restaurants.push(
          newRestaurant
        );


        tripRestaurants.push(
          relationResult.data
        );


        restaurants.sort(
          (a,b) =>

            text(
              a.name
            )

            .localeCompare(

              text(
                b.name
              )

            )
        );


        showFormMessage(

          "Added to All Food and My Food.",

          "success"

        );


        addForm.reset();


        selectedGoogleLatitude =
          null;


        selectedGoogleLongitude =
          null;


        createCityChips();


        render();


        setTimeout(

          closeAddSheet,

          850

        );


      }

      catch(error){


        console.error(
          error
        );


        showFormMessage(

          error.message
          ||
          "Couldn't save restaurant.",

          "error"

        );


      }

      finally{


        saveBtn.disabled =
          false;


        saveBtn.textContent =
          "SAVE RESTAURANT";


      }


    }

  );

   START
========================================================= */

async function start(){


  await loadData();


  await initGooglePlaces();


}


start();
