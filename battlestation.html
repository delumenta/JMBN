<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMBN // Battle Stations</title><link rel="icon" href="assets/jmbn.ico"><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/bs-header.css"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -15%,#283326 0%,transparent 45%),#080d0c;color:#e8e8da;font-family:Play,Arial,sans-serif}main{max-width:1240px;margin:auto;padding:26px 20px 50px}#bs-header-slot{max-width:1100px}#game-frame{display:block;width:100%;height:1050px;min-height:70vh;border:0;background:transparent}#frame-error{display:none;padding:18px;border:1px solid #77663d;color:#e9ce8b}#frame-error a{color:#f3d77c}@media(max-width:600px){main{padding:12px 6px}#game-frame{height:1200px}}</style></head><body><main><div id="bs-header-slot" data-mode="solo"></div><div id="frame-error">Unable to load this mode. <a id="direct-link" href="battlestations.html">Open the game directly</a>.</div><iframe id="game-frame" title="Battle Stations game" allow="fullscreen"></iframe></main><script src="js/bs-header.js" defer></script><script>(function(){const modes={singleplayer:{mode:'solo',url:'battlestations.html'},multiplayer:{mode:'multi',url:'gunnery-multiplayer.html'},arcade:{mode:'arcade',url:'battlestations-arcade.html'}};const frame=document.getElementById('game-frame'),slot=document.getElementById('bs-header-slot');let current='';function navigate(){const key=location.hash.slice(1).toLowerCase();const chosen=modes[key]||modes.singleplayer;if(!modes[key]&&location.hash!=='#singleplayer')history.replaceState(null,'',location.pathname+location.search+'#singleplayer');slot.dataset.mode=chosen.mode;slot.querySelectorAll('[data-bs-mode]').forEach(a=>{const active=a.dataset.bsMode===chosen.mode;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(current!==chosen.url){current=chosen.url;document.getElementById('direct-link').href=chosen.url;frame.src=chosen.url+'?embedded=1';document.getElementById('frame-error').style.display='none'}}window.addEventListener('hashchange',navigate);navigate();const observer=new MutationObserver(()=>{slot.querySelectorAll('[data-bs-mode]').forEach(a=>{const active=a.dataset.bsMode===(modes[location.hash.slice(1)]||modes.singleplayer).mode;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})});observer.observe(slot,{childList:true});window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='bs-frame-height')return;if(e.source!==frame.contentWindow)return;frame.style.height=Math.max(650,Math.min(8000,Number(e.data.height)||1050))+'px'});frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;if(doc){const update=()=>{const height=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight);frame.style.height=Math.max(650,height+12)+'px'};update();new ResizeObserver(update).observe(doc.body)}}catch(e){}})})();</script></body></html>
