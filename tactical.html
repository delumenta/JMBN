<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMBN // Tactical</title><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#020302;color:#e8e8e8;font-family:Play,system-ui}.shell{max-width:1500px;margin:auto;padding:18px}.top,.nav,.panel{border:1px solid #5c4b2c;background:#080a08e8}.top{height:62px;display:flex;align-items:center;padding:0 18px}.top img{width:42px;height:42px;object-fit:contain;margin-right:12px}.brand,.gold{color:#d7b66a}.brand{font-weight:700;letter-spacing:.08em}.live{margin-left:auto;color:#79d889;font-size:11px}.nav{display:flex;border-top:0}.nav a{padding:13px 22px;color:#999;text-decoration:none;font-size:12px}.nav a.active{color:#d7b66a;border-bottom:2px solid #d7b66a;background:#17140d}.panel{margin-top:14px;padding:18px}.heading{display:flex;justify-content:space-between;align-items:end}.heading h1{margin:4px 0;font-size:26px}.muted{color:#858b82;font-size:11px}.map{position:relative;margin-top:14px;min-height:620px;background:#020302;overflow:hidden}.map img{width:100%;height:100%;min-height:620px;object-fit:contain;display:block}.pin{position:absolute;transform:translate(-50%,-50%);border:1px solid #d7b66a;background:#070807e8;color:#d7b66a;padding:5px 7px;font-size:9px;white-space:nowrap}.pin.mine{box-shadow:0 0 20px #d7b66a;border-width:2px;color:#fff}.pin b{display:block}.legend{display:flex;gap:20px;margin-top:12px;color:#999;font-size:10px}.empty{text-align:center;padding:80px;color:#777}@media(max-width:800px){.map{min-height:430px}.map img{min-height:430px}.pin{font-size:7px;padding:3px}}</style></head><body><div class="shell"><header class="top"><img src="assets/jmbn.png"><div class="brand">JMBN // TACTICAL</div><div class="live" id="sync">● CONNECTING</div></header><nav class="nav"><a href="staging.html">READY ROOM</a><a class="active" href="tactical.html">TACTICAL</a><a href="index.html#operations">MANIFEST</a></nav><main class="panel" id="app"><div class="empty">LOADING TACTICAL PLOT…</div></main></div><script>
const sb=getSupabase(),pos={command_chair:[13.3,76],icc:[25.8,58],ood:[9.6,77.5],helmsman:[11.7,85.5],air:[20.5,76],surface:[16.2,71],engineering_duty_officer:[71,40],torpedo_director:[34.6,71.2],mount_3_1:[78,60.2],mount_3_2:[45,36.8],mount_4_1:[50,54],mount_4_2:[37.6,46.5],mount_6_1:[29,86.6]},labels={command_chair:"COMMAND CHAIR",icc:"ICC",ood:"OOD",helmsman:"HELMSMAN",air:"AIR",surface:"SURFACE",engineering_duty_officer:"ENGINEERING",torpedo_director:"TORPEDO",mount_3_1:"MOUNT 3-1",mount_3_2:"MOUNT 3-2",mount_4_1:"MOUNT 4-1",mount_4_2:"MOUNT 4-2",mount_6_1:"MOUNT 6-1"};let session;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){session=await requireAuth();if(!session)return;const {data:s}=await sb.from("overlay_operation_state").select("mission_id").eq("singleton",true).maybeSingle();if(!s?.mission_id){app.innerHTML='<div class="empty">NO ACTIVE OPERATION</div>';return}const [{data:m},{data:sg}]=await Promise.all([sb.from("missions").select("title").eq("id",s.mission_id).single(),sb.from("mission_signups").select("user_id,status,operational_station,overlay_readiness").eq("mission_id",s.mission_id)]),going=(sg||[]).filter(x=>String(x.status).toLowerCase()==="going"),ids=going.map(x=>x.user_id);let names={};if(ids.length){const {data:p}=await sb.from("profiles").select("user_id,handle,display_name").in("user_id",ids);(p||[]).forEach(x=>names[x.user_id]=x.handle||x.display_name||"CREW")}const pins=going.filter(x=>x.operational_station&&pos[x.operational_station]).map(x=>{const p=pos[x.operational_station],mine=x.user_id===session.user.id;return `<div class="pin ${mine?"mine":""}" style="left:${p[0]}%;top:${p[1]}%"><b>${esc(labels[x.operational_station]||x.operational_station)}</b>${esc(names[x.user_id]||"CREW")}${mine?" · YOU":""}</div>`}).join("");app.innerHTML=`<div class="heading"><div><div class="gold">TACTICAL // POLARIS STATIONS</div><h1>${esc(m?.title||"ACTIVE OPERATION")}</h1><div class="muted">Live station assignments · your station is highlighted</div></div></div><div class="map"><img src="assets/polaris-stations.jpg">${pins}</div><div class="legend"><span class="gold">GOLD GLOW // YOUR STATION</span><span>Assignments refresh automatically</span></div>`;sync.textContent="● LIVE"}load();setInterval(load,10000);
</script></body></html>
