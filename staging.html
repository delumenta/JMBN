<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMBN // Operations Staging</title><link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/auth.js"></script><style>
:root{--bg:#050605;--panel:#090b09;--gold:#d7b66a;--line:#5c4b2c;--text:#e8e8e8;--muted:#858b82;--green:#79d889}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#18170f 0,#070807 35%,#020302 75%);color:var(--text);font-family:Play,system-ui;min-height:100vh}.shell{max-width:1380px;margin:auto;padding:18px}.top{height:62px;border:1px solid var(--line);background:#090b09e8;display:flex;align-items:center;padding:0 18px}.top img{width:42px;height:42px;object-fit:contain;margin-right:12px}.brand{color:var(--gold);font-weight:700;letter-spacing:.08em}.live{margin-left:auto;color:var(--green);font-size:11px}.nav{display:flex;border:1px solid var(--line);border-top:0;background:#070807}.nav a{padding:13px 22px;color:#999;text-decoration:none;font-size:12px}.nav a.active{color:var(--gold);border-bottom:2px solid var(--gold);background:#17140d}.hero,.grid,.checks,.crew{border:1px solid var(--line);background:#080a08e8;margin-top:14px}.hero{padding:28px}.eyebrow,.label{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.12em}.hero h1{margin:8px 0;font-size:30px}.meta{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr}.cell{padding:24px}.cell+ .cell{border-left:1px solid #332b1b}.big{font-size:21px;font-weight:700;margin-top:10px}.bar{height:12px;background:#20231f;margin:15px 0}.bar i{display:block;height:100%;width:0;background:var(--gold)}.checks{padding:22px}.checkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.check{border:1px solid #594a2c;padding:18px;text-align:center;cursor:pointer;min-height:112px}.check.on{background:#18150d;border-color:var(--gold)}.check b{display:block;margin:10px 0 5px}.check small{color:var(--muted)}.ready{display:block;width:100%;margin-top:16px;padding:16px;background:#17140d;color:var(--gold);border:1px solid var(--gold);font:700 14px Play;cursor:pointer}.ready:disabled{opacity:.35;cursor:not-allowed}.crew{padding:22px}.row{display:grid;grid-template-columns:1.1fr 1fr .6fr;padding:11px 4px;border-bottom:1px solid #26271f;font-size:12px}.station{color:var(--gold)}.status{text-align:right;color:#aaa}.status.ready{display:block;width:auto;margin:0;padding:0;background:none;border:0;color:var(--green)}.empty{padding:50px;text-align:center;color:#777}@media(max-width:760px){.grid{grid-template-columns:1fr}.cell+.cell{border-left:0;border-top:1px solid #332b1b}.checkgrid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.row .status{grid-column:2}.shell{padding:8px}}</style></head><body><div class="shell"><header class="top"><img src="assets/jmbn.png"><div class="brand">JMBN // OPERATIONS STAGING</div><div class="live" id="sync">● CONNECTING</div></header><nav class="nav"><a class="active" href="staging.html">READY ROOM</a><a href="tactical.html">TACTICAL</a><a href="index.html#operations">MANIFEST</a></nav><main id="app"><div class="empty">LOADING ACTIVE OPERATION…</div></main></div><script>
const sb=getSupabase(),stations={command_chair:"COMMAND CHAIR",icc:"INTEGRATED COMMAND CENTRE",ood:"OFFICER OF THE DECK",helmsman:"HELMSMAN",air:"CHIEF OF THE WATCH / AIR",surface:"SURFACE",engineering_duty_officer:"ENGINEERING DUTY OFFICER",torpedo_director:"TORPEDO DIRECTOR",mount_3_1:"MOUNT 3-1",mount_3_2:"MOUNT 3-2",mount_4_1:"MOUNT 4-1",mount_4_2:"MOUNT 4-2",mount_6_1:"MOUNT 6-1"};let session,mission,crew=[],checks=[0,0,0,0];
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function load(){session=await requireAuth();if(!session)return;const {data:s}=await sb.from("overlay_operation_state").select("mission_id").eq("singleton",true).maybeSingle();if(!s?.mission_id){document.querySelector("#app").innerHTML='<div class="empty"><div class="eyebrow">OPERATIONS STAGING</div><h2>NO ACTIVE OPERATION</h2><p>Stand by for Command to open staging.</p></div>';return}const [{data:m},{data:sg}]=await Promise.all([sb.from("missions").select("id,title,start_time").eq("id",s.mission_id).single(),sb.from("mission_signups").select("user_id,status,operational_role,operational_station,overlay_readiness").eq("mission_id",s.mission_id)]);mission=m;const going=(sg||[]).filter(x=>String(x.status).toLowerCase()==="going"),ids=going.map(x=>x.user_id);let names={};if(ids.length){const {data:p}=await sb.from("profiles").select("user_id,handle,display_name").in("user_id",ids);(p||[]).forEach(x=>names[x.user_id]=x.handle||x.display_name||"CREW")}crew=going.map(x=>({...x,name:names[x.user_id]||"CREW"}));render();document.querySelector("#sync").textContent="● LIVE"}
function render(){const me=crew.find(x=>x.user_id===session.user.id),ready=crew.filter(x=>["acknowledged","on_station"].includes(x.overlay_readiness)).length,total=crew.length,pct=total?Math.round(ready/total*100):0,when=mission?.start_time?new Date(mission.start_time).toLocaleString([],{weekday:"short",day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"TIME TBA";document.querySelector("#app").innerHTML=`<section class="hero"><div class="eyebrow">OPERATION // FORMING</div><h1>${esc(mission.title)}</h1><div class="meta">${esc(when)} · RSI POLARIS · JMBN OPERATIONS</div></section><section class="grid"><div class="cell"><div class="label">YOUR ASSIGNMENT</div><div class="big">${esc(me?.operational_role||stations[me?.operational_station]||"NOT ASSIGNED")}</div><div class="meta">${esc(stations[me?.operational_station]||"Awaiting station assignment")}</div></div><div class="cell"><div class="label">CREW READINESS</div><div class="big">${ready} / ${total} READY</div><div class="bar"><i style="width:${pct}%"></i></div><div class="meta">${pct}% of assigned crew acknowledged</div></div></section><section class="checks"><div class="label">PRE-DEPLOYMENT CHECKLIST</div><div class="checkgrid">${[["⌖","LOADOUT READY","Weapon, ammo and gear set."],["◡","BIO BREAK COMPLETE","Take care of it now."],["◉","COMMS READY","Mic working and in channel."],["✚","MEDBAY RESPAWN SET","Respawn point set at Medbay."]].map((x,i)=>`<div class="check ${checks[i]?"on":""}" onclick="toggleCheck(${i})"><div>${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join("")}</div><button class="ready" id="readyBtn" onclick="markReady()" ${(!me?.operational_station||checks.some(x=>!x))?"disabled":""}>${["acknowledged","on_station"].includes(me?.overlay_readiness)?"✓ READY // DEPLOYMENT CONFIRMED":"✓ READY FOR DEPLOYMENT"}</button></section><section class="crew"><div class="label">POLARIS CREW</div>${Object.entries(stations).map(([id,label])=>{const x=crew.find(c=>c.operational_station===id),r=x&&["acknowledged","on_station"].includes(x.overlay_readiness);return `<div class="row"><span class="station">${label}</span><span>${esc(x?.name||"UNASSIGNED")}</span><span class="status ${r?"ready":""}">${x?(r?"READY":"ASSIGNED"):"—"}</span></div>`}).join("")}</section>`}
function toggleCheck(i){checks[i]=checks[i]?0:1;render()}async function markReady(){if(!mission)return;const {error}=await sb.rpc("set_my_overlay_readiness",{p_mission_id:mission.id,p_readiness:"acknowledged"});if(error)return alert(error.message);await load()}load();setInterval(load,10000);
</script></body></html>
