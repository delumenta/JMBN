name: Build JMBN Overlay
on:
  workflow_dispatch:
  push:
    paths:
      - 'overlay/**'
      - '.github/workflows/build-overlay.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish overlay/JMBNOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: JMBN-Polaris-Overlay-win-x64
          path: publish/JMBNOverlay.exe
          if-no-files-found: error
