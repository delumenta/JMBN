name: Vendor Supabase for Discord Activity
on:
  push:
    paths:
      - '.github/workflows/vendor-discord-supabase.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official Supabase browser bundle
        run: |
          set -euo pipefail
          mkdir -p discord-activity/vendor
          curl --fail --location --retry 3 --max-time 60 \
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js' \
            -o discord-activity/vendor/supabase.js
          test "$(wc -c < discord-activity/vendor/supabase.js)" -gt 100000
          grep -q 'createClient' discord-activity/vendor/supabase.js
      - name: Embed Supabase SDK directly in Discord Activity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          page=Path('discord-activity/index.html')
          sdk=Path('discord-activity/vendor/supabase.js').read_text()
          html=page.read_text()
          marker='<script>/* JMBN embedded Supabase SDK */'
          if marker in html:
              start=html.index(marker)
              end=html.index('</script>',start)+len('</script>')
              sdk=sdk.replace('</script','<\\/script').replace('</SCRIPT','<\\/SCRIPT')
              replacement=marker+chr(10)+sdk+chr(10)+'</script>'
              html=html[:start]+replacement+html[end:]
          else:
              start=html.index('<script>\\nwindow.__supabaseLoadErrors=') if '<script>\\nwindow.__supabaseLoadErrors=' in html else html.index('<script>window.__supabaseLoadErrors=')
              end=html.index('</script>',start)+len('</script>')
              sdk=sdk.replace('</script','<\\/script').replace('</SCRIPT','<\\/SCRIPT')
              replacement=marker+'\\n'+sdk+'\\n</script><script>window.__supabaseLoadErrors=[];window.__loadSupabase=async()=>!!window.supabase?.createClient;</script>'
              html=html[:start]+replacement+html[end:]
          page.write_text(html)
          PY
      - name: Commit vendored library and embedded Activity

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-activity/vendor/supabase.js discord-activity/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Supabase UMD bundle for Discord Activity"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
